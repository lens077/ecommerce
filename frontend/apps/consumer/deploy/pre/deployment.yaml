apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend-deploy
  namespace: ecommerce
  labels:
    app: ecommerce-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      name: ecommerce-frontend
      labels:
        app: ecommerce-frontend
    spec:
      containers:
        - name: ecommerce-frontend
          # Harbor 在本集群未部署（ARM64 卡在官方 v2.16 之前），改用 TCR。
          # 钉不可变 tag，不用 :dev —— latest/dev 这类浮动 tag 让"线上跑的到底是哪份代码"无从回答。
          image: ccr.ccs.tencentyun.com/sumery/ecommerce-frontend:sha-bf8dae2
          imagePullPolicy: Always
          ports:
            - containerPort: 30080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ecommerce-frontend-config
      restartPolicy: Always
      imagePullSecrets:
        - name: tcr-pull-secret
