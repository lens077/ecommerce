---
{
  apiVersion: "argoproj.io/v1alpha1",
  kind: "Rollout",
  metadata: {
    name: "ecommerce-frontend-deploy",
    namespace: "ecommerce",
    labels: {
      app: "ecommerce-frontend",
      app.kubernetes.io/part-of: "ecommerce",
    },
  },
  spec: {
    replicas: 1,
    selector: {
      matchLabels: {
        app: "ecommerce-frontend",
      },
    },
    template: {
      metadata: {
        labels: {
          app: "ecommerce-frontend",
          app.kubernetes.io/part-of: "ecommerce",
        },
      },
      spec: {
        topologySpreadConstraints: [{
          maxSkew: 1,
          topologyKey: "kubernetes.io/hostname",
          whenUnsatisfiable: "DoNotSchedule",
          nodeAffinityPolicy: "Honor",
          nodeTaintsPolicy: "Honor",
          labelSelector: {
            matchLabels: {
              app.kubernetes.io/part-of: "ecommerce",
            },
          },
        }],
        serviceAccountName: "ecommerce-frontend",
        automountServiceAccountToken: false,
        enableServiceLinks: false,
        securityContext: {
          runAsNonRoot: true,
          runAsUser: 1000,
          runAsGroup: 1000,
          fsGroup: 1000,
        },
        volumes: [{
          name: "caddy-config",
          emptyDir: {
            sizeLimit: "16Mi",
          },
        }, {
          name: "caddy-data",
          emptyDir: {
            sizeLimit: "16Mi",
          },
        }],
        containers: [{
          name: "ecommerce-frontend",
          image: "ccr.ccs.tencentyun.com/sumery/ecommerce-frontend:1.8.1@sha256:ab856ea115ee2348ee43d7617acd4494cb19b9bf64e16c709ce16da1fc2d6eda",
          imagePullPolicy: "Always",
          securityContext: {
            readOnlyRootFilesystem: true,
            allowPrivilegeEscalation: false,
            capabilities: {
              drop: [
                "ALL",
              ],
              add: [
                "NET_BIND_SERVICE",
              ],
            },
          },
          volumeMounts: [{
            name: "caddy-config",
            mountPath: "/config",
          }, {
            name: "caddy-data",
            mountPath: "/data",
          }],
          ports: [{
            containerPort: 80,
            protocol: "TCP",
          }],
          envFrom: [{
            configMapRef: {
              name: "ecommerce-frontend-config",
            },
          }],
        }],
        restartPolicy: "Always",
        imagePullSecrets: [{
          name: "tcr-pull-secret",
        }],
      },
    },
    strategy: {
      blueGreen: {
        activeService: "ecommerce-frontend-service",
        previewService: "ecommerce-frontend-preview-service",
        autoPromotionEnabled: false,
        scaleDownDelaySeconds: 30,
      },
    },
  },
}
