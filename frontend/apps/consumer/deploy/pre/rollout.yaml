---
{
  apiVersion: "argoproj.io/v1alpha1",
  kind: "Rollout",
  metadata: {
    name: "ecommerce-frontend-deploy",
    namespace: "ecommerce",
    labels: {
      app: "ecommerce-frontend",
      app.kubernetes.io/part-of: "ecommerce",
    },
  },
  spec: {
    replicas: 1,
    selector: {
      matchLabels: {
        app: "ecommerce-frontend",
      },
    },
    template: {
      metadata: {
        name: "ecommerce-frontend",
        labels: {
          app: "ecommerce-frontend",
          app.kubernetes.io/part-of: "ecommerce",
        },
      },
      spec: {
        topologySpreadConstraints: [{
          maxSkew: 1,
          topologyKey: "kubernetes.io/hostname",
          whenUnsatisfiable: "DoNotSchedule",
          nodeAffinityPolicy: "Honor",
          nodeTaintsPolicy: "Honor",
          labelSelector: {
            matchLabels: {
              app.kubernetes.io/part-of: "ecommerce",
            },
          },
        }],
        serviceAccountName: "ecommerce-frontend",
        automountServiceAccountToken: false,
        enableServiceLinks: false,
        containers: [{
          name: "ecommerce-frontend",
          image: "ccr.ccs.tencentyun.com/sumery/ecommerce-frontend:1.7.7@sha256:02dea7eb72bf67344c659bb241c9d846d3b2803a14a2b1ec8ebd039e52e6581a",
          imagePullPolicy: "Always",
          ports: [{
            containerPort: 80,
            protocol: "TCP",
          }],
          envFrom: [{
            configMapRef: {
              name: "ecommerce-frontend-config",
            },
          }],
        }],
        restartPolicy: "Always",
        imagePullSecrets: [{
          name: "tcr-pull-secret",
        }],
      },
    },
    strategy: {
      blueGreen: {
        activeService: "ecommerce-frontend-service",
        previewService: "ecommerce-frontend-preview-service",
        autoPromotionEnabled: false,
        scaleDownDelaySeconds: 30,
      },
    },
  },
}
