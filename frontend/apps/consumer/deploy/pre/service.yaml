apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend-service
  namespace: ecommerce
spec:
  selector:
    app: ecommerce-frontend
  ports:
    - protocol: TCP
      port: 30080
      targetPort: 80
  # 对外只经共享网关的 HTTPRoute（shop.apikv.com / shop.dev.test），
  # 不再单独占一个 LoadBalancer IP。
  type: ClusterIP
