services:
  frontend:
    image: ccr.ccs.tencentyun.com/sumery/frontend:dev
    container_name: ecommerce-frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # 环境变量
    environment:
      - GATEWAY_URL=http://localhost:8080 # 生产环境的网关地址
    restart: on-failure:4 # 重启策略，最多重启n次
