<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- 网页中所运行的应用程序的名称 -->
    <meta name="application-name" content="灯市" />
    <meta name="author" content="Lookeke<xiconz@qq.com>" />
    <!--	段简短而精确的、对页面内容的描述/书签的默认描述 -->
    <meta name="description" content="灯市——每件好物是一盏灯。数码、服饰、食百的综合商城。" />
    <!--
      本 SPA 的页面一律不收录：可收录的公开页（首页、商品详情）由 consumer-next 服务端渲染，
      网关把 `/`、`/zh`、`/en` 分给它；落到这里的购物车、结算、订单、个人中心是登录后页面，
      /categories 还是占位页，/product/$spuCode 与 consumer-next 的商品页重复。
      见 docs/design/platform/i18n-routing.md 第三节。所以这里也不放 keywords。
      以后要把某个 SPA 路由做成公开页，先迁到 consumer-next，不要删这一行。
    -->
    <meta name="robots" content="noindex" />
    <!--	生成此页面的软件的标识符-->
    <meta name="generator" content="" />
    <!--如果请求目标与当前页面一样安全或者更加安全（HTTP(S)→HTTPS），则发送完整 URL；如果请求目标更加不安全（HTTPS→HTTP），则不发送  referrer。这是默认行为。-->
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <!-- 页面颜色 -->
    <meta name="theme-color" media="(prefers-color-scheme:light)" content="#F6EFE1" />
    <!--  <meta name="theme-color" media="(prefers-color-scheme:black)" content="black" />-->

    <!--	非标准: 与当前文档兼容的一种或多种配色方案 -->
    <meta name="color-scheme" content="light dark" />

    <!-- Internet Explorer浏览器浏览时使用最高级模式渲染,使用Google Chrome Frame内核渲染 2014/2/25不支持 -->
    <meta name="http-equiv" content="IE=edge,chrome=1" />

    <!--	设置默认 CSS 样式表组的名称。 -->
    <meta http-equiv="default-style" content="base" />
    <link rel="icon" href="/favicon.ico" />
    <!--	<link rel="stylesheet" href="base.css" />-->

    <!-- apple移动设备图标类型 -->
    <!--	<link rel="apple-touch-icon-precomposed" sizes="114x114" href="apple-icon-114.png" type="image/png" />-->

    <!--	<link href="print.css" rel="stylesheet" media="print">-->

    <!--	移动端特有配置 -->
    <!--	<link href="mobile.css" rel="stylesheet" media="screen and (max-width: 600px)">-->
    <!-- 首屏占位，i18n 就绪后由 initI18n 的 titleKey 按当前语言改写 -->
    <title>灯市</title>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT - Dengshi (Lantern Market)
      THESIS: the mall homepage is a lantern street at night; every product is a lit
        paper lantern. Refuses the category default (carousel banner + icon grid + waterfall badges).
      OWN-WORLD: washi paper field #F6EFE1, charcoal ink #2A2A28, bamboo structural
        lines #D8B48A; vermilion #C2372B only on actions and prices; serif display;
        content lives inside glowing paper cards. Recognizable with all text removed.
      STORY: visitor knows in seconds this is a full-category mall, is pulled down the
        street by lanterns lighting up one by one, any lantern is one step to its product.
      FIRST VIEWPORT: left 55% ink display slogan + vermilion seal CTA; right 45%
        lantern-shaped hero lamp with today's product; stacked on mobile.
      FORM: Akari paper-lantern workshop, user-chosen challenger; seed key ee8c0618.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
        finish review, the verdict, and DESIGN.md.
    -->
    <div id="app"></div>
    <script type="module" src="/src/bootstrap.tsx"></script>
  </body>
</html>
