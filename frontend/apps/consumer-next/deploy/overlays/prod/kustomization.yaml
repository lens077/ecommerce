apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ccr.ccs.tencentyun.com/sumery/consumer-next
    newTag: "1.7.4"
    digest: sha256:48ce09474198ccd4ab52fe72673a5de873b6f137d0b0435e23662546641586af
patches:
  - target:
      kind: Deployment
      name: consumer-next
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: CONSUMER_NEXT_PUBLIC_URL
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://shop.apikv.com
