apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ccr.ccs.tencentyun.com/sumery/consumer-next
    newTag: "1.7.1"
    digest: sha256:63868eb4b3bab0eca5cd18f639f5adaf49750ec68fd19040d339ae1c36f0ec6c
patches:
  - target:
      kind: Deployment
      name: consumer-next
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/1/name
        value: CONSUMER_NEXT_PUBLIC_URL
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://shop.apikv.com
