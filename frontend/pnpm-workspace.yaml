packages:
  - apps/*
  - packages/*
allowBuilds:
  "@bufbuild/buf": true
catalog:
  "@bufbuild/buf": ^1.75.0
  "@bufbuild/protobuf": ^2.16.0
  "@bufbuild/protoc-gen-es": ^2.16.0
  "@connectrpc/connect": ^2.2.0
  "@connectrpc/connect-node": ^2.2.0
  "@connectrpc/connect-query": ^2.3.1
  "@connectrpc/connect-web": ^2.2.0
  "@emotion/react": ^11.14.0
  "@emotion/styled": ^11.14.1
  "@fontsource/noto-serif-sc": ^5.3.1
  "@fontsource/roboto": ^5.3.0
  "@mui/material": ^9.5.0
  "@mui/utils": ^9.5.0
  "@t3-oss/env-core": ^0.13.11
  "@tanstack/react-devtools": ^0.10.13
  "@tanstack/react-query": ^5.104.5
  "@tanstack/react-query-devtools": ^5.104.5
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/router-plugin": ^1.168.48
  "@tauri-apps/api": ^2.12.4
  "@tauri-apps/cli": ^2.12.4
  "@tauri-apps/plugin-http": ^2.8.3
  "@tauri-apps/plugin-notification": ^2.7.0
  "@tauri-apps/plugin-opener": ^2.7.2
  "@tauri-apps/plugin-store": ^2.5.0
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/browser-playwright": 5.0.5
  conventional-changelog: latest
  echarts: ^6.1.0
  echarts-for-react: ^3.0.6
  i18next: ^26.5.6
  jsdom: ^30.1.3
  jsonc-parser: ^3.3.1
  knip: ^6.42.1
  lucide: ^1.61.0
  morphicons: ^2.0.0
  # 16.4 canary 在本仓 6 轮 A/B 中缩短 cold/warm build 并减小缓存；
  # 精确锁定已通过 SSR 与真实浏览器验证的构建。
  next: 16.4.2
  oxc-transform-react: 0.155.0
  playwright: ^1.64.1
  "@playwright/test": ^1.64.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.3
  smol-toml: ^1.8.0
  # 7.1 nightly 的 checker 分配优化在本仓 6 轮 A/B 中将峰值 RSS 降低 17%~20%；
  # 精确锁定已验证构建，避免 nightly 标签漂移。
  typescript: 7.1.0-dev.20260904.1
  # Vite+ 与 core 必须锁死同一版本，避免插件解析出两份 Vite 类型。
  # pnpm 的 overrides 不创建依赖边：声明 vite-plus 的 package 还要直接声明 vite: catalog:，
  # 否则 Vitest 的 peer 解析会静默补装一份上游 Vite，旧的 vite build 脚本会误用它。
  # Vitest 也要与 Vite+ 内置版本一致；consumer 的浏览器测试需要直接依赖它。
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  # a11y 门禁：axe-core 的 vitest 封装（docs/frontend/accessibility.md §四.2）
  "vitest-axe": ^0.1.0
  "vitest-browser-react": ^2.3.0
  web-vitals: ^6.2.3
  yaml: ^2.9.0
  zod: ^4.6.7
  zustand: ^5.0.16
  "@ecommerce/icons": workspace:*
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4

# React Compiler 试点固定版本；仅 consumer 在 REACT_COMPILER=1 时启用。
catalogs:
  react-compiler-pilot:
    "@vitejs/plugin-react": 6.1.2

catalogMode: prefer

onlyBuiltDependencies:
  - "@bufbuild/buf"
  - "@swc/core"
  - esbuild
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    # 版本空窗期 workaround（2026-10）：@vitejs/plugin-react@6.1.2 的 peer 写死
    # oxc-transform-react: ^0.152.0（0.x 下等价 >=0.152 <0.153），但 catalog 已升到
    # 0.155.0 以支撑 consumer 的 React Compiler 试点。plugin-react 未发布放宽 peer 的
    # 版本前，用 allowedVersions 放行。待 plugin-react 升级到接受 0.155 的版本后删除此条。
    oxc-transform-react: ">=0.152.0 <1.0.0"
minimumReleaseAgeExclude:
  - playwright-core@1.63.0
  - playwright@1.63.0
  - vitest-browser-react@2.3.0
  - "@typescript/typescript-darwin-arm64@7.1.0-dev.20260904.1"
  - "@typescript/typescript-darwin-x64@7.1.0-dev.20260904.1"
  - "@typescript/typescript-linux-arm64@7.1.0-dev.20260904.1"
  - "@typescript/typescript-linux-arm@7.1.0-dev.20260904.1"
  - "@typescript/typescript-linux-x64@7.1.0-dev.20260904.1"
  - "@typescript/typescript-win32-arm64@7.1.0-dev.20260904.1"
  - "@typescript/typescript-win32-x64@7.1.0-dev.20260904.1"
  - typescript@7.1.0-dev.20260904.1
  - "@next/env@16.4.0-canary.18"
  - "@next/swc-darwin-arm64@16.4.0-canary.18"
  - "@next/swc-darwin-x64@16.4.0-canary.18"
  - "@next/swc-linux-arm64-gnu@16.4.0-canary.18"
  - "@next/swc-linux-arm64-musl@16.4.0-canary.18"
  - "@next/swc-linux-x64-gnu@16.4.0-canary.18"
  - "@next/swc-linux-x64-musl@16.4.0-canary.18"
  - "@next/swc-win32-arm64-msvc@16.4.0-canary.18"
  - "@next/swc-win32-x64-msvc@16.4.0-canary.18"
  - next@16.4.0-canary.18
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
