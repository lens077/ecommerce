<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
  :root {
    color-scheme: dark;
    --bg: #050a12;
    --ink: #eef6ff;

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); overflow: hidden; }
  body { display: grid; place-items: center; color: var(--ink); font: 14px/1.4 "IBM Plex Sans", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  #app { position: relative; width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); max-width: 1080px; max-height: 1920px; overflow: hidden; background: #050a12; box-shadow: 0 32px 110px rgba(0, 0, 0, .48); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; }
  #fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; color: #ffb8ad; background: #0a111c; }
  #fallback[hidden] { display: none; }
  @media (max-width: 560px) {
    body { background: #050a12; }
  }
  @media (prefers-reduced-motion: reduce) {
    canvas { cursor: default; }
  }
</style>
<script type="importmap">
{

    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<body>
<main id="app" role="application" aria-label="灯市电商全链路液态玻璃请求导体">
  <canvas id="canvas" aria-label="电商全链路请求导体可视化画布"></canvas>
  <div id="fallback" hidden>当前浏览器不支持 WebGL2。请使用现代 Chrome、Safari 或 Edge 打开此设计稿。</div>
</main>
<script type="module">
import * as THREE from 'three';

const DESIGN_W = 1080;
const DESIGN_H = 1920;
const app = document.getElementById('app');
const canvas = document.getElementById('canvas');
const fallback = document.getElementById('fallback');

const COLORS = {
  bg: 0x050a12,
  panel: 0x0e1a29,
  panelEdge: 0x5fcff5,
  ink: 0xeef6ff,
  muted: 0x8fa6bd,
  blue: 0x52a9ff,
  cyan: 0x71d9ff,
  cyanDeep: 0x1d607e,
  amber: 0xf6ba62,
  red: 0xff6b5d,
  green: 0x5bea9a,
  purple: 0x9d8cff,
  copper: 0xd49153,
  steel: 0x1b334e,
  steelDeep: 0x0b1827,
};

const STATES = ['up', 'degraded', 'down', 'unknown'];
const NODE_META = {
  consumer: { label: '客户端', source: 'browser', detail: 'consumer SPA / consumer-next' },
  pangolin: { label: 'Pangolin', source: 'gatus', detail: '公网隧道与 TLS 入口' },
  gateway: { label: 'Cilium Gateway', source: 'gatus', detail: 'Gateway API · 入口路由' },
  control: { label: 'control-tower', source: 'readyz', detail: 'Session、租户、路由与身份头' },
  service: { label: 'Go 服务', source: 'healthz', detail: 'ConnectRPC · Protovalidate · OTel' },
  data: { label: '数据层', source: 'healthz', detail: 'PostgreSQL / Elasticsearch / Kafka' },
  session: { label: 'Dragonfly Session', source: 'readyz', detail: '网关 readyz 的间接依赖', inferred: true },
  order: { label: 'svc.order', source: 'healthz', detail: '订单服务 · node103' },
  inventory: { label: 'svc.inventory', source: 'healthz', detail: '库存服务 · planned 依赖' },
  gorse: { label: 'Gorse', source: 'gatus', detail: '推荐引擎 · node2' },
};

const ROUTES = {
  search: { label: '搜索', level: 'A 匿名', path: ['consumer', 'pangolin', 'gateway', 'control', 'service', 'data'], note: 'anonymous_paths 放行，不查 Session' },
  product: { label: '商品详情', level: 'A 匿名', path: ['consumer', 'pangolin', 'gateway', 'control', 'service', 'gorse'], note: 'SSR 匿名取数，product → Gorse' },
  cart: { label: '加入购物车', level: 'B 访客', path: ['consumer', 'pangolin', 'gateway', 'control', 'service', 'data'], note: '识别访客 cookie，注入 anonymous 身份头' },
  login: { label: '登录', level: '—', path: ['consumer', 'pangolin', 'gateway', 'control', 'session'], note: 'BFF /auth/ · Casdoor code exchange · Session 写入 Dragonfly' },
  order: { label: '下单', level: 'C 登录', path: ['consumer', 'pangolin', 'gateway', 'control', 'order', 'inventory'], note: 'order → inventory 为 depends_on_planned，未接线' },
  payment: { label: '支付回调', level: 'A 匿名', path: ['pangolin', 'gateway', 'control', 'service', 'data'], note: '匿名清单放行，签名校验在 payment 内完成' },
};

const PRESETS = {
  clear: { label: '全部恢复', apply: () => ({}) },
  node103: { label: 'node103 离线', apply: () => ({ node103: 'down' }) },
  session: { label: 'Session 不可达', apply: () => ({ session: 'down' }) },
  tunnel: { label: 'node3 隧道断开', apply: () => ({ data: 'down', service: 'down', gorse: 'down' }) },
  cart: { label: 'cart 依赖降级', apply: () => ({ service: 'degraded', data: 'down' }) },
};

const GW_STEPS = ['清除伪造 x-md-* 头', '解析 Casdoor Session', '读取 Dragonfly Session', '执行 OpenFGA Check', '注入可信身份头', 'H2C 转发'];

function init() {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) {
    fallback.hidden = false;
    canvas.hidden = true;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(COLORS.bg, 1);
  renderer.domElement.setAttribute('aria-label', 'WebGL2 液态玻璃请求导体');

  const isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bgScene = new THREE.Scene();
  const glassScene = new THREE.Scene();
  const contentScene = new THREE.Scene();
  const bgCamera = new THREE.PerspectiveCamera(50, DESIGN_W / DESIGN_H, 1, 3000);
  bgCamera.position.set(0, 0, 2000);
  bgCamera.lookAt(0, 0, 0);
  const uiCamera = new THREE.OrthographicCamera(-DESIGN_W / 2, DESIGN_W / 2, DESIGN_H / 2, -DESIGN_H / 2, -100, 100);
  uiCamera.position.z = 10;

  const renderType = renderer.extensions.has('EXT_color_buffer_float') ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const paintComposeRT = new THREE.WebGLRenderTarget(DESIGN_W, DESIGN_H, {
    depthBuffer: true,
    stencilBuffer: false,
    generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter,
    magFilter: THREE.LinearFilter,
    type: renderType,
    format: THREE.RGBAFormat,
  });
  paintComposeRT.texture.colorSpace = THREE.SRGBColorSpace;
  paintComposeRT.texture.generateMipmaps = true;

  const state = {
    mode: 'mock',
    loggedIn: true,
    paused: false,
    allPaused: false,
    selected: 'control',
    routeKey: 'search',
    routeIndex: 0,
    routeProgress: 0,
    faults: {},
    trace: '点击场景按钮，让一颗请求光点走完整链路。',
    traceTone: 'normal',
    liveFailures: 0,
    liveTimer: null,
    lastFrame: performance.now(),
  };

  const ui = { text: {}, buttons: {}, nodeMeshes: new Map() };
  const interactive = [];
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  function worldPoint(x, y, z = 40) {
    return new THREE.Vector3(x - DESIGN_W / 2, DESIGN_H / 2 - y, z);
  }

  function roundedRectShape(w, h, r) {
    const shape = new THREE.Shape();
    const rr = Math.min(r, w / 2, h / 2);
    shape.moveTo(-w / 2 + rr, -h / 2);
    shape.lineTo(w / 2 - rr, -h / 2);
    shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + rr);
    shape.lineTo(w / 2, h / 2 - rr);
    shape.quadraticCurveTo(w / 2, h / 2, w / 2 - rr, h / 2);
    shape.lineTo(-w / 2 + rr, h / 2);
    shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - rr);
    shape.lineTo(-w / 2, -h / 2 + rr);
    shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + rr, -h / 2);
    return shape;
  }

  function addContentRect(x, y, w, h, color, opacity = 1, radius = 18, depth = 45, userData = {}) {
    const mesh = new THREE.Mesh(
      new THREE.ShapeGeometry(roundedRectShape(w, h, radius)),
      new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthTest: false, depthWrite: false })
    );
    mesh.position.copy(worldPoint(x + w / 2, y + h / 2, depth));
    mesh.userData = userData;
    contentScene.add(mesh);
    if (userData.action || userData.nodeId) interactive.push(mesh);
    return mesh;
  }

  function textSprite(key, text, x, y, w, h, size, color = '#eef6ff', options = {}) {
    const canvas2d = document.createElement('canvas');
    const scale = 2;
    canvas2d.width = Math.max(64, Math.round(w * scale));
    canvas2d.height = Math.max(32, Math.round(h * scale));
    const ctx = canvas2d.getContext('2d');
    const weight = options.weight || 500;
    const family = options.mono ? '"IBM Plex Mono", "SFMono-Regular", Consolas, monospace' : '"IBM Plex Sans", "PingFang SC", "Noto Sans CJK SC", sans-serif';
    ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size * scale}px ${family}`;
    ctx.textBaseline = options.baseline || 'middle';
    ctx.textAlign = options.align || 'left';
    const lines = String(text).split('\n');
    const lineHeight = (options.lineHeight || 1.35) * size * scale;
    const startY = canvas2d.height / 2 - (lines.length - 1) * lineHeight / 2;
    lines.forEach((line, index) => {
      const drawX = options.align === 'center' ? canvas2d.width / 2 : options.align === 'right' ? canvas2d.width - 2 * scale : 2 * scale;
      ctx.fillText(line, drawX, startY + index * lineHeight);
    });
    const texture = new THREE.CanvasTexture(canvas2d);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false, depthWrite: false }));
    sprite.position.copy(worldPoint(x + w / 2, y + h / 2, options.depth || 65));
    sprite.scale.set(w, h, 1);
    sprite.userData.canvas = canvas2d;
    sprite.userData.ctx = ctx;
    sprite.userData.texture = texture;
    sprite.userData.metrics = { w, h, size, color, options };
    contentScene.add(sprite);
    if (key) ui.text[key] = sprite;
    return sprite;
  }

  function updateText(key, text, color) {
    const sprite = ui.text[key];
    if (!sprite) return;
    const { canvas: canvas2d, ctx, texture, metrics } = sprite.userData;
    const { size, options } = metrics;
    ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
    ctx.fillStyle = color || metrics.color;
    const weight = options.weight || 500;
    const family = options.mono ? '"IBM Plex Mono", "SFMono-Regular", Consolas, monospace' : '"IBM Plex Sans", "PingFang SC", "Noto Sans CJK SC", sans-serif';
    ctx.font = `${weight} ${size * 2}px ${family}`;
    ctx.textBaseline = options.baseline || 'middle';
    ctx.textAlign = options.align || 'left';
    const lines = String(text).split('\n');
    const lineHeight = (options.lineHeight || 1.35) * size * 2;
    const startY = canvas2d.height / 2 - (lines.length - 1) * lineHeight / 2;
    lines.forEach((line, index) => {
      const drawX = options.align === 'center' ? canvas2d.width / 2 : options.align === 'right' ? canvas2d.width - 4 : 4;
      ctx.fillText(line, drawX, startY + index * lineHeight);
    });
    texture.needsUpdate = true;
  }

  function addRule(x1, y1, x2, y2, color, width = 2, opacity = 1) {
    const geometry = new THREE.BufferGeometry().setFromPoints([worldPoint(x1, y1, 30), worldPoint(x2, y2, 30)]);
    const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthTest: false }));
    contentScene.add(line);
    return line;
  }

  function addDot(x, y, radius, color, opacity = 1, nodeId = null) {
    const dot = new THREE.Mesh(new THREE.CircleGeometry(radius, 18), new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthTest: false }));
    dot.position.copy(worldPoint(x, y, 60));
    dot.userData.nodeDot = nodeId;
    contentScene.add(dot);
    return dot;
  }

  function addButton(id, label, x, y, w, h, action, style = 'default') {
    const colors = style === 'primary'
      ? { fill: COLORS.cyanDeep, edge: COLORS.cyan, text: '#effbff' }
      : style === 'danger'
        ? { fill: 0x3a1c25, edge: COLORS.red, text: '#ffd8d4' }
        : { fill: COLORS.panel, edge: 0x3a607d, text: '#d8e8f5' };
    const mesh = addContentRect(x, y, w, h, colors.fill, .92, 16, 75, { action, id, style, baseFill: colors.fill, active: false });
    mesh.userData.edge = colors.edge;
    ui.buttons[id] = mesh;
    textSprite(`button:${id}`, label, x + 12, y + 1, w - 24, h - 2, Math.min(24, h * .34), colors.text, { align: 'center', weight: 600, mono: style === 'primary', depth: 82 });
    return mesh;
  }

  function setButtonActive(id, active) {
    const mesh = ui.buttons[id];
    if (!mesh) return;
    mesh.userData.active = active;
    mesh.material.color.setHex(active ? COLORS.cyanDeep : mesh.userData.baseFill);
    mesh.material.opacity = active ? .98 : .92;
  }

  function makeTexturedBackground() {
    const board = new THREE.Mesh(new THREE.PlaneGeometry(2300, 3400), new THREE.MeshBasicMaterial({ color: COLORS.bg }));
    board.position.set(0, 80, -240);
    bgScene.add(board);

    const gridMaterial = new THREE.LineBasicMaterial({ color: 0x102840, transparent: true, opacity: .68 });
    const gridPoints = [];
    for (let x = -620; x <= 620; x += 80) gridPoints.push(new THREE.Vector3(x, -980, -210), new THREE.Vector3(x, 1030, -210));
    for (let y = -980; y <= 1030; y += 80) gridPoints.push(new THREE.Vector3(-620, y, -210), new THREE.Vector3(620, y, -210));
    bgScene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(gridPoints), gridMaterial));

    const layerYs = [650, 350, 40, -270, -580];
    const layerColors = [COLORS.blue, COLORS.copper, COLORS.cyan, COLORS.purple, COLORS.green];
    layerYs.forEach((y, layerIndex) => {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(860, 10, 22), new THREE.MeshStandardMaterial({ color: 0x17304a, roughness: .8, metalness: .25 }));
      beam.position.set(0, y, -45);
      bgScene.add(beam);
      const accent = new THREE.Mesh(new THREE.BoxGeometry(860, 3, 25), new THREE.MeshBasicMaterial({ color: layerColors[layerIndex], transparent: true, opacity: .78 }));
      accent.position.set(0, y + 7, -34);
      bgScene.add(accent);
      for (let x = -440; x <= 440; x += 110) {
        const h = 32 + ((x + layerIndex * 43) % 5 + 5) * 12;
        const block = new THREE.Mesh(new THREE.BoxGeometry(46, h, 46), new THREE.MeshStandardMaterial({ color: layerIndex < 2 ? 0x12304a : 0x12283b, roughness: .82, metalness: .08, emissive: layerColors[layerIndex], emissiveIntensity: .045 }));
        block.position.set(x, y + h / 2 + 12, -24 - (x % 3) * 5);
        bgScene.add(block);
      }
    });

    const routePoints = [
      new THREE.Vector3(-430, 650, 12), new THREE.Vector3(-260, 350, 12), new THREE.Vector3(-85, 40, 12),
      new THREE.Vector3(95, -270, 12), new THREE.Vector3(270, -580, 12), new THREE.Vector3(430, -800, 12),
    ];
    const routeGeometry = new THREE.BufferGeometry().setFromPoints(routePoints);
    bgScene.add(new THREE.Line(routeGeometry, new THREE.LineBasicMaterial({ color: COLORS.copper, transparent: true, opacity: .76 })));
    routePoints.forEach((point, index) => {
      const node = new THREE.Mesh(new THREE.OctahedronGeometry(index === 3 ? 38 : 28, 0), new THREE.MeshStandardMaterial({ color: layerColors[index % layerColors.length], roughness: .55, metalness: .35, emissive: layerColors[index % layerColors.length], emissiveIntensity: .12 }));
      node.position.copy(point);
      bgScene.add(node);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(index === 3 ? 54 : 40, 2.2, 6, 20), new THREE.MeshBasicMaterial({ color: layerColors[index % layerColors.length], transparent: true, opacity: .38 }));
      ring.position.copy(point);
      ring.rotation.x = Math.PI / 2;
      bgScene.add(ring);
    });

    for (let i = 0; i < 36; i++) {
      const x = -520 + ((i * 173) % 1040);
      const y = -880 + ((i * 257) % 1680);
      const z = -110 + ((i * 31) % 100);
      const h = 18 + ((i * 19) % 72);
      const tower = new THREE.Mesh(new THREE.BoxGeometry(12 + (i % 3) * 6, h, 12 + (i % 2) * 8), new THREE.MeshStandardMaterial({ color: i % 3 ? 0x13263b : 0x192b41, roughness: .9, metalness: .08 }));
      tower.position.set(x, y, z);
      bgScene.add(tower);
    }

    bgScene.add(new THREE.HemisphereLight(0x7aa7d8, 0x08101b, 1.2));
    const key = new THREE.DirectionalLight(0xbad9ff, 2.2);
    key.position.set(-420, 720, 900);
    bgScene.add(key);
    return routePoints;
  }

  const routePoints = makeTexturedBackground();
  const heroPulse = new THREE.Mesh(new THREE.SphereGeometry(18, 14, 10), new THREE.MeshBasicMaterial({ color: COLORS.amber, toneMapped: false }));
  heroPulse.position.copy(routePoints[0]);
  bgScene.add(heroPulse);
  const ambientPulses = [];
  for (let i = 0; i < 14; i++) {
    const pulse = new THREE.Mesh(new THREE.SphereGeometry(5 + (i % 3), 8, 6), new THREE.MeshBasicMaterial({ color: i % 4 === 0 ? COLORS.amber : COLORS.cyan, toneMapped: false }));
    bgScene.add(pulse);
    ambientPulses.push({ mesh: pulse, offset: i / 14, speed: .045 + (i % 4) * .009 });
  }

  const rects = [
    [50 / DESIGN_W, 260 / DESIGN_H, 980 / DESIGN_W, 700 / DESIGN_H],
    [50 / DESIGN_W, 1010 / DESIGN_H, 980 / DESIGN_W, 280 / DESIGN_H],
    [50 / DESIGN_W, 1340 / DESIGN_H, 980 / DESIGN_W, 500 / DESIGN_H],
  ];
  const glassMaterial = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    transparent: true,
    depthTest: false,
    depthWrite: false,
    uniforms: {
      paintComposeRT: { value: paintComposeRT.texture },
      resolution: { value: new THREE.Vector2(DESIGN_W, DESIGN_H) },
      time: { value: 0 },
      rects: { value: rects.map(rect => new THREE.Vector4(...rect)) },
    },
    vertexShader: `
      in vec3 position;
      in vec2 uv;
      uniform mat4 projectionMatrix;
      uniform mat4 modelViewMatrix;
      out vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      uniform sampler2D paintComposeRT;
      uniform vec2 resolution;
      uniform float time;
      uniform vec4 rects[3];
      in vec2 vUv;
      out vec4 outColor;

      float roundedBoxSdf(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      float panelSdf(vec2 uv, vec4 rect) {
        vec2 center = vec2(rect.x + rect.z * .5, 1.0 - rect.y - rect.w * .5);
        vec2 halfSize = vec2(rect.z * .5, rect.w * .5);
        vec2 p = (uv - center) / halfSize;
        return roundedBoxSdf(p, vec2(1.0), .105);
      }

      float sceneSdf(vec2 uv) {
        return min(min(panelSdf(uv, rects[0]), panelSdf(uv, rects[1])), panelSdf(uv, rects[2]));
      }

      float heightField(vec2 uv) {
        float d = sceneSdf(uv);
        float inside = 1.0 - smoothstep(-.75, 0.0, d);
        float bevel = 1.0 - smoothstep(0.0, .26, abs(d));
        return inside * .74 + bevel * .32;
      }

      vec3 sampleFace(vec2 uv, vec2 bend) {
        return textureLod(paintComposeRT, clamp(uv + bend * .45, 0.001, .999), 0.0).rgb;
      }

      vec3 sampleInner(vec2 uv, vec2 bend) {
        vec2 innerBend = bend * 1.28 + vec2(.002 * sin(time * .35), 0.0);
        return textureLod(paintComposeRT, clamp(uv + innerBend, 0.001, .999), 1.15).rgb;
      }

      vec3 sampleOuter(vec2 uv, vec2 bend, float dispersion) {
        vec2 base = uv + bend * .72;
        float r = textureLod(paintComposeRT, clamp(base + vec2(dispersion, 0.0), 0.001, .999), .35).r;
        float g = textureLod(paintComposeRT, clamp(base, 0.001, .999), .35).g;
        float b = textureLod(paintComposeRT, clamp(base - vec2(dispersion, 0.0), 0.001, .999), .35).b;
        return vec3(r, g, b);
      }

      float distributionGGX(float nDotH, float roughness) {
        float a = roughness * roughness;
        float a2 = a * a;
        float denominator = nDotH * nDotH * (a2 - 1.0) + 1.0;
        return a2 / max(3.14159 * denominator * denominator, .0001);
      }

      float geometrySchlickGGX(float nDotV, float roughness) {
        float r = roughness + 1.0;
        float k = (r * r) / 8.0;
        return nDotV / max(nDotV * (1.0 - k) + k, .0001);
      }

      float geometrySmith(float nDotV, float nDotL, float roughness) {
        return geometrySchlickGGX(nDotV, roughness) * geometrySchlickGGX(nDotL, roughness);
      }

      vec3 fresnelSchlick(float cosTheta, vec3 f0) {
        return f0 + (1.0 - f0) * pow(1.0 - cosTheta, 5.0);
      }

      void main() {
        vec2 screenUv = vec2(vUv.x, 1.0 - vUv.y);
        float d = sceneSdf(screenUv);
        float mask = 1.0 - smoothstep(0.0, .025, d);
        float edge = 1.0 - smoothstep(0.0, .055, abs(d));
        float eps = 1.35 / resolution.y;
        float hx = heightField(screenUv + vec2(eps, 0.0)) - heightField(screenUv - vec2(eps, 0.0));
        float hy = heightField(screenUv + vec2(0.0, eps)) - heightField(screenUv - vec2(0.0, eps));
        vec2 normalXY = normalize(vec2(-hx, -hy) + vec2(.0001));
        vec2 bend = normalXY * (.008 + edge * .027);

        vec3 face = sampleFace(vUv, bend);
        vec3 inner = sampleInner(vUv, bend);
        vec3 outer = sampleOuter(vUv, bend, .006 + edge * .014);
        vec3 refracted = mix(mix(face, inner, .42), outer, .28 + edge * .16);

        vec3 N = normalize(vec3(normalXY * .55, .84));
        vec3 V = normalize(vec3(.05, .1, 1.0));
        vec3 L = normalize(vec3(-.45, .68, .72));
        vec3 H = normalize(V + L);
        float nDotL = max(dot(N, L), 0.0);
        float nDotV = max(dot(N, V), 0.0);
        float nDotH = max(dot(N, H), 0.0);
        vec3 f0 = vec3(.045, .12, .18);
        vec3 F = fresnelSchlick(max(dot(H, V), 0.0), f0);
        float specular = distributionGGX(nDotH, .22) * geometrySmith(nDotV, nDotL, .22) / max(4.0 * nDotV * nDotL, .001);
        vec3 brdf = F * specular * nDotL * vec3(.32, .72, 1.0);

        vec3 rim = vec3(.18, .72, .96) * edge * (.18 + .82 * (1.0 - nDotV));
        vec3 tint = vec3(.035, .12, .2) * mask;
        vec3 color = refracted * (.78 + .12 * mask) + brdf + rim + tint;
        float alpha = mask * .76 + edge * .1;
        if (alpha < .01) discard;
        outColor = vec4(color, alpha);
      }
    `,
  });
  glassScene.add(new THREE.Mesh(new THREE.PlaneGeometry(DESIGN_W, DESIGN_H), glassMaterial));

  function buildContent() {

    textSprite('detail', 'control-tower  ·  readyz  ·  Session、租户、路由与身份头', 90, 1215, 820, 38, 15, '#8fa6bd', { depth: 86 });
    addContentRect(790, 1052, 164, 58, 0x173149, .82, 29, 86);

    textSprite('controlKicker', 'CONTROL SURFACE', 90, 1380, 360, 28, 13, '#71d9ff', { mono: true, weight: 700, depth: 86 });
    textSprite('controlTitle', '切换数据源，或注入一次故障', 90, 1422, 820, 44, 24, '#eef6ff', { weight: 700, depth: 86 });

    addButton('mode:mock', '模拟', 90, 1530, 132, 58, 'mode:mock', 'primary');
    addButton('mode:live', '真实', 232, 1530, 132, 58, 'mode:live');

    textSprite('scenarioLabel', 'SCENARIOS', 90, 1620, 220, 24, 12, '#7795ad', { mono: true, weight: 700, depth: 86 });
    const scenarioButtons = [
      ['scenario:search', '搜索', 90, 1654, 'scenario:search'],
      ['scenario:product', '商品详情', 244, 1654, 'scenario:product'],
      ['scenario:cart', '加入购物车', 398, 1654, 'scenario:cart'],

    ];
    scenarioButtons.forEach(([id, label, x, y, action]) => addButton(id, label, x, y, 132, 54, action));

    textSprite('presetLabel', 'FAULT PLAYS', 90, 1748, 220, 24, 12, '#7795ad', { mono: true, weight: 700, depth: 86 });
    addButton('preset:clear', '全部恢复', 90, 1780, 174, 48, 'preset:clear');
    addButton('preset:node103', 'node103 离线', 278, 1780, 174, 48, 'preset:node103', 'danger');
    addButton('preset:session', 'Session 不可达', 466, 1780, 174, 48, 'preset:session', 'danger');
    addButton('preset:tunnel', 'node3 隧道断开', 654, 1780, 174, 48, 'preset:tunnel', 'danger');
    addButton('preset:cart', 'cart 依赖降级', 842, 1780, 174, 48, 'preset:cart', 'danger');
    textSprite('footer', 'SPACE 暂停脉冲   ·   P 暂停全部   ·   R 恢复   ·   点击节点查看来源', 90, 1864, 900, 24, 12, '#628199', { mono: true, depth: 86 });
  }
  buildContent();

  function nodePosition(nodeId) {
    const index = { consumer: 0, pangolin: 1, gateway: 2, control: 3, service: 4, data: 5, gorse: 5, session: 5, order: 4, inventory: 5 }[nodeId] ?? 3;
    return routePoints[Math.min(index, routePoints.length - 1)].clone();
  }

  function effectiveState(id) {
    const raw = state.faults[id] || 'up';
    if (id === 'control' && state.faults.session && state.faults.session !== 'up') return 'down';
    if (['order', 'inventory'].includes(id) && state.faults.node103 === 'down') return 'unknown';
    return raw;
  }

  function passable(id) {
    const status = effectiveState(id);
    return status === 'up' || status === 'degraded';
  }

  function setTrace(text, tone = 'normal') {
    state.trace = text;
    state.traceTone = tone;
    updateText('trace', text, tone === 'fail' ? '#ff8d80' : tone === 'stop' ? '#f6ba62' : '#a9c2d5');
  }

  function updateNodeVisuals() {
    for (const [id, mesh] of ui.nodeMeshes) {
      const status = effectiveState(id);
      mesh.material.color.setHex(status === 'up' ? 0x0b2434 : status === 'degraded' ? 0x312715 : status === 'down' ? 0x32181e : 0x121b26);
      const dot = contentScene.children.find(child => child.userData?.nodeDot === id);
      if (dot) dot.material.color.setHex(status === 'up' ? COLORS.cyan : status === 'degraded' ? COLORS.amber : status === 'down' ? COLORS.red : 0x35485a);
    }
  }

  function updateUI() {
    const route = ROUTES[state.routeKey];
    const currentId = route.path[Math.min(state.routeIndex, route.path.length - 1)];
    const currentMeta = NODE_META[currentId] || NODE_META.service;
    updateText('readoutTitle', `${route.label} · ${route.level}`);
    updateText('routeNote', state.traceTone === 'fail' || state.traceTone === 'stop' ? state.trace : route.note, state.traceTone === 'fail' ? '#ff8d80' : state.traceTone === 'stop' ? '#f6ba62' : '#f6ba62');
    updateText('gatewaySteps', currentId === 'control' ? `网关治理  ·  ${GW_STEPS[Math.min(state.routeIndex, GW_STEPS.length - 1)]}` : '网关治理  ·  请求沿主脊线继续向下一层流动');
    updateText('detail', `${currentMeta.label}  ·  ${currentMeta.source}${currentMeta.inferred ? '  ·  推断态' : ''}  ·  ${currentMeta.detail}`);
    updateText('stateBadge', `${effectiveState(currentId).toUpperCase()} · ${state.mode.toUpperCase()}`, effectiveState(currentId) === 'down' ? '#ff8d80' : effectiveState(currentId) === 'degraded' ? '#f6ba62' : '#74e4aa');
    updateText('modeNote', state.mode === 'mock' ? '本地状态契约 · 每颗光点都可停在故障前' : '真实源 · admin · 失败三次自动退回模拟');
    setButtonActive('mode:mock', state.mode === 'mock');
    setButtonActive('mode:live', state.mode === 'live');
    setButtonActive('auth', state.loggedIn);
    Object.keys(ROUTES).forEach(key => setButtonActive(`scenario:${key}`, key === state.routeKey));
    updateNodeVisuals();
  }

  function setRoute(routeKey) {
    state.routeKey = routeKey;
    state.routeIndex = 0;
    state.routeProgress = 0;
    state.paused = false;
    const route = ROUTES[routeKey];
    setTrace(`${route.label} 已发起 · ${route.note}`);
    updateUI();
  }

  function applyPreset(presetKey) {
    const preset = PRESETS[presetKey];
    state.faults = preset.apply();
    state.routeIndex = 0;
    state.routeProgress = 0;
    state.paused = false;
    if (presetKey === 'clear') setTrace('所有模拟故障已清除，链路恢复为默认状态。');
    else setTrace(`${preset.label} · 等待下一颗请求光点验证 fail-closed。`, 'stop');
    updateUI();
  }

  function toggleMode(mode) {
    if (mode === state.mode) return;
    state.mode = mode;
    if (mode === 'mock') {
      clearTimeout(state.liveTimer);
      state.liveFailures = 0;
      state.faults = {};
      setTrace('已切回模拟状态，故障剧本重新接管。');
      updateUI();
      return;
    }
    setTrace('正在请求 /topology/state · 真实模式不可手动改状态。');
    pollLive();
  }

  function validateSnapshot(snapshot) {
    if (!snapshot || typeof snapshot !== 'object' || !snapshot.blocks) throw new Error('响应缺少 blocks');
    for (const id of Object.keys(NODE_META)) {
      if (snapshot.blocks[id] && !STATES.includes(snapshot.blocks[id].state)) throw new Error(`${id} 的 state 不合法`);
    }
    return snapshot;
  }

  async function pollLive() {
    try {
      const response = await fetch('/topology/state', { credentials: 'include' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const snapshot = validateSnapshot(await response.json());
      const generatedAt = Date.parse(snapshot.generated_at);
      const stale = !Number.isFinite(generatedAt) || Date.now() - generatedAt > 3 * (snapshot.interval_seconds || 30) * 1000;
      state.faults = {};
      for (const [id, block] of Object.entries(snapshot.blocks)) if (NODE_META[id]) state.faults[id] = stale ? 'unknown' : block.state;
      state.liveFailures = 0;
      setTrace(stale ? '真实源样本已过期，所有未确认块转为 unknown。' : '真实源已连接 · 状态来自 topology-health 聚合器。', stale ? 'stop' : 'normal');
      updateUI();
      clearTimeout(state.liveTimer);
      state.liveTimer = setTimeout(pollLive, Math.max(5, Number(snapshot.interval_seconds) || 30) * 1000);
    } catch (error) {
      state.liveFailures += 1;
      setTrace(`真实源失败 ${state.liveFailures}/3 · ${error.message}`, 'fail');
      if (state.liveFailures >= 3) {
        state.mode = 'mock';
        state.faults = {};
        setTrace('真实源不可达，已退回模拟。');
        updateUI();
        return;
      }
      clearTimeout(state.liveTimer);
      state.liveTimer = setTimeout(pollLive, 10000);
    }
  }

  function handleAction(action) {
    if (action === 'mode:mock') toggleMode('mock');
    else if (action === 'mode:live') toggleMode('live');
    else if (action === 'toggle-auth') {
      state.loggedIn = !state.loggedIn;
      setTrace(state.loggedIn ? '已登录：C 级场景允许继续经过网关。' : '已登出：C 级场景将在 control-tower fail-closed。', state.loggedIn ? 'normal' : 'stop');
      updateUI();
    } else if (action.startsWith('scenario:')) setRoute(action.slice('scenario:'.length));
    else if (action.startsWith('preset:')) applyPreset(action.slice('preset:'.length));
  }

  function pickObject(event) {
    const bounds = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
    pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
    raycaster.setFromCamera(pointer, uiCamera);
    return raycaster.intersectObjects(interactive, false)[0]?.object || null;
  }

  canvas.addEventListener('pointerup', event => {
    const object = pickObject(event);
    if (!object) return;
    if (object.userData.action) handleAction(object.userData.action);
    if (object.userData.nodeId) {
      state.selected = object.userData.nodeId;
      state.routeIndex = Math.max(0, ROUTES[state.routeKey].path.indexOf(state.selected));
      setTrace(`${NODE_META[state.selected].label} 已选中 · ${NODE_META[state.selected].detail}`);
      updateUI();
    }
  });
  canvas.addEventListener('pointermove', event => {
    canvas.style.cursor = pickObject(event) ? 'pointer' : 'default';
  });

  function focusRouteNode(nodeId) {
    heroPulse.position.copy(nodePosition(nodeId));
  }

  function routeKeyNeedsAuth(route) {
    return route.level.startsWith('C');
  }

  function updateSimulation(dt, elapsed) {
    if (state.allPaused) return;
    ambientPulses.forEach(pulse => {
      const progress = (elapsed * pulse.speed + pulse.offset) % 1;
      const segment = Math.min(routePoints.length - 2, Math.floor(progress * (routePoints.length - 1)));
      const local = progress * (routePoints.length - 1) - segment;
      pulse.mesh.position.lerpVectors(routePoints[segment], routePoints[segment + 1], local);
    });
    if (!state.paused && !isReducedMotion) {
      const route = ROUTES[state.routeKey];
      const currentId = route.path[state.routeIndex];
      const nextId = route.path[state.routeIndex + 1];
      if (!nextId) {
        state.routeIndex = 0;
        state.routeProgress = 0;
        focusRouteNode(currentId);
      } else {
        state.routeProgress += dt * .42;
        heroPulse.position.lerpVectors(nodePosition(currentId), nodePosition(nextId), Math.min(state.routeProgress, 1));
        if (state.routeProgress >= 1) {
          state.routeProgress = 0;
          if (routeKeyNeedsAuth(route) && currentId === 'control' && !state.loggedIn) {
            setTrace('✕ control-tower · UNAUTHENTICATED · C 级请求被 fail-closed。', 'fail');
            state.paused = true;
          } else if (routeKeyNeedsAuth(route) && currentId === 'order' && nextId === 'inventory') {
            setTrace('■ order → inventory · depends_on_planned · 未接线，脉冲停止。', 'stop');
            state.paused = true;
          } else if (!passable(nextId)) {
            const status = effectiveState(nextId);
            setTrace(`✕ ${NODE_META[nextId]?.label || nextId} · ${status} · UNAVAILABLE，脉冲停在当前块。`, 'fail');
            state.paused = true;
          } else {
            state.routeIndex += 1;
            const meta = NODE_META[nextId] || NODE_META.service;
            setTrace(`→ ${meta.label} · ${meta.source} · ${meta.detail}`);
          }
          updateUI();
        }
      }
    }
    heroPulse.material.opacity = isReducedMotion ? 1 : .72 + Math.sin(elapsed * 5) * .22;
    glassMaterial.uniforms.time.value = elapsed;
  }

  function renderFrame(now) {
    const dt = Math.min((now - state.lastFrame) / 1000, .05);
    state.lastFrame = now;
    const elapsed = now / 1000;
    updateSimulation(dt, elapsed);

    // Strict composition: Background -> Glass -> Content.
    renderer.setRenderTarget(paintComposeRT);
    renderer.clear(true, true, true);
    renderer.render(bgScene, bgCamera);
    renderer.setRenderTarget(null);
    // WebGLRenderer generates the render-target mip chain for textureLod sampling.
    if (typeof renderer.updateRenderTargetMipmap === 'function') renderer.updateRenderTargetMipmap(paintComposeRT);
    renderer.clear(true, true, true);
    renderer.render(bgScene, bgCamera);
    renderer.clearDepth();
    renderer.render(glassScene, uiCamera);
    renderer.clearDepth();
    renderer.render(contentScene, uiCamera);
    requestAnimationFrame(renderFrame);
  }

  function resize() {
    renderer.setSize(app.clientWidth, app.clientHeight, false);
    bgCamera.aspect = DESIGN_W / DESIGN_H;
    bgCamera.updateProjectionMatrix();
    glassMaterial.uniforms.resolution.value.set(DESIGN_W, DESIGN_H);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', event => {
    if (event.key === ' ') { state.paused = !state.paused; setTrace(state.paused ? '脉冲已暂停。' : '脉冲继续沿请求导体流动。'); event.preventDefault(); }
    if (event.key.toLowerCase() === 'p') state.allPaused = !state.allPaused;
    if (event.key.toLowerCase() === 'r') { state.faults = {}; state.paused = false; state.routeIndex = 0; state.routeProgress = 0; setTrace('场景已恢复，继续观察默认搜索链路。'); updateUI(); }
  });

  resize();
  updateUI();
  requestAnimationFrame(renderFrame);
  window.__voxelLiquidGlass = { state, paintComposeRT, bgScene, glassScene, contentScene, renderPipeline: 'Background -> Glass -> Content' };
}

init();
