apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-gateway-deploy
  namespace: ecommerce
  labels:
    app: ecommerce-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-gateway
  template:
    metadata:
      name: ecommerce-gateway
      labels:
        app: ecommerce-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ecommerce-gateway
          image: ccr.ccs.tencentyun.com/sumery/ecommerce-gateway:sha-03f9fa5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: ecommerce-gateway
            - name: SERVICE_VERSION
              value: v1
            - name: CONFIG_SOURCE_FILE
              value: /etc/ecommerce/config-source/gateway.yaml
            - name: CONSUL_ADDR
              value: consul://consul-server.consul.svc.cluster.local:8500
            # Consul 自 2026-08-18 开了 ACL(default_policy=deny)。不带 token 的症状
            # **不是报错而是查不到**：读操作返回 200 但结果被 ACL 过滤成空
            # （/v1/health/service/xxx → []），表现为"服务活着但网关永远路由不到"。
            # 环境变量名必须是 CONSUL_HTTP_TOKEN（consul/api 的兜底读取），
            # 不是 backend/constants 里那个未被 registry 读取的 CONSUL_TOKEN。
            - name: CONSUL_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consul-ecommerce-token
                  key: CONSUL_HTTP_TOKEN
          envFrom:
            - configMapRef:
                name: ecommerce-gateway-config
          volumeMounts:
            - name: config-source
              mountPath: /etc/ecommerce/config-source
              readOnly: true
            # RBAC 角色缓存用的 Redis CA。集群内 Redis 是原生 TLS，不给 CA 连不上。
            # ⚠️ 用**独立目录**而不是往 /etc/ssl/certs 里挂 —— 整卷挂载会遮蔽系统 CA 包，
            #    容器内所有公网 HTTPS（含调 Casdoor）都会 x509 失败。本仓踩过两次。
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
      volumes:
        - name: config-source
          secret:
            secretName: ecommerce-config-source-pre
            defaultMode: 0400
        - name: redis-tls
          secret:
            # 集群内 Redis 的 CA（cert-manager 的 global-ca-issuer 签），
            # 需先把 redis 命名空间的 redis-tls 的 ca.crt 复制到本命名空间：
            #   kubectl -n redis get secret redis-tls -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
            #   kubectl -n <ns> create secret generic redis-tls-ca --from-file=ca.crt=/tmp/ca.crt
            secretName: redis-tls-ca
            defaultMode: 0444
            optional: true   # 缺了只是退化成仅进程内缓存，不该让网关起不来
      restartPolicy: Always
      
