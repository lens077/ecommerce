apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-gateway-config
  namespace: ecommerce
data:
  OWNER: "org-ecommerce"
  CASDOOR_URL: "https://casdoor.apikv.com"
  # ⚠️ 集群 Consul **没有 8501/https** —— `kubectl -n consul get svc consul-server` 只有
  #    http:8500 与 grpc:8502。写 8501+https 的症状是 `context deadline exceeded`
  #    （而不是"连接被拒"），很像网络抖动，实际是打到了一个没人听的端口。
  CONSUL_ADDR: "consul://consul-server.consul.svc.cluster.local:8500"
  CONSUL_SCHEME: "http"
  CONSUL_INSECURE_SKIP_VERIFY: "false"
  POLICIES_FILE_PATH: "./dynamic-config/policies/policies.csv"
  MODEL_FILE_PATH: "./dynamic-config/policies/model.conf"
  # RBAC 角色缓存（省掉每个受保护请求都跨公网打一次 Casdoor 的 /api/get-user）。
  # ⚠️ 必须用**集群内**的 Redis：网关在局域网、Casdoor 在公网 VPS，
  #    把缓存放到 Casdoor 同机等于读缓存也要跨公网，一点都不省。
  # 端口 6379 是 Service 端口，后端容器听的是 6380 的 TLS 口 —— 所以要给 CA。
  REDIS_ADDR: "redis.redis.svc.cluster.local:6379"
  REDIS_DB: "0"
  REDIS_TLS_CA_FILE: "/etc/redis-tls/ca.crt"
  # 调大省调用，但 Casdoor 侧改角色要等这么久才生效；要即时生效走 InvalidateRole
  RBAC_ROLE_CACHE_TTL: "5m"
  USE_TLS: "false"
  USE_HTTP3: "false"
  HTTP_PORT: "8080"
