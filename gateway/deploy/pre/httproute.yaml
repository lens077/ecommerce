# 网关的对外入口。两条路由：
#   *.dev.test      局域网直连（与其它组件口径一致）
#   gateway.apikv.com  公网，经 Pangolin 隧道进来（资源 14，target 10.99.145.85:443 https）
#
# ⚠️ parentRef 必须带 `sectionName: https`：本仓所有 HTTPRoute 都只挂 443 listener，
#    80 上没有任何路由，envoy 对一切 Host 返 404。Pangolin 侧 target 也因此必须走 443/https，
#    写 80 会得到一个"隧道明明通了却全是 404"的假象（判据：响应头 server: envoy）。
#
# 这里**不做 80→443 重定向**：真实客户端（浏览器 fetch / Connect-RPC）不会依赖它，
# 而公网侧的 TLS 已由 Pangolin 的 Traefik 终结，再来一层跳转只会多一跳。
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecommerce-gateway
  namespace: ecommerce
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "gateway.dev.test"
    - "gateway.apikv.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ecommerce-gateway-service
          port: 8080
