# .service-matrix.yaml — 服务拓扑真相源
#
# 作用：让 AI 和 CI 不再靠搜 docs/design/ 猜服务关系、路径和配置键。
# 判据：凡是「AI 每次都要现搜一遍」的结构性事实，都应该在这里查表拿到。
#
# ⚠️ 纪律：
#   1. 本文件只记录**结构事实**，不记录设计理由（那在 docs/design/）也不记录进度（那在 TODO.md）
#   2. depends_on = 代码里真的接线了；depends_on_planned = 设计要求但尚未接线。不要混
#   3. 必需配置键**不在本文件重复** —— 已由各服务 internal/conf/v1/conf.proto 的
#      (buf.validate.field).required 声明，重复会漂移。见 config_validation 段
#   4. 不写凭据

version: 1

layout:
  # Config Center 已独立发布；其他服务仍在单仓。
  mode: hybrid
  backend_service: "backend/services/{service}"
  backend_proto: "backend/api/{service}/v1"
  service_conf: "backend/services/{service}/internal/conf/v1/conf.proto"
  frontend_app: "frontend/apps/{app}"
  frontend_package: "frontend/packages/{pkg}"
  # gateway: 旧网关目录已于 2026-08-24 删除。网关在同级仓 control-tower/services/gateway

conventions:
  # Config Center 是 10 个业务服务唯一的 Bootstrap 来源。
  config_center_key: "{service}/{env}/bootstrap.yaml"
  config_source_secret: "ecommerce-config-source-{env}"
  consul_addr_local: "192.168.3.120:8500" # 见 context/team/local-env.md
  common_config_blocks: [server, data, observability, discovery, log]

config_validation:
  # 必需性的唯一真相源是各服务的 conf.proto，例如：
  #   behavior: Recommend recommend = 6 [(buf.validate.field).required = true];
  #   product:  Recommend recommend = 8 [(buf.validate.field).required = false];
  declared_in: "backend/services/{service}/internal/conf/v1/conf.proto → message Bootstrap"
  # ✅ 2026-08-18 已接线：decodeConfig 开 ErrorUnused（未知键报错）、Init/热更新
  # 在解码后调 protovalidate.Validate（validateBootstrap）。启动时校验失败 → 起不来；
  # 热更新校验失败 → 保留当前配置只记 ERROR。每个服务的 config 包新增
  # TestRealConfigFiles_DecodeAndValidate,在有 configs/{dev,pre}.yml 的机器上
  # 验证真实配置过得了校验（文件 gitignore,CI 里自动 skip）。
  enforced_by: "backend/services/{service}/internal/pkg/config/config.go → validateBootstrap + ErrorUnused"
  rollout_warning: |
    服务重启后会用新校验读配置中心的 bootstrap.yaml：其中有未知键或缺 required 段
    的副本会让服务直接起不来。发布前先按本地 configs/{dev,pre}.yml 对齐配置中心内容
    （behavior 的副本曾有 conf.proto 未定义的 log.elasticsearch 块，本地已删，
    配置中心那份未核实）。
  remaining:
    - "CI 里按本文件的服务清单校验每个 {service}/dev/bootstrap.yaml 可解码且通过 validate（需 CI 能访问配置中心，暂缓）"
  see: "context/project/ecommerce/behavior/experience/consul-kv-missing-key-silent-disable.md"

