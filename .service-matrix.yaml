# .service-matrix.yaml — 服务拓扑真相源
#
# 作用：让 AI 和 CI 不再靠搜 docs/design/ 猜服务关系、路径和配置键。
# 判据：凡是「AI 每次都要现搜一遍」的结构性事实，都应该在这里查表拿到。
#
# ⚠️ 纪律：
#   1. 本文件只记录**结构事实**，不记录设计理由（那在 docs/design/）也不记录进度（那在 TODO.md）
#   2. depends_on = 代码里真的接线了；depends_on_planned = 设计要求但尚未接线。不要混
#   3. 必需配置键**不在本文件重复** —— 已由各服务 internal/conf/v1/conf.proto 的
#      (buf.validate.field).required 声明，重复会漂移。见 config_validation 段
#   4. 不写凭据
#   5. **选型决策不进本表**（真相源是 docs/TECH.md）。note 只写「现在是什么、接没接线、
#      有什么坑」，不写「为什么选它、将来换成谁、什么条件才重估」。
#      2026-08-28 教训：kafka 的 note 里留着「只有 NATS 不满足才重估 Kafka」这句已被
#      docs/TECH.md 推翻的决策——本表是 AI 查拓扑的第一站，混进过期决策比文档过期更误导。
#      需要指方向时只写一句「选型方向见 docs/TECH.md」，不复述结论。

version: 1

layout:
  # Config Center 已独立发布；其他服务仍在单仓。
  mode: hybrid
  backend_service: "backend/services/{service}"
  backend_proto: "backend/api/{service}/v1"
  service_conf: "backend/services/{service}/internal/conf/v1/conf.proto"
  frontend_app: "frontend/apps/{app}"
  frontend_package: "frontend/packages/{pkg}"
  # gateway: 旧网关目录已于 2026-08-24 删除。网关在同级仓 control-tower/services/gateway

conventions:
  # Config Center 是 10 个业务服务唯一的 Bootstrap 来源。
  config_center_key: "{service}/{env}/bootstrap.yaml"
  config_source_secret: "ecommerce-config-source-{env}"
  # Secret 是运维打包对象；每个 Pod 只能通过 secret.items 投射自己的 selector。
  config_source_projection: "{service}.yaml"
  consul_addr_local: "192.168.3.120:8500" # 见 context/team/local-env.md
  common_config_blocks: [server, data, observability, discovery, log]
  # 10 个单副本 API 必须跨服务共同计数；每个服务只看自己的 app 标签没有均衡作用。
  pod_topology_spread:
    label_key: app.kubernetes.io/part-of
    label_value: ecommerce
    topology_key: kubernetes.io/hostname
    max_skew: 1
    when_unsatisfiable: DoNotSchedule
    node_affinity_policy: Honor
    node_taints_policy: Honor

config_validation:
  # 必需性的唯一真相源是各服务的 conf.proto，例如：
  #   behavior: Recommend recommend = 6 [(buf.validate.field).required = true];
  #   product:  Recommend recommend = 8 [(buf.validate.field).required = false];
  declared_in: "backend/services/{service}/internal/conf/v1/conf.proto → message Bootstrap"
  # 机制：decodeConfig 开 ErrorUnused（未知键报错），Init/热更新在解码后调
  # protovalidate.Validate（validateBootstrap）。启动时校验失败 → 起不来；
  # 热更新校验失败 → 保留当前配置只记 ERROR。每个服务的 config 包有
  # TestRealConfigFiles_DecodeAndValidate,在有 configs/{dev,pre}.yml 的机器上
  # 验证真实配置过得了校验（文件 gitignore,CI 里自动 skip）。
  enforced_by: "backend/services/{service}/internal/pkg/config/config.go → validateBootstrap + ErrorUnused"
  rollout_warning: |
    服务重启后会用新校验读配置中心的 bootstrap.yaml：其中有未知键或缺 required 段
    的副本会让服务直接起不来。发布前先按本地 configs/{dev,pre}.yml 对齐配置中心内容
    （behavior 的副本曾有 conf.proto 未定义的 log.elasticsearch 块，本地已删，
    配置中心那份未核实）。
  see: "context/project/ecommerce/behavior/experience/consul-kv-missing-key-silent-disable.md"

# 外部基础设施（不是本仓的服务）────────────────────────────────────
externals:
  postgres: { host: "node1:30001", note: "10 个业务服务当前已切到 node3 Pigsty；客户端 sslmode=verify-ca，沿用 pg-main CA 兼容证书。集群内 CloudNativePG pg-main 处于 hibernate，不是当前主库；db=ecommerce，每服务独立 schema。选型方向见 docs/TECH.md" }
  redis: { host: "dragonfly.dragonfly.svc:6379", note: "集群内 Dragonfly 原生 TLS，6379 单口 TLS-only，明文被拒；宿主机走 Cilium Gateway 192.168.3.122:6380。业务服务只放可丢缓存，不得承载锁、幂等键或领域真相；control-tower gateway 的 BFF session 是已接受例外，依赖不可用时 fail-closed。旧 redis namespace 已删除，不存在回滚组件；Config Center 自身也是本项消费者（自举 Secret，不在 config.entry 里）" }
  consul: { host: "192.168.3.120:8500", note: "集群内工作负载使用 consul-server.consul.svc:8500；本地进程使用 LoadBalancer VIP。Consul 只承担注册发现，配置仍由 Config Center 提供" }
  kafka: { host: "node1:30004", used_by: [], note: "node3 已预建 Kafka SCRAM 用户与 ecommerce.events topic；本仓当前无客户端、producer、consumer 或业务接线（used_by 为空即事实）。选型方向见 docs/TECH.md" }
  casdoor: { host: "casdoor.apikv.com", note: "HTTPS 经 Pangolin（8000 明文口已关，2026-08-19 起）；JWT 公钥 kid=lens；2026-08-20 定稿收编进集群，现行身份边界见 docs/TECH.md §8" }
  elasticsearch: { host: "https://es.apikv.com（Pangolin rid 47 → node3 newt → 127.0.0.1:9200，容器 cdc-elasticsearch；SSO off，鉴权在 ES 自身，匿名/错误凭据 401；本机仍仅回环监听）", used_by: [search], note: "search 代码通过 SearchCatalog 只读 ecommerce_catalog_products alias；投影写入者定稿为 node3 的 Debezium→Kafka→Elasticsearch Sink CDC 链（同级仓 postgres-kafka-es-streaming-pipeline），tools/search-indexer 与 NATS 链已于 2026-09 退役，投影表 products.search_catalog 尚未建；网络通路已解决（实测 2026-09-02：Pod 内 curl 公网端点得 ES 401 响应 0.18s，正确凭据 200）；Config Center `search/dev/bootstrap.yaml` v5 已切 search.catalog（2026-09-02，最小权限只读 API key）。⚠️ 旧 search Pod 重启即起不来（旧镜像解不了新配置段），alias 尚未建（404）、新镜像未发布，运行时切流仍未完成。⚠️ 容量事实：node3 总内存 7.25GiB、该容器 limit 2GiB，与观测数据面同机。选型方向见 docs/TECH.md" }
  meilisearch: { host: "meilisearch.search.svc:7700", used_by: [], note: "存量 v1.53 集群组件；本仓 search 代码已不再引用，运行时退役另走部署变更。选型方向见 docs/TECH.md" }
  minio: { host: "minio.apikv.com", used_by: [cart], note: "现役镜像 pgsty/silo RELEASE.2026-08-06（pin digest、command 显式 --certs-dir、镜像 HOME=/tmp）。商品缩略图 URL；443 不带端口。机器是 node2（ssh 别名 node2:34124，阿里云，与 k8s 集群无关——k8s 节点是 node101/102/103 = 192.168.3.101-103），2026-08-19 起走 node1 的 Pangolin（Traefik 终止 TLS）经 newt 隧道回 node2，本机 9000/9001 已绑回环。选型方向见 docs/TECH.md" }
  config_center: { discovery: config-service, repository: "github.com/lens077/control-tower", note: "配置控制面，2026-08-23 起由合一仓 control-tower 的 config 服务承载（wire 冻结,旧 SDK v0.1.0 兼容已实测）；从本地 CONFIG_FILE 自举；SDK=github.com/lens077/control-tower/sdk/configsource" }
  gorse: { host: "gorse.apikv.com", used_by: [behavior, product], note: "推荐引擎；客户端在 backend/pkg/gorse/（发 X-API-Key）。与 minio 同在 node2，2026-08-19 起走 Pangolin，本机 8086/8088 已绑回环。鉴权是 gorse 自带的（[server] api_key + dashboard 表单登录），非 Pangolin SSO。⚠️ 仓库配置的 api_key 按硬规则 4 留空，真值要灌 Config Center，否则业务全 401。依赖 node1 的 rediss://redis.apikv.com:6379 与 pg:5432" }
  redis_gorse: { host: "redis.apikv.com:61246", used_by: [gorse], note: "gorse 专用 cache store，在 node1（≠ Pigsty 那台 192.168.3.210，也≠集群内 dragonfly）。2026-08-19 起 port 0 + 只收 rediss://，证书是 ZeroSSL *.apikv.com（到期 2026-11-25，实测 2026-09-01；无 IP SAN 故必须走域名）；宿主端口随机化为 61246（容器内仍 6379）。**2026-09-01 已收窄来源**：只放 node2（gorse）+ 运维段 + Docker 网桥，其余 DROP；由 node1 `docker-port-guard.service` 落地并开机自启。⚠️ 改规则必须匹配 **DNAT 之后**的容器 IP:6379——按宿主端口 61246 写会得到一条计数恒为 0 的死规则（实测踩过）" }
  postgres_gorse: { host: "node1:52288", used_by: [gorse, casdoor], note: "**不只是 gorse 的库**（实测 2026-09-01 订正）：同实例上有 gorse 与 casdoor 两个库，Casdoor 是第二个消费者——当时 5 条连接中 4 条来自 casdoor。在 node1（≠ CNPG，≠ Pigsty）。宿主端口 2026-08-19 由 5432 随机化为 52288（容器内仍 5432）。收窄来源：Casdoor 原经 host=apikv.com **绕公网**连回本机（源地址呈现为 node1 公网 IP），**2026-09-01 已改为 host=172.18.0.1 走 Docker 网关**，PG 侧实测源地址转为 172.19.0.1、公网连接归零，故收窄 52288 时**只需放行 node2（gorse）**。**2026-09-01 收窄已落地**：只放 node2 + 运维段 + Docker 网桥（Casdoor 经 172.18.0.1 走这条），其余 DROP，由 node1 `docker-port-guard.service` 落地并开机自启；实测 node3 两个端口均被拒、node2 均通、Casdoor HTTP 200。⚠️ 改规则必须匹配 **DNAT 之后**的容器 IP:5432，按宿主端口写会得到死规则。**2026-09-01 TLS 与口令轮换已落地**：复用 Pangolin 的 ZeroSSL `*.apikv.com`（`/home/docker/postgres/tls`，uid 999、key 0600），`pg_hba` 远程行改 `hostssl`，明文连接被拒（实测报 `no encryption`）；`root` 口令已换为 28 位强随机（真值只在 node1 与 Config Center，不入仓）。客户端一律走 `pg.apikv.com:52288` + `sslmode=verify-full`（证书无 IP SAN，按 IP 连必然失败）；Casdoor 用 compose `extra_hosts` 把该域名指到 172.18.0.1，既过 SAN 校验又不出内网。实测两端均 TLSv1.3/TLS_AES_256_GCM_SHA384" }
  alipay: { used_by: [payment], note: "pay.alipay.* 为空时支付网关能力禁用" }

  # node3 Pigsty —— PG 与可观测三支柱已接线；Kafka/Redis/Silo 的存在不代表业务采用。
  # 记在这里是因为它属于「每次都要现搜一遍」的结构事实：入口端口号不常规，极易误判成不通。
  pigsty_node3:
    used_by: [user, search, behavior, product, cart, address, order, inventory, merchant, payment]
    note: |
      Pigsty v4.5.0，ssh 别名 node3（node3:44172），内网 10.10.21.172，x86_64。
      自身公网只开 SSH；一切访问经 node1 的 Pangolin（newt 站点 node3，siteId 7）。
      TCP 入口在 node1 node1：PostgreSQL 30001 / Redis 30002 / Kafka 30004。
      HTTP 入口：node3-{grafana,metrics,logs,traces,vmalert,alerts}.apikv.com（443）。
      已预建 db=ecommerce user=app、Kafka SCRAM 用户 ecommerce_app 与 topic ecommerce.events。
      Silo（Pigsty MINIO 模块）2026-08-24 已补装：S3 9000 / 控制台 9001，桶 pgsql/meta/data。
      **已接入**：可观测三条信号全部改推 node3（metrics/traces/应用 OTLP 日志经 otel collector，
      容器日志经 vector DaemonSet——两条通路不同，必须分别切）；Redis 已上 TLS
      （stunnel 终止在 127.0.0.1:6379；Pigsty redis 角色本身没有任何 TLS 变量）；
      PG 数据已从 CNPG 全量迁入（32 表行数逐表一致、抽样内容 md5 相同）。
      **PG 全量切流**（2026-08-24）：10 个业务服务 + outbox-relay + Config Center 自身
      全部指向 node1:30001，ssl_mode=verify-ca（经隧道以 IP 连接，证书主机名对不上）。
      **集群内 CNPG 已 hibernate**（数据保留，pod 归零）。
      **Silo 入口已建**：https://node3-minio.apikv.com（Pangolin resourceId 29，
      tlsServerName=sss.pigsty，sso 关闭）。
      **集群内可观测已整体删除**（含 Helm release 与 PVC，回收约 23Gi）：
      grafana/jaeger/loki/vl-victoria-logs/vm-single/fluent-bit/otel-collector 全删，
      只剩 vector DaemonSet 送容器日志。服务 OTLP 发到 node3-otlp.apikv.com:443
      （Pangolin resourceId 30 → node3 上 docker 跑的 otelcol:4318，再分发到本机三个
      Victoria 后端）。容器日志不走 collector——vector 推的是 jsonline 不是 OTLP。
      ⚠️ 集群外依赖已成硬依赖：node3 或 Pangolin 隧道故障 = 数据面连不上库、观测全断。
      Kafka 当前仅为未接应用的实验资源；采用门禁见 docs/design/platform/production-scale-goal.md。

# 网关
gateway:
  # 2026-08-23 起网关由合一仓 control-tower 承载（services/gateway，connect+buf 重写）。
  # 旧 gateway/ 已删除，control-tower 是唯一现行实现；不存在切回旧进程的冷回滚路径。
  repository: "github.com/lens077/control-tower"
  path: "（本仓已无网关目录）" # 旧 gateway/ 于 2026-08-24 删除，历史见 tag backup/pre-control-tower-20260823
  routes_module: "github.com/lens077/control-tower/routes" # structcheck import 此包与本文件双向核对
  external: [config_center, consul, redis, casdoor] # Config/发现 + BFF session + Casdoor code exchange
  config_center:
    namespace: gateway
    keys:
      routes: routes.yaml # 新网关 RouteConfig（v2；路由+匿名清单+online_check+CORS）
      revocations: auth/revocations.yaml # 仅 legacy bearer 轨使用；BFF 撤权直接删除 session
      jwt_public_certificate: secrets/public.pem # 新旧网关共用（只读）
      rbac_policies: policies/policies.csv # 新旧网关共用（只读）
      rbac_model: policies/model.conf # 新旧网关共用（只读）
    note: "非机密条目必须 is_secret=false；selector machine token 与 TLS 私钥只进本地/Kubernetes Secret"
  rbac:
    model: "config_center://gateway/policies/model.conf"
    policies: "config_center://gateway/policies/policies.csv"
  # 匿名能力分三级，设计见 docs/design/platform/anonymous-shopping.md：
  #   A anonymous_paths —— 完全无身份，jwt + rbac 两处都排除
  #   B guest_paths     —— 不验 JWT，但网关签发/识别访客 cookie 并注入
  #                        x-md-global-user-id + x-md-global-anonymous=true
  #   C 其余            —— 必须登录（下单/支付/地址簿）
  # A 与 B 互斥：同一路径同时出现在两处，网关 Build 会直接报错。
  # 无需 JWT 的路径（jwt + rbac 两处都排除）
  anonymous_paths:
    - /search.v1.SearchService/Search
    - /product.v1.ProductService/GetProductDetail
    - /user.v1.UserService/SignIn
    - /payment.v1.PaymentService/HandlePaymentNotify
    - /payment.v1.PaymentService/HandlePaymentCallback
    - /behavior.v1.BehaviorService/Track
    - /behavior.v1.BehaviorService/Recommend
    - /behavior.v1.BehaviorService/SimilarItems
    - /telemetry.v1.TelemetryService/CollectWebVitals
    - /address.v1.RegionService/ListRegions
  # B 级：访客身份（当前只有购物车——访客唯一该拥有的资源）
  guest_paths:
    - /cart.v1.CartService/GetCart
    - /cart.v1.CartService/AddProductToCart
    - /cart.v1.CartService/RemoveCartItem
    - /cart.v1.CartService/UpdateCartItemQuantity

# 后端服务
# discovery: Consul 注册名（≠ 目录名，网关 target 用它）
# extra_config: 通用块之外、该服务实际消费的配置块
# 10 个服务统一经 SDK selector 走 config_center；Consul 只负责注册发现。
services:
  user:
    discovery: user-identity
    gateway_prefix: /user*
    extra_config: [auth]
    depends_on: [] # 无服务间调用
    external: [postgres, redis, casdoor, config_center]
    note: "proto 侧引用 backend/api/casdoor/v1"

  search:
    discovery: search-product
    gateway_prefix: /search*
    extra_config: [auth, search]
    depends_on: []
    external: [elasticsearch, config_center]
    note: "查询进程通过 SearchCatalog 只读服务端固定的 ecommerce_catalog_products alias；写入侧走 Debezium→Kafka→ES Sink（行投影线，不经 outbox）。网络通路已通、search.catalog 已切；alias 待 products.search_catalog 表 + Sink 映射建立后由 CDC 链产生，代码接线不等于运行时切流；SearchRequest.index 仅为旧客户端兼容而保留，服务端忽略"

  behavior:
    discovery: behavior-service
    gateway_prefix: /behavior*
    extra_config: [auth, recommend] # recommend required = true
    depends_on: []
    external: [postgres, redis, gorse, config_center]
    note: |
      进程级复用:同时实现 telemetry.v1.TelemetryService(网关前缀 /telemetry*,
      前端性能上报 → OTel histogram/日志,不落业务库)。域是分开的,
      将来 analytics 服务立起来把 handler 与网关 target 一并搬走即可。

  product:
    discovery: product-service
    gateway_prefix: /product*
    extra_config: [recommend] # required = false ← 与 behavior 不一致，见 config_validation
    depends_on: []
    external: [postgres, redis, gorse, config_center]
    note: "dev Config Center 仍指向已拒绝连接的旧 Gorse 直连端点 node2:8088；CNP 不放行该退役端点，启用推荐前须迁移到 gorse.apikv.com:443"

  cart:
    discovery: cart-service
    gateway_prefix: /cart*
    extra_config: [store] # S3-compatible；当前 endpoint 为 Silo
    depends_on: []
    external: [postgres, redis, minio, config_center]

  address:
    discovery: address-service
    gateway_prefix: /address*
    extra_config: [auth]
    depends_on: []
    external: [postgres, redis, config_center]

  order:
    discovery: order-service
    gateway_prefix: /order*
    depends_on: []
    depends_on_planned: [inventory, product, address] # Reserve / 核价 / 地址快照
    external: [postgres, redis, config_center]

  inventory:
    discovery: inventory-service
    gateway_prefix: /inventory*
    depends_on: []
    external: [postgres, redis, config_center]

  merchant:
    discovery: merchant-service
    gateway_prefix: /merchant*
    extra_config: [auth]
    depends_on: []
    external: [postgres, redis, config_center]

  payment:
    discovery: payment-service
    gateway_prefix: /payment*
    extra_config: [pay] # alipay 凭据，KV 里目前是空占位
    depends_on: []
    depends_on_planned: [order] # 原实现的 consumerOrder client，注释保留在 data/payment.go
    external: [postgres, alipay, config_center]

# 部署路径覆盖 ─────────────────────────────────────────────────────
# 上面的 services 段是「有哪些服务」的真相源;这一段声明每条聚合部署入口
# 各自覆盖了其中哪些。四处清单历史上是各抄一份、互相漂移的:
#   - config 已随配置中心拆去独立仓库,却还留在 Makefile 的 SERVICES 里,
#     而扇出写的是 `|| exit 1` —— k8s-dev-all 每次在它那儿中断,payment 永远轮不到
#   - behavior 在 Makefile / compose / deploy / helm 四处皆无,等于没有部署路径
#   - product 至今没有 helm chart,GitOps 那条路径根本部署不了它
# 现在由 backend/structcheck 的 TestDeploymentListsMatchMatrix 强制对齐:
#   - 出现在某条入口、但不在 services 段里的名字 → 直接失败(陈旧残留)
#   - services 段里有、但某条入口缺的      → 失败,除非在 exceptions 里写明原因
deployment_coverage:
  paths:
    makefile: "backend/Makefile 的 SERVICES 变量 —— docker-*-all / k8s-*-all 的扇出清单"
    compose: "backend/compose.yaml 的 services 段 —— 本地一把拉起(键名去掉 ecommerce- 前缀)"
    # ⚠️ 2026-08-24 更正：这两条的角色实际上是**反的**。
    helm: "helm/values.yaml 的顶层键 —— 曾被当作 GitOps 真相源，但 ArgoCD 现在零 Application，
      且 chart 的资源名/标签/tag 与集群实况均不符。当前只是一份待重建的部署描述，不是真相源"
    deploy: "backend/services/{service}/deploy/{dev,prod} —— **当前实际在用的部署路径**（集群就是这么来的）"
  # 例外必须写原因。不写例外 = 要求全覆盖。
  # 2026-08-07:behavior/product 的 chart 已补齐,四条入口现已 10/10 全覆盖,
  # 例外清空。
  exceptions: {}

# 前端 ─
frontend:
  workspace: "frontend" # pnpm workspace + vite-plus
  apps:
    consumer: { port: 3000, module_key: consumer }
    merchant: { port: 3002, module_key: merchant }
    admin: { port: 3003, module_key: admin }
    # desktop 是 Tauri 壳：按 src-tauri/tauri.{consumer,merchant}.conf.json 打包对应 app，无独立端口
    desktop: { module_key: desktop }
  packages: [api, configs, constants, i18n, perf, tauri, tracker, ui, utils]
  transport: "Connect-RPC → VITE_GATEWAY_URL（默认 http://localhost:8080）"

# 已知缺口（详情以 TODO.md 为准，本段只列影响拓扑的）─────────────────
known_gaps:
  - "服务间调用几乎全未接线：10 个服务的 depends_on 当前均为空；order/payment 只有 depends_on_planned"
  - "事件链的拓扑边：Product/Order 未导入 outbox producer；无 consumer Inbox 表；
     无 DLQ topic。Kafka 在 node3 已运行但本仓仍无客户端；领域事件搬运层定稿为
     Debezium Outbox Event Router（自写 relay 与 NATS 已于 2026-09 退役，pkg/outbox 只剩 Insert）。
     进度见 docs/todo/数据一致性与事件驱动.md"
  - "没有 logistics/warehouse 前端 app，也没有独立物流/仓储微服务；履约按设计并入 order，inventory 不是 WMS"
  - "10 个业务服务没有完整的默认拒绝 NetworkPolicy/CiliumNetworkPolicy；后端信任网关注入身份头的边界尚未由网络策略全面强制"
  - "GitOps 拓扑断线：ArgoCD 没有本仓的 Application/ApplicationSet。helm/values.yaml
     **不是**集群真相源——集群由 backend/services/{service}/deploy/ 的手工路径驱动，
     集群实跑镜像 tag 与回写值不同源（带日期的运行时快照归 TODO.md「现状对照」§1，
     本文件不承载观测值）。进度见 docs/todo/基础设施与部署模型.md"
  - "helm/ 不是完整的集群描述：control-tower-gateway 这个在跑的工作负载不在 chart 里；且 chart 渲染出的
     资源名/标签与实况不符，接回 GitOps 前先读 argocd-app.yml 顶部告警"
