# .service-matrix.yaml — 服务拓扑真相源
#
# 作用：让 AI 和 CI 不再靠搜 docs/design/ 猜服务关系、路径和配置键。
# 判据：凡是「AI 每次都要现搜一遍」的结构性事实，都应该在这里查表拿到。
#
# ⚠️ 纪律：
#   1. 本文件只记录**结构事实**，不记录设计理由（那在 docs/design/）也不记录进度（那在 TODO.md）
#   2. depends_on = 代码里真的接线了；depends_on_planned = 设计要求但尚未接线。不要混
#   3. 必需配置键**不在本文件重复** —— 已由各服务 internal/conf/v1/conf.proto 的
#      (buf.validate.field).required 声明，重复会漂移。见 config_validation 段
#   4. 不写凭据

version: 1

layout:
  # Config Center 已独立发布；其他服务仍在单仓。
  mode: hybrid
  backend_service: "backend/services/{service}"
  backend_proto: "backend/api/{service}/v1"
  service_conf: "backend/services/{service}/internal/conf/v1/conf.proto"
  frontend_app: "frontend/apps/{app}"
  frontend_package: "frontend/packages/{pkg}"
  gateway: "gateway"

conventions:
  # Config Center 是 10 个业务服务唯一的 Bootstrap 来源。
  config_center_key: "{service}/{env}/bootstrap.yaml"
  config_source_secret: "ecommerce-config-source-{env}"
  consul_addr_local: "192.168.3.120:8500" # 见 context/team/local-env.md
  common_config_blocks: [server, data, observability, discovery, log]

config_validation:
  # 必需性的唯一真相源是各服务的 conf.proto，例如：
  #   behavior: Recommend recommend = 6 [(buf.validate.field).required = true];
  #   product:  Recommend recommend = 8 [(buf.validate.field).required = false];
  declared_in: "backend/services/{service}/internal/conf/v1/conf.proto → message Bootstrap"
  # ✅ 2026-08-18 已接线：decodeConfig 开 ErrorUnused（未知键报错）、Init/热更新
  # 在解码后调 protovalidate.Validate（validateBootstrap）。启动时校验失败 → 起不来；
  # 热更新校验失败 → 保留当前配置只记 ERROR。每个服务的 config 包新增
  # TestRealConfigFiles_DecodeAndValidate,在有 configs/{dev,pre}.yml 的机器上
  # 验证真实配置过得了校验（文件 gitignore,CI 里自动 skip）。
  enforced_by: "backend/services/{service}/internal/pkg/config/config.go → validateBootstrap + ErrorUnused"
  rollout_warning: |
    服务重启后会用新校验读配置中心的 bootstrap.yaml：其中有未知键或缺 required 段
    的副本会让服务直接起不来。发布前先按本地 configs/{dev,pre}.yml 对齐配置中心内容
    （behavior 的副本曾有 conf.proto 未定义的 log.elasticsearch 块，本地已删，
    配置中心那份未核实）。
  remaining:
    - "CI 里按本文件的服务清单校验每个 {service}/dev/bootstrap.yaml 可解码且通过 validate（需 CI 能访问配置中心，暂缓）"
  see: "context/project/ecommerce/behavior/experience/consul-kv-missing-key-silent-disable.md"

# 外部基础设施（不是本仓的服务）────────────────────────────────────
externals:
  postgres: { host: "pg-main-rw.postgresql.svc:5432", note: "集群内 CloudNativePG pg-main（单实例，2026-08-19 起；Pigsty 192.168.3.210 已关机退役），db=ecommerce owner=app（Database CR 声明式建库），TLS verify-full（pg-ca-cert=CNPG CA）" }
  redis: { host: "dragonfly.dragonfly.svc:6379", note: "集群内 Dragonfly 原生 TLS（2026-08-20 切回，证书 global-ca-issuer 签、SAN 含本 svc 名，密码与 redis 组件同值故服务侧仅换 host）；6379 单口 TLS-only，明文被拒。redis 组件（redis ns）已 scale 0 关停留备回滚；⚠️ Config Center 自身也是本项消费者（自举 Secret，不在 config.entry 里，见 config 域 experience）" }
  consul: { host: "192.168.3.120:8500", note: "集群内工作负载使用 consul-server.consul.svc:8500；本地进程使用 LoadBalancer VIP。Consul 只承担注册发现，配置仍由 Config Center 提供" }
  kafka: { host: "（无实例）", note: "已退役：Pigsty broker 随宿主关机消失，集群内仅剩 strimzi operator 残留（无 Kafka CR）；2026-08-20 定稿替代 = NATS JetStream + outbox 自写 relay（TODO ③），应用侧本就零接线" }
  nats: { host: "nats.nats.svc:4222", note: "dev 为 3-server JetStream；搜索索引使用可重建 R1 ECOMMERCE_EVENTS。relay/indexer 已部署，Product Service 事务内生产者、TLS/客户端认证和 NACK CRD 未完成" }
  casdoor: { host: "casdoor.apikv.com", note: "HTTPS 经 Pangolin（8000 明文口已关，2026-08-19 起）；JWT 公钥 kid=lens；2026-08-20 定稿收编进集群，迁移方案见 docs/技术栈选型对抗/对抗审阅表-第3轮.md R3-A" }
  elasticsearch: { used_by: [], note: "实例已退役；search 已迁移到 Meilisearch，address 的无效依赖也已清理" }
  meilisearch: { host: "meilisearch.search.svc:7700", used_by: [search], note: "v1.53 集群组件；search 使用服务端固定的 products 索引和仅限 search 动作的 API key" }
  minio: { host: "minio.apikv.com", used_by: [cart], note: "⚠️ MinIO 上游仓库已归档（2026-02/04），2026-08-20 定稿迁 SeaweedFS（TODO ①，新增备份流量不再写 MinIO）。存量已同日切 Silo 分叉修复线：pgsty/silo RELEASE.2026-08-06 pin digest + command 显式 --certs-dir（镜像 HOME=/tmp 坑，见 TODO ⓪d）。商品缩略图 URL；443 不带端口。机器是 node2（ssh 别名 node2:34124，阿里云，与集群内 node2 192.168.3.202 无关），2026-08-19 起走 node1 的 Pangolin（Traefik 终止 TLS）经 newt 隧道回 node2，本机 9000/9001 已绑回环。⚠️ 不能直连该 IP 配域名：apikv.com 未在阿里云备案，域名直连必被 ICP 拦截" }
  config_center: { discovery: config-service, repository: "github.com/lens077/config-center", note: "独立配置控制面，从本地 CONFIG_FILE 自举" }
  gorse: { host: "gorse.apikv.com", used_by: [behavior, product], note: "推荐引擎；客户端在 backend/pkg/gorse/（发 X-API-Key）。与 minio 同在 node2，2026-08-19 起走 Pangolin，本机 8086/8088 已绑回环。鉴权是 gorse 自带的（[server] api_key + dashboard 表单登录），非 Pangolin SSO。⚠️ 仓库配置的 api_key 按硬规则 4 留空，真值要灌 Config Center，否则业务全 401。依赖 node1 的 rediss://redis.apikv.com:6379 与 pg:5432" }
  redis_gorse: { host: "redis.apikv.com:61246", used_by: [gorse], note: "gorse 专用 cache store，在 node1（≠ Pigsty 那台 192.168.3.210，也≠集群内 dragonfly）。2026-08-19 起 port 0 + 只收 rediss://，证书是 ZeroSSL *.apikv.com（2026-10-27 到期，无 IP SAN 故必须走域名）；宿主端口随机化为 61246（容器内仍 6379）。⚠️ 测试期对 0.0.0.0/0 开放，上线前收窄" }
  postgres_gorse: { host: "node1:52288", used_by: [gorse], note: "gorse 的 data store，在 node1（≠ CNPG，≠ Pigsty）。宿主端口 2026-08-19 由 5432 随机化为 52288（容器内仍 5432）。⚠️ 仍是明文 + ***REMOVED-PASSWORD*** 弱口令 + 0.0.0.0/0，待上 TLS 与轮换" }
  alipay: { used_by: [payment], note: "pay.alipay.* 为空时支付网关能力禁用" }

# 网关
gateway:
  path: "gateway"
  config: "gateway/configs/config.yaml"
  external: [config_center, consul] # Config Center 下发配置；Consul 仅服务发现
  config_center:
    namespace: gateway
    keys:
      routes: config.yaml
      jwt_public_certificate: secrets/public.pem
      rbac_policies: policies/policies.csv
      rbac_model: policies/model.conf
    note: "四个条目必须 is_secret=false；TLS 私钥只进本地/Kubernetes Secret"
  rbac:
    model: "configs/policies/model.conf" # MODEL_FILE_PATH
    policies: "configs/policies/policies.csv" # POLICIES_FILE_PATH
  # 无需 JWT 的路径（jwt + rbac 两处都排除）
  anonymous_paths:
    - /search.v1.SearchService/Search
    - /product.v1.ProductService/GetProductDetail
    - /user.v1.UserService/SignIn
    - /payment.v1.PaymentService/HandlePaymentNotify
    - /payment.v1.PaymentService/HandlePaymentCallback
    - /behavior.v1.BehaviorService/Track
    - /behavior.v1.BehaviorService/Recommend
    - /behavior.v1.BehaviorService/SimilarItems
    - /telemetry.v1.TelemetryService/CollectWebVitals
    - /address.v1.RegionService/ListRegions

# 后端服务
# discovery: Consul 注册名（≠ 目录名，网关 target 用它）
# extra_config: 通用块之外、该服务实际消费的配置块
# 10 个服务统一经 SDK selector 走 config_center；Consul 只负责注册发现。
services:
  user:
    discovery: user-identity
    gateway_prefix: /user*
    extra_config: [auth]
    depends_on: [] # 无服务间调用
    external: [postgres, casdoor, config_center]
    note: "proto 侧引用 backend/api/casdoor/v1"

  search:
    discovery: search-product
    gateway_prefix: /search*
    extra_config: [auth, search]
    depends_on: []
    external: [meilisearch, config_center]
    note: "查询进程只读服务端固定的 products 索引；独立 indexer 经 NATS 写入。Product Service 事务内 outbox 生产者尚未接线；SearchRequest.index 仅为旧客户端兼容而保留，服务端忽略"

  behavior:
    discovery: behavior-service
    gateway_prefix: /behavior*
    extra_config: [auth, recommend] # recommend required = true
    depends_on: []
    external: [postgres, gorse, config_center]
    note: |
      进程级复用:同时实现 telemetry.v1.TelemetryService(网关前缀 /telemetry*,
      前端性能上报 → OTel histogram/日志,不落业务库)。域是分开的,
      将来 analytics 服务立起来把 handler 与网关 target 一并搬走即可。

  product:
    discovery: product-service
    gateway_prefix: /product*
    extra_config: [recommend] # required = false ← 与 behavior 不一致，见 config_validation
    depends_on: []
    external: [postgres, gorse, config_center]

  cart:
    discovery: cart-service
    gateway_prefix: /cart*
    extra_config: [store] # MinIO
    depends_on: []
    external: [postgres, redis, minio, config_center]

  address:
    discovery: address-service
    gateway_prefix: /address*
    extra_config: [auth]
    depends_on: []
    external: [postgres, config_center]

  order:
    discovery: order-service
    gateway_prefix: /order*
    depends_on: []
    depends_on_planned: [inventory, product, address] # Reserve / 核价 / 地址快照
    external: [postgres, redis, config_center]

  inventory:
    discovery: inventory-service
    gateway_prefix: /inventory*
    depends_on: []
    external: [postgres, config_center]

  merchant:
    discovery: merchant-service
    gateway_prefix: /merchant*
    extra_config: [auth]
    depends_on: []
    external: [postgres, config_center]

  payment:
    discovery: payment-service
    gateway_prefix: /payment*
    extra_config: [pay] # alipay 凭据，KV 里目前是空占位
    depends_on: []
    depends_on_planned: [order] # 原实现的 consumerOrder client，注释保留在 data/payment.go
    external: [postgres, alipay, config_center]

# 部署路径覆盖 ─────────────────────────────────────────────────────
# 上面的 services 段是「有哪些服务」的真相源;这一段声明每条聚合部署入口
# 各自覆盖了其中哪些。四处清单历史上是各抄一份、互相漂移的:
#   - config 已随配置中心拆去独立仓库,却还留在 Makefile 的 SERVICES 里,
#     而扇出写的是 `|| exit 1` —— k8s-dev-all 每次在它那儿中断,payment 永远轮不到
#   - behavior 在 Makefile / compose / deploy / helm 四处皆无,等于没有部署路径
#   - product 至今没有 helm chart,GitOps 那条路径根本部署不了它
# 现在由 backend/structcheck 的 TestDeploymentListsMatchMatrix 强制对齐:
#   - 出现在某条入口、但不在 services 段里的名字 → 直接失败(陈旧残留)
#   - services 段里有、但某条入口缺的      → 失败,除非在 exceptions 里写明原因
deployment_coverage:
  paths:
    makefile: "backend/Makefile 的 SERVICES 变量 —— docker-*-all / k8s-*-all 的扇出清单"
    compose: "backend/compose.yaml 的 services 段 —— 本地一把拉起(键名去掉 ecommerce- 前缀)"
    helm: "helm/values.yaml 的顶层键 —— ArgoCD GitOps 的集群权威真相源"
    deploy: "backend/services/{service}/deploy/{dev,prod} —— ArgoCD 不可用时的应急手工路径"
  # 例外必须写原因。不写例外 = 要求全覆盖。
  # 2026-08-07:behavior/product 的 chart 已补齐,四条入口现已 10/10 全覆盖,
  # 例外清空。
  exceptions: {}

# 前端 ─
frontend:
  workspace: "frontend" # pnpm workspace + vite-plus
  apps:
    consumer: { port: 3000, module_key: consumer }
    merchant: { port: 3002, module_key: merchant }
    admin: { port: 3003, module_key: admin }
    # desktop 是 Tauri 壳：按 src-tauri/tauri.{consumer,merchant}.conf.json 打包对应 app，无独立端口
    desktop: { module_key: desktop }
  packages: [api, configs, constants, i18n, perf, tauri, tracker, ui, utils]
  transport: "Connect-RPC → VITE_GATEWAY_URL（默认 http://localhost:8080）"

# 已知缺口（详情以 TODO.md 为准，本段只列影响拓扑的）─────────────────
known_gaps:
  - "服务间调用几乎全未接线：order/payment 的 depends_on_planned 目前都是空的"
  - "buf breaking 未接 CI —— proto 破坏性变更目前没有门禁"
  - "Bootstrap 解码后仍未执行 protovalidate，required 约束尚未成为运行时门禁"
