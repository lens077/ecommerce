# 网关
gateway:
  # 2026-08-23 起网关由合一仓 control-tower 承载（services/gateway，connect+buf 重写）。
  # 旧 gateway/ 目录处于烘烤期待退役（切流/回滚手顺见 control-tower docs/design/cutover.md）；
  # 期间旧网关消费的 config.yaml 键冻结不动，保「selector 切回+冷重启」回滚路径。
  repository: "github.com/lens077/control-tower"
  path: "（本仓已无网关目录）" # 旧 gateway/ 于 2026-08-24 删除，历史见 tag backup/pre-control-tower-20260823
  routes_module: "github.com/lens077/control-tower/routes" # structcheck import 此包与本文件双向核对
  external: [config_center, consul] # Config Center 下发配置；Consul 仅服务发现
  config_center:
    namespace: gateway
    keys:
      routes: routes.yaml # 新网关 RouteConfig（v2；路由+匿名清单+online_check+CORS）
      revocations: auth/revocations.yaml # 撤销名单（秒级推送；三场景见 control-tower docs/design/auth.md）
      jwt_public_certificate: secrets/public.pem # 新旧网关共用（只读）
      rbac_policies: policies/policies.csv # 新旧网关共用（只读）
      rbac_model: policies/model.conf # 新旧网关共用（只读）
      legacy_routes_frozen: config.yaml # 旧网关冻结键；退役后归档删除
    note: "非机密条目必须 is_secret=false；selector machine token 与 TLS 私钥只进本地/Kubernetes Secret"
  rbac:
    model: "configs/policies/model.conf" # MODEL_FILE_PATH
    policies: "configs/policies/policies.csv" # POLICIES_FILE_PATH
  # 无需 JWT 的路径（jwt + rbac 两处都排除）
  anonymous_paths:
    - /search.v1.SearchService/Search
    - /product.v1.ProductService/GetProductDetail
    - /user.v1.UserService/SignIn
    - /payment.v1.PaymentService/HandlePaymentNotify
    - /payment.v1.PaymentService/HandlePaymentCallback
    - /behavior.v1.BehaviorService/Track
    - /behavior.v1.BehaviorService/Recommend
    - /behavior.v1.BehaviorService/SimilarItems
    - /telemetry.v1.TelemetryService/CollectWebVitals
    - /address.v1.RegionService/ListRegions

# 后端服务
# discovery: Consul 注册名（≠ 目录名，网关 target 用它）
# extra_config: 通用块之外、该服务实际消费的配置块
# 10 个服务统一经 SDK selector 走 config_center；Consul 只负责注册发现。
services:
  user:
    discovery: user-identity
    gateway_prefix: /user*
    extra_config: [auth]
    depends_on: [] # 无服务间调用
    external: [postgres, casdoor, config_center]
    note: "proto 侧引用 backend/api/casdoor/v1"

  search:
    discovery: search-product
    gateway_prefix: /search*
    extra_config: [auth, search]
    depends_on: []
    external: [meilisearch, config_center]
    note: "查询进程只读服务端固定的 products 索引；独立 indexer 经 NATS 写入。Product Service 事务内 outbox 生产者尚未接线；SearchRequest.index 仅为旧客户端兼容而保留，服务端忽略"

  behavior:
    discovery: behavior-service
    gateway_prefix: /behavior*
    extra_config: [auth, recommend] # recommend required = true
    depends_on: []
    external: [postgres, gorse, config_center]
    note: |
      进程级复用:同时实现 telemetry.v1.TelemetryService(网关前缀 /telemetry*,
      前端性能上报 → OTel histogram/日志,不落业务库)。域是分开的,
      将来 analytics 服务立起来把 handler 与网关 target 一并搬走即可。

  product:
    discovery: product-service
    gateway_prefix: /product*
    extra_config: [recommend] # required = false ← 与 behavior 不一致，见 config_validation
    depends_on: []
    external: [postgres, gorse, config_center]

  cart:
    discovery: cart-service
    gateway_prefix: /cart*
    extra_config: [store] # MinIO
    depends_on: []
    external: [postgres, redis, minio, config_center]

  address:
    discovery: address-service
    gateway_prefix: /address*
    extra_config: [auth]
    depends_on: []
    external: [postgres, config_center]

  order:
    discovery: order-service
    gateway_prefix: /order*
    depends_on: []
    depends_on_planned: [inventory, product, address] # Reserve / 核价 / 地址快照
    external: [postgres, redis, config_center]

  inventory:
    discovery: inventory-service
    gateway_prefix: /inventory*
    depends_on: []
    external: [postgres, config_center]

  merchant:
    discovery: merchant-service
    gateway_prefix: /merchant*
    extra_config: [auth]
    depends_on: []
    external: [postgres, config_center]

  payment:
    discovery: payment-service
    gateway_prefix: /payment*
    extra_config: [pay] # alipay 凭据，KV 里目前是空占位
    depends_on: []
    depends_on_planned: [order] # 原实现的 consumerOrder client，注释保留在 data/payment.go
    external: [postgres, alipay, config_center]

# 部署路径覆盖 ─────────────────────────────────────────────────────
# 上面的 services 段是「有哪些服务」的真相源;这一段声明每条聚合部署入口
# 各自覆盖了其中哪些。四处清单历史上是各抄一份、互相漂移的:
#   - config 已随配置中心拆去独立仓库,却还留在 Makefile 的 SERVICES 里,
#     而扇出写的是 `|| exit 1` —— k8s-dev-all 每次在它那儿中断,payment 永远轮不到
#   - behavior 在 Makefile / compose / deploy / helm 四处皆无,等于没有部署路径
#   - product 至今没有 helm chart,GitOps 那条路径根本部署不了它
# 现在由 backend/structcheck 的 TestDeploymentListsMatchMatrix 强制对齐:
#   - 出现在某条入口、但不在 services 段里的名字 → 直接失败(陈旧残留)
#   - services 段里有、但某条入口缺的      → 失败,除非在 exceptions 里写明原因
deployment_coverage:
  paths:
    makefile: "backend/Makefile 的 SERVICES 变量 —— docker-*-all / k8s-*-all 的扇出清单"
    compose: "backend/compose.yaml 的 services 段 —— 本地一把拉起(键名去掉 ecommerce- 前缀)"
    # ⚠️ 2026-08-24 更正：这两条的角色实际上是**反的**。
    helm: "helm/values.yaml 的顶层键 —— 曾被当作 GitOps 真相源，但 ArgoCD 现在零 Application，
      且 chart 的资源名/标签/tag 与集群实况均不符。当前只是一份待重建的部署描述，不是真相源"
    deploy: "backend/services/{service}/deploy/{dev,prod} —— **当前实际在用的部署路径**（集群就是这么来的）"
  # 例外必须写原因。不写例外 = 要求全覆盖。
  # 2026-08-07:behavior/product 的 chart 已补齐,四条入口现已 10/10 全覆盖,
  # 例外清空。
  exceptions: {}

# 前端 ─
frontend:
  workspace: "frontend" # pnpm workspace + vite-plus
  apps:
    consumer: { port: 3000, module_key: consumer }
    merchant: { port: 3002, module_key: merchant }
    admin: { port: 3003, module_key: admin }
    # desktop 是 Tauri 壳：按 src-tauri/tauri.{consumer,merchant}.conf.json 打包对应 app，无独立端口
    desktop: { module_key: desktop }
  packages: [api, configs, constants, i18n, perf, tauri, tracker, ui, utils]
  transport: "Connect-RPC → VITE_GATEWAY_URL（默认 http://localhost:8080）"

# 已知缺口（详情以 TODO.md 为准，本段只列影响拓扑的）─────────────────
known_gaps:
  - "服务间调用几乎全未接线：order/payment 的 depends_on_planned 目前都是空的"
  - "buf breaking 未接 CI —— proto 破坏性变更目前没有门禁"
  # 原第三条「Bootstrap 解码后仍未执行 protovalidate」与本文件 config_validation 段
  # 直接矛盾（那里 2026-08-18 已标 ✅ 接线），2026-08-24 核对代码后删除：
  # 十个服务的 internal/pkg/config/config.go 都开了 ErrorUnused 并在解码后跑 protovalidate。
  - "GitOps 断线（2026-08-24 实测）：ArgoCD 在跑但零 Application / 零 ApplicationSet，
     AppProject 只有 default。helm/values.yaml **不是**集群真相源——它钉着 1.4.0，
     集群实跑 :dev。集群由 backend/services/{service}/deploy/ 的手工路径驱动"
  - "helm/ 不是完整的集群描述：control-tower-gateway、ecommerce-outbox-relay、
     ecommerce-search-indexer 三个在跑的工作负载都不在 chart 里；且 chart 渲染出的
     资源名/标签与实况不符，接回 GitOps 前先读 argocd-app.yml 顶部告警"
