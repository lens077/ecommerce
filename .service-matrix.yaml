# .service-matrix.yaml — 服务拓扑真相源
#
# 作用：让 AI 和 CI 不再靠搜 docs/design/ 猜服务关系、路径和配置键。
# 判据：凡是「AI 每次都要现搜一遍」的结构性事实，都应该在这里查表拿到。
#
# ⚠️ 纪律：
#   1. 本文件只记录**结构事实**，不记录设计理由（那在 docs/design/）也不记录进度（那在 TODO.md）
#   2. depends_on = 代码里真的接线了；depends_on_planned = 设计要求但尚未接线。不要混
#   3. 必需配置键**不在本文件重复** —— 已由各服务 internal/conf/v1/conf.proto 的
#      (buf.validate.field).required 声明，重复会漂移。见 config_validation 段
#   4. 不写凭据

version: 1

layout:
  # Config Center 已独立发布；其他服务仍在单仓。
  mode: hybrid
  backend_service: "backend/services/{service}"
  backend_proto: "backend/api/{service}/v1"
  service_conf: "backend/services/{service}/internal/conf/v1/conf.proto"
  frontend_app: "frontend/apps/{app}"
  frontend_package: "frontend/packages/{pkg}"
  gateway: "gateway"

conventions:
  # Config Center 是 10 个业务服务唯一的 Bootstrap 来源。
  config_center_key: "{service}/{env}/bootstrap.yaml"
  config_source_secret: "ecommerce-config-source-{env}"
  consul_addr_local: "192.168.3.112:8500" # 见 context/team/local-env.md
  common_config_blocks: [server, data, observability, discovery, log]

config_validation:
  # 必需性的唯一真相源是各服务的 conf.proto，例如：
  #   behavior: Recommend recommend = 6 [(buf.validate.field).required = true];
  #   product:  Recommend recommend = 8 [(buf.validate.field).required = false];
  declared_in: "backend/services/{service}/internal/conf/v1/conf.proto → message Bootstrap"
  # ❗已知缺陷：声明了但没人执行
  known_defect: |
    配置加载路径（如 behavior/internal/pkg/config/config.go 的 decodeConfig）只做
    mapstructure 解码，**从不调用 protovalidate**。于是 required=true 形同虚设：
    Config Center Bootstrap 缺块 → 解码不报错 → getter nil-safe → 功能被静默关掉而不是启动失败。
    mapstructure 也未开 ErrorUnused，多余键同样不报错。
  fix_direction:
    - "配置解码后调用 protovalidate.Validate(bootstrap)，让 required 真正生效"
    - "mapstructure DecoderConfig 开启 ErrorUnused"
    - "CI 里按本文件的服务清单校验每个 {service}/dev/bootstrap.yaml 可解码且通过 validate"
  see: "context/project/ecommerce/behavior/experience/consul-kv-missing-key-silent-disable.md"

# 外部基础设施（不是本仓的服务）────────────────────────────────────
externals:
  postgres: { host: "pg-dev.app.com", note: "TLS verify-ca" }
  redis: { host: "dragonfly.app.com:443", note: "Dragonfly, TLS insecure_skip_verify" }
  consul: { host: "192.168.3.112:8500" }
  casdoor: { host: "114.132.233.129", note: "JWT 公钥 kid=lens" }
  elasticsearch: { used_by: [search] }
  minio: { used_by: [cart], note: "商品缩略图 URL" }
  config_center: { discovery: config-service, repository: "github.com/lens077/config-center", note: "独立配置控制面，从本地 CONFIG_FILE 自举" }
  gorse: { used_by: [behavior, product], note: "推荐引擎；客户端在 backend/pkg/gorse/" }
  alipay: { used_by: [payment], note: "pay.alipay.* 为空时支付网关能力禁用" }

# 网关
gateway:
  path: "gateway"
  config: "gateway/configs/config.yaml"
  rbac:
    model: "configs/policies/model.conf" # MODEL_FILE_PATH
    policies: "configs/policies/policies.csv" # POLICIES_FILE_PATH
  # 无需 JWT 的路径（jwt + rbac 两处都排除）
  anonymous_paths:
    - /search.v1.SearchService/Search
    - /product.v1.ProductService/GetProductDetail
    - /user.v1.UserService/SignIn
    - /payment.v1.PaymentService/HandlePaymentNotify
    - /payment.v1.PaymentService/HandlePaymentCallback
    - /behavior.v1.BehaviorService/Track
    - /behavior.v1.BehaviorService/Recommend
    - /behavior.v1.BehaviorService/SimilarItems

# 后端服务
# discovery: Consul 注册名（≠ 目录名，网关 target 用它）
# extra_config: 通用块之外、该服务实际消费的配置块
# 10 个服务统一经 SDK selector 走 config_center；Consul 只负责注册发现。
services:
  user:
    discovery: user-identity
    gateway_prefix: /user*
    extra_config: [auth]
    depends_on: [] # 无服务间调用
    external: [postgres, casdoor, config_center]
    note: "proto 侧引用 backend/api/casdoor/v1"

  search:
    discovery: search-product
    gateway_prefix: /search*
    extra_config: [auth, search]
    depends_on: []
    depends_on_planned: [product] # ProductChangedEvent → 同步 ES（未接线）
    external: [elasticsearch, config_center]

  behavior:
    discovery: behavior-service
    gateway_prefix: /behavior*
    extra_config: [auth, recommend] # recommend required = true
    depends_on: []
    external: [postgres, gorse, config_center]
    note: |
      进程级复用:同时实现 telemetry.v1.TelemetryService(网关前缀 /telemetry*,
      前端性能上报 → OTel histogram/日志,不落业务库)。域是分开的,
      将来 analytics 服务立起来把 handler 与网关 target 一并搬走即可。

  product:
    discovery: product-service
    gateway_prefix: /product*
    extra_config: [recommend] # required = false ← 与 behavior 不一致，见 config_validation
    depends_on: []
    external: [postgres, gorse, config_center]

  cart:
    discovery: cart-service
    gateway_prefix: /cart*
    extra_config: [store] # MinIO
    depends_on: []
    external: [postgres, redis, minio, config_center]

  address:
    discovery: address-service
    gateway_prefix: /address*
    extra_config: [auth, search]
    depends_on: []
    external: [postgres, config_center]

  order:
    discovery: order-service
    gateway_prefix: /order*
    depends_on: []
    depends_on_planned: [inventory, product, address] # Reserve / 核价 / 地址快照
    external: [postgres, redis, config_center]

  inventory:
    discovery: inventory-service
    gateway_prefix: /inventory*
    depends_on: []
    external: [postgres, config_center]

  merchant:
    discovery: merchant-service
    gateway_prefix: /merchant*
    extra_config: [auth]
    depends_on: []
    external: [postgres, config_center]

  payment:
    discovery: payment-service
    gateway_prefix: /payment*
    extra_config: [pay] # alipay 凭据，KV 里目前是空占位
    depends_on: []
    depends_on_planned: [order] # 原实现的 consumerOrder client，注释保留在 data/payment.go
    external: [postgres, alipay, config_center]

# 部署路径覆盖 ─────────────────────────────────────────────────────
# 上面的 services 段是「有哪些服务」的真相源;这一段声明每条聚合部署入口
# 各自覆盖了其中哪些。四处清单历史上是各抄一份、互相漂移的:
#   - config 已随配置中心拆去独立仓库,却还留在 Makefile 的 SERVICES 里,
#     而扇出写的是 `|| exit 1` —— k8s-dev-all 每次在它那儿中断,payment 永远轮不到
#   - behavior 在 Makefile / compose / deploy / helm 四处皆无,等于没有部署路径
#   - product 至今没有 helm chart,GitOps 那条路径根本部署不了它
# 现在由 backend/structcheck 的 TestDeploymentListsMatchMatrix 强制对齐:
#   - 出现在某条入口、但不在 services 段里的名字 → 直接失败(陈旧残留)
#   - services 段里有、但某条入口缺的      → 失败,除非在 exceptions 里写明原因
deployment_coverage:
  paths:
    makefile: "backend/Makefile 的 SERVICES 变量 —— docker-*-all / k8s-*-all 的扇出清单"
    compose: "backend/compose.yaml 的 services 段 —— 本地一把拉起(键名去掉 ecommerce- 前缀)"
    helm: "helm/values.yaml 的顶层键 —— ArgoCD GitOps 的集群权威真相源"
    deploy: "backend/services/{service}/deploy/{dev,prod} —— ArgoCD 不可用时的应急手工路径"
  # 例外必须写原因。不写例外 = 要求全覆盖。
  # 2026-08-07:behavior/product 的 chart 已补齐,四条入口现已 10/10 全覆盖,
  # 例外清空。
  exceptions: {}

# 前端 ─
frontend:
  workspace: "frontend" # pnpm workspace + vite-plus
  apps:
    consumer: { port: 3000, module_key: consumer }
    merchant: { port: 3002, module_key: merchant }
    admin: { port: 3003, module_key: admin }
    config: { port: 3005, module_key: config-fe } # ⚠️ 与后端 config 服务区分
  packages: [api, configs, constants, tracker, ui, utils]
  transport: "Connect-RPC → VITE_GATEWAY_URL（默认 http://localhost:8080）"

# 已知缺口（详情以 TODO.md 为准，本段只列影响拓扑的）─────────────────
known_gaps:
  - "服务间调用几乎全未接线：order/payment 的 depends_on_planned 目前都是空的"
  - "buf breaking 未接 CI —— proto 破坏性变更目前没有门禁"
  - "Bootstrap 解码后仍未执行 protovalidate，required 约束尚未成为运行时门禁"
