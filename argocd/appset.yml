apiVersion: argoproj.io/v1alpha1          # Argo CD ApplicationSet 的 API 版本，固定值
kind: ApplicationSet                      # 资源类型，声明这是一个 ApplicationSet
metadata:
  name: ecommerce-services                # ApplicationSet 的名称，用于标识该资源
  namespace: argocd                       # 部署 ApplicationSet 的命名空间（通常为 argocd）

spec:
  # 启用 Go 模板语法（默认使用 FastTemplate，启用后可访问更丰富的函数和点操作）
  goTemplate: true
  # 设置 Go 模板选项，此处 missingkey=error 表示当模板中引用的 key 不存在时直接报错（便于调试）
  goTemplateOptions: [ "missingkey=error" ]

  generators: # 生成器列表，用于生成待创建的 Application 参数
    - git: # Git 生成器：基于 Git 仓库中的目录或文件生成 Application
        repoURL: https://gitlab.com/sumery/ecommerce.git   # Git 仓库地址（支持 HTTPS/SSH）
        revision: main                    # 要扫描的分支/标签/提交，HEAD 表示默认分支的最新提交
        directories: # 目录生成器：扫描仓库中匹配路径的目录，每个目录生成一个 Application
          # 第一个目录项：包含模式，匹配 helm/charts/ 下的所有一级子目录
          - path: "helm/charts/*"         # 通配符 * 匹配一级子目录（如 address, cart 等）
            # 注意：此处未设置 exclude，表示包含所有匹配的子目录
          # 第二个目录项：排除模式，单独指定要排除的目录
          - path: "helm/charts/library"   # 要排除的完整路径（与前面的包含模式重叠）
            exclude: true                 # 将该目录从生成列表中排除（true 表示排除）

  template: # Application 模板，用于生成每个子 Application 的最终配置
    metadata:
      # 生成 Application 的名称：使用 Git 目录的路径最后一部分（即目录名）
      # 示例：若路径为 helm/charts/address，则名称为 address
      name: '{{.path.basename}}'          # .path.basename 是生成器提供的参数，表示目录名
    spec:
      project: ecommerce                  # 该 Application 所属的 Argo CD 项目（需提前创建）
      source: # 源配置，指向 Git 仓库中的应用部署清单
        repoURL: https://gitlab.com/sumery/ecommerce.git   # 同仓库，也可指定不同仓库
        targetRevision: HEAD              # 部署使用的 revision（可覆盖生成器中的值）
        # 路径：使用生成的完整目录路径（相对于仓库根目录）
        # 示例：若生成器扫描到 helm/charts/address，则此处为 helm/charts/address
        path: '{{.path}}'                 # .path 是完整路径，包含所有父级目录
        helm: # Helm 应用特定配置（当路径下存在 Chart.yaml 时使用）
          parameters: # 注入 Helm 参数（覆盖 values 中的值）
            - name: image.tag             # 参数名称（对应 values 中的 image.tag）
              value: "0.1.0"              # 固定值，此处所有 Application 共享相同 tag
              # 注：如需按目录动态设置，可使用模板值如 '{{.path.basename}}' 等
      destination: # 部署目标集群和命名空间
        server: https://kubernetes.default.svc   # 集群 API Server 地址（此处为本地集群）
        namespace: ecommerce              # 部署的目标命名空间（所有 Application 统一）
      syncPolicy: # 同步策略
        automated: # 自动同步模式
          prune: true                     # 自动删除不再需要的资源（当清单中移除时）
          selfHeal: true                  # 自动修复漂移（将集群状态修正为 Git 中的期望状态）
        syncOptions: # 额外的同步选项
          - CreateNamespace=true          # 若目标命名空间不存在则自动创建
