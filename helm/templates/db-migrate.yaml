{{- $m := .Values.global.migrations -}}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $m.image.tag) -}}
{{- fail "global.migrations.image.tag must pin a sha256 digest" -}}
{{- end -}}
---
{
  apiVersion: "batch/v1",
  kind: "Job",
  metadata: {
    name: "ecommerce-db-migrate",
    namespace: {{ .Release.Namespace | quote }},
    labels: {
      app.kubernetes.io/name: "ecommerce-db-migrate",
      app.kubernetes.io/part-of: "ecommerce",
    },
    annotations: {
      argocd.argoproj.io/hook: "PreSync",
      argocd.argoproj.io/sync-wave: "-1",
      argocd.argoproj.io/hook-delete-policy: "BeforeHookCreation",
      helm.sh/hook: "pre-install,pre-upgrade",
      helm.sh/hook-weight: "-1",
      helm.sh/hook-delete-policy: "before-hook-creation",
    },
  },
  spec: {
    backoffLimit: 0,
    activeDeadlineSeconds: 600,
    ttlSecondsAfterFinished: 604800,
    template: {
      metadata: {
        labels: {
          app.kubernetes.io/name: "ecommerce-db-migrate",
          app.kubernetes.io/part-of: "ecommerce",
        },
      },
      spec: {
        automountServiceAccountToken: false,
        enableServiceLinks: false,
        restartPolicy: "Never",
        imagePullSecrets: [{ name: "tcr-pull-secret" }],
        securityContext: {
          runAsNonRoot: true,
          runAsUser: 1000,
          runAsGroup: 1000,
          fsGroup: 1000,
          seccompProfile: { type: "RuntimeDefault" },
        },
        containers: [{
          name: "dbmigrate",
          image: "{{ $m.image.repository }}:{{ $m.image.tag }}",
          imagePullPolicy: "IfNotPresent",
          args: ["-base=/app/services", "-svc=all", "-timeout=8m", "-require-dsn", "up"],
          env: [{
            name: "DB_URI",
            valueFrom: { secretKeyRef: { name: {{ $m.secretName | quote }}, key: "DB_URI" } },
          }],
          securityContext: {
            allowPrivilegeEscalation: false,
            readOnlyRootFilesystem: true,
            capabilities: { drop: ["ALL"] },
          },
          resources: {
            requests: { cpu: "100m", memory: "128Mi" },
            limits: { cpu: "500m", memory: "256Mi" },
          },
          volumeMounts: [{ name: "postgres-ca", mountPath: "/etc/postgresql/ca", readOnly: true }],
        }],
        volumes: [{
          name: "postgres-ca",
          secret: {
            secretName: {{ $m.secretName | quote }},
            defaultMode: 288,
            items: [{ key: "ca.crt", path: "ca.crt" }],
          },
        }],
      },
    },
  },
}
