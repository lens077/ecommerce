# OTLP 鉴权头：真相源在线上 Vault(secret/observability/otlp)，ESO 物化成 Secret otel-auth。
#
# 为什么值里带 `Authorization=Bearer%20`：这是 OTel SDK 的标准环境变量
# OTEL_EXPORTER_OTLP_HEADERS 的格式(逗号分隔的 k=v，值按 W3C baggage 规则 URL 解码)，
# 空格必须写成 %20，否则 header 会被截断。三个 exporter(trace/metric/log)共用它，
# 应用代码零改动 —— 现有代码只显式设置 endpoint/TLS，headers 留给环境变量。
#
# 身份粒度(第一阶段)：k8s 车队共用 k8s_ecommerce，网关单独用 gateway。
# 后续拆成每工作负载一份时，只需在 Vault 加 key 并复制一段 data 条目。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-auth
  namespace: ecommerce
spec:
  refreshInterval: 1h            # 静态密钥分级约定：默认 1h(见 kubernetes 仓 external-secrets examples)
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: otel-auth
    template:
      engineVersion: v2
      data:
        # 车队(10 服务)用这一份
        OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer%20{{ .k8s }}"
        # 网关单独一份，泄露时可单独撤销
        OTEL_EXPORTER_OTLP_HEADERS_GATEWAY: "Authorization=Bearer%20{{ .gateway }}"
  data:
    - secretKey: k8s
      remoteRef:
        key: observability/otlp
        property: k8s_ecommerce
    - secretKey: gateway
      remoteRef:
        key: observability/otlp
        property: gateway
