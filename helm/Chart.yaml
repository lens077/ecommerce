apiVersion: v2
version: 0.2.0
name: ecommerce-helm
description: ecommerce 全部工作负载(10 个后端服务 + 2 个前端)的 umbrella chart;与裸 manifest 逐字段等价,见 scripts/verify-deploy-parity.sh
type: application
dependencies:
  - name: address
    version: 0.2.0
    repository: file://charts/address
    condition: address.enabled
  - name: behavior
    version: 0.2.0
    repository: file://charts/behavior
    condition: behavior.enabled
  - name: cart
    version: 0.2.0
    repository: file://charts/cart
    condition: cart.enabled
  - name: inventory
    version: 0.2.0
    repository: file://charts/inventory
    condition: inventory.enabled
  - name: merchant
    version: 0.2.0
    repository: file://charts/merchant
    condition: merchant.enabled
  - name: order
    version: 0.2.0
    repository: file://charts/order
    condition: order.enabled
  - name: payment
    version: 0.2.0
    repository: file://charts/payment
    condition: payment.enabled
  - name: product
    version: 0.2.0
    repository: file://charts/product
    condition: product.enabled
  - name: search
    version: 0.2.0
    repository: file://charts/search
    condition: search.enabled
  - name: user
    version: 0.2.0
    repository: file://charts/user
    condition: user.enabled
  - name: frontend
    version: 0.1.0
    repository: file://charts/frontend
    condition: frontend.enabled
  - name: consumer-next
    version: 0.1.0
    repository: file://charts/consumer-next
    condition: consumer-next.enabled
