replicaCount: 1
enabled: true

image:
  repository: "ccr.ccs.tencentyun.com/sumery/inventory"
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  ports:
    http:
      enabled: true
      port: 30007
      targetPort: 30007
    grpc:
      enabled: false
      port: 30008
      targetPort: 30008

env: []

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
