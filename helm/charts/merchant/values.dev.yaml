replicaCount: 1
enabled: true
image:
  repository: "ccr.ccs.tencentyun.com/sumery/merchant"
  tag: pre
  pullPolicy: Always
service:
  type: LoadBalancer
  ports:
    http:
      enabled: true
      port: 3000m
      targetPort: 3000m
env:
  - name: SERVICE_NAME
    value: "merchant-service-v1"
secret:
  enabled: true
  name: "merchant-db-secret"
  data:
    DB_SOURCE: "postgresql://postgres:password@host:5432/db?sslmode=require"
dbCaCert:
  enabled: true
  secretName: "pg-ca-cert"
  mountPath: "/etc/postgresql/ca"
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1"
    memory: "256Mi"
