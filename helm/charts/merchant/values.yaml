replicaCount: 1
enabled: true

image:
  repository: "sumery/merchant"
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  ports:
    http:
      enabled: true
      port: 30009
      targetPort: 30009
    grpc:
      enabled: false
      port: 30010
      targetPort: 30010

env:
  - name: DB_SOURCE
    valueFrom:
      secretKeyRef:
        name: ecommerce-db-secret
        key: DB_SOURCE

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

secret:
  enabled: true
  name: "ecommerce-db-secret"
  data:
    DB_SOURCE: ""