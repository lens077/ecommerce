replicaCount: 1
enabled: true

global:
  configSource:
    enabled: true
    secretName: ecommerce-config-source-pre
    mountPath: /etc/ecommerce/config-source
image:
  repository: "ccr.ccs.tencentyun.com/sumery/behavior"
  tag: pre
  pullPolicy: Always
service:
  type: LoadBalancer
  ports:
    http:
      enabled: true
      port: 30011
      targetPort: 30011
    grpc:
      enabled: false
      port: 30011
      targetPort: 30011
env:
  - name: SERVICE_NAME
    value: "behavior-service"
  - name: CONSUL_ENABLED
    value: "true"
  - name: CONSUL_ADDR
    value: consul-expose-servers.consul.svc:8500
  - name: CONFIG_SOURCE_FILE
    value: "/etc/ecommerce/config-source/behavior.yaml"
  - name: CONSUL_SCHEME
    value: "http"
  - name: CONSUL_INSECURE_SKIP_VERIFY
    value: "true"
secret:
  enabled: true
  name: "behavior-db-secret"
  data:
    DB_SOURCE: "postgresql://postgres:password@host:5432/db?sslmode=require"
dbCaCert:
  enabled: true
  secretName: "pg-ca-cert"
  mountPath: "/etc/ssl/certs"
  fileName: "pg_ca.crt"
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "1"
    memory: "256Mi"
