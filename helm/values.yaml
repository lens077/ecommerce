    port: 30009,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/address",
      tag: "1.7.7@sha256:30c4c93fbb9c6ebd15b93b376832edec2e2236befdf96a44d599479db74f98a8",
    },
  },
  behavior: {
    enabled: true,
    replicaCount: 1,
    serviceName: "behavior-service",
    port: 30011,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/behavior",
      tag: "1.7.7@sha256:bbd3752f5bc5c4bbfd432e9c423cabee1ab1c3f18b706d2f1230026d6786324d",
    },
  },
  # 前端两个工作负载。裸 manifest 在 frontend/apps/consumer/deploy/pre/ 与
  # frontend/apps/consumer-next/deploy/base/consumer-next.yaml,同样受 parity 门禁约束。
  frontend: {
    enabled: true,
    replicaCount: 1,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/ecommerce-frontend",
      tag: "1.7.7@sha256:02dea7eb72bf67344c659bb241c9d846d3b2803a14a2b1ec8ebd039e52e6581a",
    },
    # Caddy 监听端口。⚠️ 仓库 Dockerfile 现写 :30080,而线上镜像 sha-bf8dae2 实测监听 :80;
    # 下次重建镜像前必须先把两者对齐,否则 Service 的 targetPort 会指向一个没人听的口。
    containerPort: 80,
    servicePort: 30080,
    gatewayURL: "http://ecommerce-gateway-service:8080",
    # pre 已切到 Argo Rollouts Blue-Green（prod 仍是 Deployment，见 values-prod.yaml）。
    # 与 frontend/apps/consumer/deploy/pre 的裸清单逐字段等价（verify-deploy-parity.sh）；
    # VPA 对 Rollout target 的支持未验证前关闭 frontend VPA。手动 promote，不自动晋级。
    rollouts: {
      enabled: true,
      autoPromotionEnabled: false,
      vpaEnabled: false,
    },
  },
  consumer-next: {
    enabled: true,
    replicaCount: 2,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/consumer-next",
      tag: "1.7.7@sha256:b3d610d55e89f0c06f1ff6e13f6d0796e6931a4a3e484a41548b0e580f14fcc1",
    },
    port: 3004,
    gatewayURL: "http://ecommerce-gateway-service.ecommerce.svc.cluster.local:8080",
    publicURL: "https://shop.dev.test",
  },
}
