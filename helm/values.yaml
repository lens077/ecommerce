  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/sumery/ecommerce-frontend
    tag: 1.7.2@sha256:10369609e36368588e5ba252e034f7fa8be8bfadb744e3271cad1a2e441d6216
  # Caddy 监听端口。⚠️ 仓库 Dockerfile 现写 :30080,而线上镜像 sha-bf8dae2 实测监听 :80;
  # 下次重建镜像前必须先把两者对齐,否则 Service 的 targetPort 会指向一个没人听的口。
