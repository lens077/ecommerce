      tag: "1.8.1@sha256:6dd8d7a635c68acf03d736c1835f12ef5f809cfdc3fa8abaf0d2b7cdaf311c2c",
    },
  },
  merchant: {
    enabled: true,
    replicaCount: 1,
    serviceName: "merchant-service",
    port: 30007,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/merchant",
      tag: "1.8.1@sha256:4d7d1108e817083fb69ff41705887b86a5f8a37ef881dfa38bff49e75f526250",
    },
  },
  payment: {
    enabled: true,
    replicaCount: 1,
    serviceName: "payment-service",
    port: 30008,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/payment",
      tag: "1.8.1@sha256:6691e11ad502a8382d581d3d35730b1c26fa050399e41e536331b9dc193e44cd",
    },
  },
  address: {
    enabled: true,
    replicaCount: 1,
    serviceName: "address-service",
    port: 30009,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/address",
      tag: "1.8.1@sha256:2f11977c4008de93bd3db26ca0846e2346a73ec55928d91c3443998561330c76",
    },
  },
  behavior: {
    enabled: true,
    replicaCount: 1,
    serviceName: "behavior-service",
    port: 30011,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/behavior",
      tag: "1.8.1@sha256:4b5361d97f8b1541813814912bb23a0a22e9cfbdf8c99fe983308c2bd6afc00e",
    },
  },
  # 前端两个工作负载。裸 manifest 在 frontend/apps/consumer/deploy/pre/ 与
  # frontend/apps/consumer-next/deploy/base/consumer-next.yaml,同样受 parity 门禁约束。
  frontend: {
    enabled: true,
    replicaCount: 1,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/ecommerce-frontend",
      tag: "1.8.1@sha256:ab856ea115ee2348ee43d7617acd4494cb19b9bf64e16c709ce16da1fc2d6eda",
    },
    # Caddy 监听端口。⚠️ 仓库 Dockerfile 现写 :30080,而线上镜像 sha-bf8dae2 实测监听 :80;
    # 下次重建镜像前必须先把两者对齐,否则 Service 的 targetPort 会指向一个没人听的口。
    containerPort: 80,
    servicePort: 30080,
    gatewayURL: "http://ecommerce-gateway-service:8080",
    # pre 已切到 Argo Rollouts Blue-Green（prod 仍是 Deployment，见 values-prod.yaml）。
    # 与 frontend/apps/consumer/deploy/pre 的裸清单逐字段等价（verify-deploy-parity.sh）；
    # VPA 对 Rollout target 的支持未验证前关闭 frontend VPA。手动 promote，不自动晋级。
    rollouts: {
      enabled: true,
      autoPromotionEnabled: false,
      vpaEnabled: false,
    },
  },
  consumer-next: {
    enabled: true,
    replicaCount: 2,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/consumer-next",
      tag: "1.8.1@sha256:6bb7e1160cd12a002dec0faa7479485ccb6a15d1235cae3c14c05df56efe51f2",
    },
    port: 3004,
    gatewayURL: "http://ecommerce-gateway-service.ecommerce.svc.cluster.local:8080",
    publicURL: "https://shop.dev.test",
  },
}
