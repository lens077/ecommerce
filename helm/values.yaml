      tag: "1.8.1@sha256:41ea056448fad131ca85bd8916dfa8052e118bae7af625e23bc81cf9bf59c7bb",
    },
  },
  cart: {
    enabled: true,
    replicaCount: 1,
    serviceName: "cart-service",
    port: 30006,
