# ArgoCD GitOps 的集群权威真相源：helm/ 下的 subchart 由 ArgoCD ApplicationSet
# （argocd-app.yml）渲染，镜像 tag 由 CI 的 update-manifests job 回写。
#
# 本文件的三条口径，改之前先读：
# 1. SERVICE_NAME 必须与 .service-matrix.yaml 的 discovery 逐字相同 —— 它是注册进
#    Consul 的名字，网关按 `discovery:///<name>` 找服务。带 `-v1` 后缀的历史写法
#    会注册成另一个名字，服务活得好好的但网关永远路由不到（cart 踩过这个）。
# 2. 端口取各服务 Config Center pre Bootstrap 的 server.addr。
# 3. Bootstrap selector 来自不入库的 ecommerce-config-source-pre Secret；Consul
#    环境变量只负责服务注册发现。
#
# 镜像走 TCR 而不是 GHCR：两处 CI 都推，但集群在 LAN 内，拉 ghcr.io 要过代理，
# 而 TCR 是同区直连。GHCR 那份是给外部/公网消费的。

# 必须挂在 global 下：subchart 只看得见自己那一层加上 global，
# 写成顶层 imagePullSecrets 的话渲染出来一个都没有（实测过）。
global:
  imagePullSecrets:
    - name: tcr-pull-secret
  configSource:
    enabled: true
    secretName: ecommerce-config-source-pre
    mountPath: /etc/ecommerce/config-source
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
user:
  enabled: true
  replicaCount: 1
  image:
    repository: "ccr.ccs.tencentyun.com/sumery/user"
    tag: 1.4.0
    pullPolicy: Always
  service:
    type: LoadBalancer
    ports:
      http:
        enabled: true
        port: 30001
        targetPort: 30001
      grpc:
        enabled: false
        port: 30001
        targetPort: 30001
  env:
    - name: SERVICE_NAME
      value: "user-identity"
    - name: SERVICE_VERSION
      value: "v1"
    - name: DEPLOYMENT_MODE
      value: "pre"
    - name: CONFIG_SOURCE_FILE
      value: "/etc/ecommerce/config-source/user.yaml"
    - name: OTEL_LOGS_EXPORTER
      value: "none"
    - name: CONSUL_ENABLED
      value: "true"
    - name: CONSUL_ADDR
      value: consul-expose-servers.consul.svc:8500
    - name: CONSUL_SCHEME
      value: "http"
    - name: CONSUL_INSECURE_SKIP_VERIFY
      value: "true"
    # Consul 自 2026-08-18 起开了 ACL(default_policy=deny)，不带 token 的失败是**静默的**：
    # 注册看似成功、读操作返回 200，但结果被 ACL 过滤成空 —— 表现为「服务活得好好的，
    # 网关就是路由不到」(/v1/catalog/services 返回 {"consul":[]})。
    # 变量名必须是 CONSUL_HTTP_TOKEN：backend/constants 里那个 CONSUL_TOKEN 没有任何代码读，
    # registry 靠 consul/api 自己兜底读 CONSUL_HTTP_TOKEN。
    - name: CONSUL_HTTP_TOKEN
      valueFrom:
        secretKeyRef:
          name: consul-ecommerce-token
          key: CONSUL_HTTP_TOKEN
  # 这个历史 Secret 只有无人读取的 DB_SOURCE；Bootstrap 凭据来自 Config Center。
  # 保持关闭，避免重复铺设明文口令。
  secret:
    enabled: false
  dbCaCert:
    enabled: true
    secretName: "pg-ca-cert"
    mountPath: "/etc/ssl/certs"
    fileName: "pg_ca.crt"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"
