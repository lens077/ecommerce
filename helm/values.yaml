  enabled: true
  replicaCount: 1
  image:
    repository: ccr.ccs.tencentyun.com/sumery/ecommerce-frontend
    tag: 1.7.5@sha256:49c0dcb6345426b29fdf668a63ecb1777c9f46622b2fca020043f1eeefa6805c
