---
# ecommerce umbrella chart 的 values —— 与 backend/services/<svc>/deploy/(base+overlays) 裸 manifest
# 是**同一套集群对象的两种写法**,由 scripts/verify-deploy-parity.sh 强制逐字段等价:
# 这里改了值、裸 manifest 没跟上(或反过来),本地锚点和 CI 的 deploy-consistency 都会红。
# 两份都是真相源,面向不同的使用者:helm 给 ArgoCD / helm 用户,裸 manifest 给 kubectl 用户。
#
# 三条口径,改之前先读:
# 1. serviceName 必须与 .service-matrix.yaml 的 discovery 逐字相同 —— 它是注册进 Consul
#    的名字(user 是 user-identity、search 是 search-product,≠ 目录名)。带 `-v1` 后缀的
#    历史写法会注册成另一个名字,服务活得好好的但网关永远路由不到(cart 踩过这个)。
# 2. port 取各服务 Config Center Bootstrap 的 server.addr。
# 3. Bootstrap selector 来自不入库的 ecommerce-config-source-pre Secret;Consul 环境变量
#    只负责服务注册发现,2026-09-03 起 CONSUL_ENABLED=false。
#
# 镜像:CI(.github/workflows/backend.yml update-manifests)发版后把 image.tag 同时回写到
# 这里和裸 manifest。tag 用发布版本号 X.Y.Z(当前值是 CI 切换前的最后一次手工 digest 钉法,
# 下次发版起统一为版本号)。走 TCR 而不是 GHCR:集群在 LAN 内,拉 ghcr.io 要过代理。
{
  # global 是 Helm 唯一能跨子 chart 传值的键。
  global: {
    # Runtime-only value. scripts/deploy-k8s.sh resolves node1 from ~/.ssh/config,
    # or callers pass POSTGRES_EGRESS_CIDR / --set-string explicitly.
    postgresEgressCIDR: "",
    # 2026-09-15 起环境只有 pre / prod:本文件即 pre 基线,prod 差异在 values-prod.yaml。
    # 原 dev 集群(192.168.3.x)已删除,dev 层与随之而来的局域网直连(directAccess)一并移除。
    deploymentMode: "pre",
    # 与业务镜像一起晋级；迁移失败必须先于任何新工作负载停止发布。
    migrations: {
      image: {
        repository: "ccr.ccs.tencentyun.com/sumery/dbmigrate",
        tag: "1.8.1@sha256:0d17a9590b8b6af5a733572cb433422daf12e9200c43a8fadcbffc1a3ee66972",
      },
      secretName: "ecommerce-db-migrate",
    },
    # 零信任 CNP(helm/files/zero-trust.yaml 里的 ecommerce-api-default-deny)与 otel-auth ExternalSecret
    # 是否随本 chart 渲染。pre 为 true;prod 首次接管(2026-09-14)只发版不接管策略,在 values-prod.yaml 关掉。
    networkPolicy: {
      enabled: true,
    },
    otelAuthExternalSecret: {
      enabled: true,
    },
    configSource: {
      enabled: true,
      secretName: "ecommerce-config-source-pre",
      mountPath: "/etc/ecommerce/config-source",
      runAsUser: 1000,
      runAsGroup: 1000,
      fsGroup: 1000,
    },
    consul: {
      # 布尔而非字符串 "false":模板用 `| quote` 注入 env(K8s 要求字符串),两种写法渲染结果
      # 都是 "false";但写成字符串时 `{{ if $g.consul.enabled }}` 会恒真——Go 模板只看空/非空,
      # 非空字符串 "false" 为真。留成字符串等于埋一个「将来有人加条件渲染就静默走错分支」的雷。
      enabled: false,
      addr: "consul-server.consul.svc:8500",
      scheme: "http",
      insecureSkipVerify: false,
      # Consul 自 2026-08-18 起开了 ACL(default_policy=deny),不带 token 的失败是**静默的**。
      # 变量名必须是 CONSUL_HTTP_TOKEN,registry 靠 consul/api 自己兜底读它。
      tokenSecret: "consul-ecommerce-token",
    },
    # 10 个服务当前同一档;VPA(updateMode Off)在采推荐值,采够再按服务分档。
    resources: {
      requests: {
        cpu: "100m",
        memory: "128Mi",
      },
      limits: {
        cpu: "1",
        memory: "512Mi",
      },
    },
  },
  user: {
    enabled: true,
    replicaCount: 1,
    serviceName: "user-identity",
    port: 30001,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/user",
      tag: "1.8.1@sha256:e21839736538c604e281dcfda13d960143351049271cc5227f410f9afb2512fd",
    },
  },
  search: {
    enabled: true,
    replicaCount: 1,
    serviceName: "search-product",
    port: 30002,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/search",
      tag: "1.8.1@sha256:2fee4c724aa1646eedbacc7c6469cee3d3b7e7a2711715c19b89453637c200d4",
    },
  },
  product: {
    enabled: true,
    replicaCount: 1,
    serviceName: "product-service",
    port: 30003,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/product",
      tag: "1.8.1@sha256:28d9313758555cdfbdbd66d3c041079910a4622e9eb892135228b641ea7fc022",
    },
  },
  order: {
    enabled: true,
    replicaCount: 1,
    serviceName: "order-service",
    port: 30004,
    image: {
      repository: "ccr.ccs.tencentyun.com/sumery/order",
      tag: "1.8.1@sha256:865935ca66aaaf553ad82d0455841f56f73e73da0579ef4d1f183e625d5b4353",
    },
  },
  inventory: {
    enabled: true,
    replicaCount: 1,
    serviceName: "inventory-service",
    port: 30005,
    image: {
