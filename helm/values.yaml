global:
  registry: "ccr.ccs.tencentyun.com"
  namespace: "ecommerce"

search:
  enabled: true
  replicaCount: 1
  image:
    repository: "sumery/search"
    tag: dev
    pullPolicy: Always
  service:
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: 30002
        targetPort: 30002
      grpc:
        enabled: false
        port: 30000
        targetPort: 30000
  env:
    - name: SERVICE_NAME
      value: "search-product-v1"
    - name: CONSUL_ENABLED
      value: "true"
    - name: CONSUL_ADDR
      value: "192.168.3.112:8500"
    - name: CONSUL_PATH
      value: "ecommerce/search/pre.yml"
    - name: CONSUL_SCHEME
      value: "https"
    - name: CONSUL_INSECURE_SKIP_VERIFY
      value: "true"
  secret:
    enabled: true
    name: "ecommerce-db-secret"
    data:
      DB_SOURCE: "postgresql://postgres:msdnmm@192.168.3.109:5432/ecommerce?sslmode=require&sslrootcert=/etc/ssl/certs/pg_ca.crt&timezone=Asia/Shanghai"
  dbCaCert:
    enabled: true
    secretName: "pg-ca-cert"
    mountPath: "/etc/ssl/certs"
    fileName: "pg_ca.crt"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"

