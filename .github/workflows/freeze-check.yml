name: Frozen acceptance-set check

# Graph Engineering 的 Frozen Nodes 守卫(CI 锚点):
# 拦「已冻结的验收测试被偷偷改动、但 .freeze/ 清单没同步刷新」的静默漂移。
# 与 backend.yml(仅 tag 触发的部署)分开,这条在每个 PR / 分支 push 上都跑。
on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  verify-freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify frozen acceptance sets are untouched
        shell: bash
        run: ./scripts/verify-freeze.sh --all
