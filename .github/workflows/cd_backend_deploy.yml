name: Deployment

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

# 共享环境变量
env:
  HELM_REGISTRY: harbor.apikv.com:5443
  HELM_REGISTRY_USER: rebot@github
  HELM_REPO: sumery
  NAMESPACE: connect-example
  # 从触发的工作流中获取标签名
  VERSION: ${{ github.event.workflow_run.head_branch }}
  # 因为 workflow_run 无法直接访问 secrets，这里需要确保 secrets 被传入
  # 但是为了安全，我们将所有使用 secrets 的步骤都放在同一个 job 中

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    steps:
      - run: echo 'The triggering workflow failed'
  on-success:
    runs-on: ubuntu-24.04
    #if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: test
        run: |
          echo: 1 ${{ github.event.workflow_run.conclusion == 'success' }}
          echo: 2 ${{startsWith(github.event.workflow_run.head_branch, 'v')}}
          echo: 3 ${{ github.event.workflow_run.head_branch }}
      - name: Checkout Current Repository (for Helm Chart)
        uses: actions/checkout@v5
        # 需要检出触发事件的分支/标签，以获取正确的 Chart 文件
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # 更新 Chart 版本和镜像标签
      - name: Update Backend Chart Version and Image Tag
        run: |
          yq e '.version = "${{ env.VERSION }}"' -i helm/charts/backend/Chart.yaml
          yq e '.image.tag = "${{ env.VERSION }}"' -i helm/charts/backend/values.yaml
          yq e '.backend.image.tag = "${{ env.VERSION }}"' -i helm/values.yaml

      # 打包并推送 Helm Chart 到 OCI
      - name: Bump Chart Version and Package
        run: |
          helm dependency update helm/charts/backend/
          helm package helm/charts/backend/ -d chart-packages/
          echo "${{ secrets.HELM_REGISTRY_PASS }}" | helm registry login ${{ env.HELM_REGISTRY }} -u ${{ env.HELM_REGISTRY_USER }} --password-stdin
          helm push chart-packages/backend-${{ env.VERSION }}.tgz oci://${{ env.HELM_REGISTRY }}/${{ env.HELM_REPO }}

      # 提交 Chart 文件更改到源仓库 (可选，但推荐)
      # 移除 Stash/Pull/Pop，直接使用 git-auto-commit-action
      - name: Auto Commit Chart Changes
        uses: stefanzweifel/git-auto-commit-action@v5 # 使用 v5 或更高版本
        with:
          commit_message: "CI: Auto update chart version to ${{ env.VERSION }} [skip ci]"
          file_pattern: "helm/charts/backend/Chart.yaml helm/charts/backend/values.yaml helm/values.yaml"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # 检出 Manifest 配置仓库
      - name: Checkout Manifest Repository
        uses: actions/checkout@v5
        with:
          repository: sunmery/Manifest
          path: connect-example
          token: ${{ secrets.MANIFEST_REPO_PAT }}
          # 确保检出默认分支
          ref: ${{ github.event.repository.default_branch }}

      # 更新 ArgoCD Application配置文件
      - name: Update ArgoCD Configs File
        working-directory: connect-example
        run: |
          export NEW_CHART_VERSION="${{ env.VERSION }}"
          MANIFEST_FILE="connect-example/backend/argo.yaml"

          # 确保 yq 存在于这个 job
          which yq || sudo apt-get install -y yq
          
          echo "Updating $MANIFEST_FILE with targetRevision: $NEW_CHART_VERSION"

          # 更新 spec.source.targetRevision 字段 (OCI Chart 版本)
          yq e '.spec.source.targetRevision = env(NEW_CHART_VERSION)' -i $MANIFEST_FILE
          # 更新 Chart 内部的镜像标签 (Helm Parameter)
          yq e '.spec.source.helm.parameters.[] | select(.name == "backend.image.tag").value = env(NEW_CHART_VERSION)' -i $MANIFEST_FILE
          
          cat $MANIFEST_FILE

      # 提交并将更改推送到 Manifest 仓库
      - name: Commit and Push Manifest Changes
        working-directory: connect-example
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          git add connect-example/backend/argo.yaml
          
          # 仅在有实际更改时提交
          git diff --cached --exit-code || git commit -m "CI: Auto update connect-example-backend chart version to ${{ env.VERSION }} [skip ci]"
          git push
