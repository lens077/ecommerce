name: Frontend login smoke test

# 2026-08-24:本 workflow 原名「Connect-example Frontend GitOps Deployment」,
# 含 frontend-test / frontend-deploy 两个构建发布 job。它们已整体删除,原因是三处
# 引用的东西根本不存在,于是**每个发布 tag 都必红**:
#   - helm/charts/frontend/        —— 该目录不存在(helm/charts/ 下只有 10 个后端服务)
#   - NAMESPACE: connect-example   —— 集群里没有这个 ns,前端与服务都在 ecommerce
#   - sunmery/Manifest 外部仓 + connect-example/<dir>/argo.yaml
#                                  —— 为一个不存在的 ArgoCD Application 改 targetRevision
#   - secret HELM_REGISTRY_PASS    —— 自述「目前仓库里没有」
# 前端镜像的构建发布路径待重建;重建前不要把这两个 job 抄回来,先确认上面四项。
#
# 保留下来的 smoke-login 是原文件里唯一能跑通的部分:它测的是**线上已部署**的那一份,
# 而这条链路的坏法(CSP 头、Casdoor 应用配置、Pangolin 隧道)多半不由本仓提交引起,
# 只在打 tag 时跑等于永远发现不了 —— 所以它走定时 + 手动,不挂在发版上。

on:
  workflow_dispatch:
    inputs:
      shop_url:
        description: '被测站点（留空用 https://shop.apikv.com）'
        required: false
        default: ''
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）。刻意避开整点，别和全球的 cron 挤在一起。
    - cron: '17 3 * * *'

env:
  NODE_VERSION: 22
  FRONTEND_DIR: frontend

jobs:
  # 需要两个 secret：CASDOOR_E2E_USER / CASDOOR_E2E_PASS。**没配就整体跳过**，
  # 不是失败 —— 否则 fork 和没配密钥的仓库会永远挂一条红。
  smoke-login:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check credentials
        id: creds
        env:
          E2E_USER: ${{ secrets.CASDOOR_E2E_USER }}
        run: |
          if [ -z "$E2E_USER" ]; then
            echo "::notice::未配置 CASDOOR_E2E_USER/CASDOOR_E2E_PASS，跳过登录冒烟测试"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ">=${{ env.NODE_VERSION }}"

      - name: Setup pnpm
        if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # 只装 chromium：这个脚本只用它，装全套是三倍下载量
      - name: Install Chromium
        if: steps.creds.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run login smoke test
        if: steps.creds.outputs.ready == 'true'
        env:
          CASDOOR_USER: ${{ secrets.CASDOOR_E2E_USER }}
          CASDOOR_PASS: ${{ secrets.CASDOOR_E2E_PASS }}
          SHOP_URL: ${{ inputs.shop_url || 'https://shop.apikv.com' }}
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: |
          mkdir -p "$E2E_ARTIFACT_DIR"
          pnpm --filter @ecommerce/consumer e2e:login

      - name: Upload failure screenshot
        if: ${{ failure() && steps.creds.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-login-failure-${{ github.run_id }}
          path: e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore
