  backend-build:
    if: github.ref != 'refs/heads/pre'
#    needs: backend-test
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service_config:
          - { service: connect-example-backend }
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # 检出默认分支，以便您可以提交更改
          #ref: ${{ github.event.repository.default_branch }}
          ref: main

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Cache Go dependencies
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-modules-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-modules-

      - name: Login to Docker Registry
        run: echo ${{ secrets.REGISTRY_PASSWORD }} | docker login ${{ env.REGISTRY }} --username ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build, Tag and Push OCI Image
        run: |
          docker build . \
            -t actions/${{ matrix.service_config.service }} \
            --build-arg GO_PROXY=$GO_PROXY \
            --build-arg GOIMAGE=$GO_IMAGE \
            --build-arg CGOENABLED=$CGO_ENABLED \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg GOOS=$GOOS \
            --build-arg GOARCH=$GOARCH \
            --build-arg SERVICE=server

          docker tag actions/${{ matrix.service_config.service }} ${{ env.REGISTRY }}/${{ env.REGISTER_USER }}/${{ matrix.service_config.service }}:$VERSION
          docker push ${{ env.REGISTRY }}/${REGISTER_USER}/${{ matrix.service_config.service }}:$VERSION

      - name: Update Backend Chart Version and Image Tag
        run: |
            # 将子 Chart (helm/charts/backend/Chart.yaml) 的版本更新为 Git Tag
            # 这是 ArgoCD 追踪新 OCI Chart 的关键
            yq e '.version = "${{ env.VERSION }}"' -i helm/charts/backend/Chart.yaml
  
            # 将子 Chart (helm/charts/backend/values.yaml) 中的镜像标签更新为 Git Tag
            # 因为您要打包这个 Chart，它应该携带正确的标签
            yq e '.image.tag = "${{ github.ref_name }}"' -i helm/charts/backend/values.yaml
           
            # 如果父 Chart 的 values.yaml 也在使用，也需要更新
            # 如果您的 ArgoCD 部署是针对子 Chart OCI包，则不需要这一步
            # yq e '.backend.image.tag = "${{ github.ref_name }}"' -i helm/values.yaml

      # 打包并推送 Helm Chart 到 OCI
      - name: Bump Chart Version and Package
        run: |
          helm dependency update helm/charts/backend/
          helm package helm/charts/backend/ -d chart-packages/
          echo "${{ secrets.HELM_REGISTRY_PASS }}" | helm registry login ${{ env.HELM_REGISTRY }} -u ${{ env.HELM_REGISTRY_USER }} --password-stdin
          helm push chart-packages/backend-${{ env.VERSION }}.tgz oci://${{ env.HELM_REGISTRY }}/${{ env.HELM_REPO }}

      # 暂存更改, 拉取代码, 还原更改
      - name: Stash Changes, Pull, and Pop
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # 1. 将所有更改 (被修改的文件和新文件) 添加到索引
          #    这是 'git stash' 保存它们所必需的
          git add helm/values.yaml chart-packages/
          
          # 2. 暂存 (Stash) 更改。这会使工作目录和索引都变干净。
          git stash
          
          # 3. 拉取并变基 (Pull & Rebase)。因为仓库是干净的，所以这一步会成功。
          git pull origin main --rebase
          
          # 4. 还原 (Pop) 刚才暂存的更改。
          #    这些更改现在位于刚刚 rebase 过的最新代码之上了。
          git stash pop

      # 自动提交修改
      - name: Auto Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "CI: Auto update image tag to ${{ github.sha }} [skip ci]"

          # 要提交的文件列表
          file_pattern: "helm/values.yaml chart-packages/*"

          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # 检出 Manifest 配置仓库 (sunmery/Manifest)
      - name: Checkout Manifest Repository
        uses: actions/checkout@v5
        with:
          # 配置仓库的路径，将其检出到 manifest-repo 文件夹
          repository: sunmery/Manifest
          path: connect-example
          # 使用 PAT 来进行推送认证
          token: ${{ secrets.MANIFEST_REPO_PAT }}
#          ref: main # 假设您的配置仓库使用 main 分支
          ref: ${{ github.event.repository.default_branch }}

      # 更新 ArgoCD Application 文件中的 targetRevision 字段
      - name: Update ArgoCD targetRevision
        working-directory: connect-example
        # 确保 yq 已经在 runner 环境中
        run: |
          ls
          pwd
          # 您的 Chart 版本与 Git Tag 保持一致
          export NEW_CHART_VERSION="${{ env.VERSION }}"
          MANIFEST_FILE="connect-example/backend/argo.yaml"

          echo "Updating $MANIFEST_FILE with targetRevision: $NEW_CHART_VERSION"

          # 使用 yq 更新 spec.source.targetRevision 字段
          # targetRevision 应设置为您推送的 Helm Chart 的版本
          yq e '.spec.source.targetRevision = env(NEW_CHART_VERSION)' -i $MANIFEST_FILE
          
          echo "--- Updated Manifest Content ---"
          cat $MANIFEST_FILE
          echo "------------------------------"

      # 提交并将更改推送到 Manifest 仓库
      - name: Commit and Push Manifest Changes
        working-directory: connect-example
        run: |
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            
            git add connect-example/backend/argo.yaml # 🚨 修正：文件路径以 working-directory 为起点
            
            # 仅在有实际更改时提交
            git diff --cached --exit-code || git commit -m "CI: Auto update connect-example-backend chart version to ${{ env.VERSION }} [skip ci]"
            git push
