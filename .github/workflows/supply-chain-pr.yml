name: Supply chain PR gate

on:
  pull_request:
  workflow_dispatch:

# PR 阶段只读仓库；不授予 packages、id-token 或 security-events 写权限。
permissions:
  contents: read

concurrency:
  group: supply-chain-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks + zizmor + trivy
    runs-on: ubuntu-24.04
    steps:
      # SHA 对应 actions/checkout v5.0.0；Renovate 后续负责更新 digest。
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore scanner cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ecommerce-supply-chain
          key: supply-chain-tools-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Run PR supply-chain gate
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: ./scripts/supply-chain-pr.sh
