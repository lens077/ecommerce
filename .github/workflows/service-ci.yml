# 单个后端微服务的可复用流水线模板（workflow_call）。
# 全仓只维护这一份定义，服务名参数化——谁调用谁传 service。
# 入口与矩阵分发在 backend.yml；服务清单的真相源是 .service-matrix.yaml。
#
# 镜像同时推两处（同一次 buildx 构建，一次推两个注册表）：
#   ccr.ccs.tencentyun.com/sumery/<service>  TCR，集群拉取用 —— 同区直连，私有
#   ghcr.io/lens077/<service>                GHCR，公网/外部消费用 —— 公开
# 集群侧刻意仍指 TCR：LAN 里拉 ghcr.io 要过代理（ArgoCD 克隆 GitHub 就吃过这个亏）。
#
# tag 策略（DEVOPS.md 阶段 1：禁止 latest 参与部署；2026-08-20 起增加版本 tag）：
#   <registry>/<service>:X.Y.Z              ← tag 触发时的发布版本（不可变，部署回写用它）
#   <registry>/<service>:sha-<7位提交哈希>  ← 恒有（不可变，可追溯）
#   <registry>/<service>:dev                ← 本地 compose 的便利 tag（可变）
name: Service CI

on:
  workflow_call:
    inputs:
      service:
        description: "服务名（backend/services/ 下的目录名）"
        required: true
        type: string
      push-image:
        description: "是否推送镜像（false 时只测试+构建验证）"
        required: false
        type: boolean
        default: true
      version:
        description: "发布版本号（X.Y.Z，tag 触发时传入；非空则镜像额外打版本 tag）"
        required: false
        type: string
        default: ""
    secrets:
      TCR_USERNAME:
        required: true
      TCR_PASSWORD:
        required: true

# 推 GHCR 需要 GITHUB_TOKEN 带 packages:write；其余保持只读
permissions:
  contents: read
  packages: write
  # tag 发布时供 Cosign keyless 获取 GitHub Actions OIDC；非签名步骤不读取令牌。
  id-token: write
  # Trivy 扫描结果以 SARIF 上传到 Code scanning。缺这条时 upload-sarif 报 403，
  # 而扫描本身已经跑完——表现为「门禁生效但报告看不到」。
  security-events: write

env:
  REGISTRY: ccr.ccs.tencentyun.com
  REGISTRY_NAMESPACE: sumery
  GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: test (${{ inputs.service }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 依赖 github.com/lens077/control-tower（配置中心 SDK + 网关路由模板）。
      # 该仓 2026-08-23 起为 public，走默认 GOPROXY 即可，无需私仓凭据。
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Check protobuf compatibility
        run: |
          BASE_REF=main
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BASE_REF=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${GITHUB_REF_NAME}" \
              | sort -V | tail -1 || true)
          fi
          if [[ -z "$BASE_REF" ]]; then
            echo "无可用 protobuf breaking 基线，跳过"
            exit 0
          fi
          buf breaking --path api --against "../.git#ref=${BASE_REF},subdir=backend"

      # structcheck 是全仓结构门禁（矩阵↔目录↔网关对齐、internal/pkg 同构棘轮），
      # 任何服务的改动都必须过它；api 是共享契约，跟着服务一起验
      - name: Build service
        run: go build ./services/${{ inputs.service }}/...

      - name: Vet
        run: go vet ./services/${{ inputs.service }}/... ./api/...

      - name: Test
        run: |
          go test -short -race -count=1 \
            ./services/${{ inputs.service }}/... \
            ./api/... \
            ./structcheck/...

      # 基线对比棘轮:只拦「本次新增」的静态告警,存量由 .lint-baseline/ 冻结放行。
      # 当前后端基线为空(go vet 干净),所以这一步实际等价于硬门禁;
      # 将来接入 golangci-lint 时,先 snapshot 冻结存量即可立刻开门禁,不必先清债。
      - name: Lint baseline (go-vet)
        working-directory: .
        env:
          CHECKERS: go-vet
        run: scripts/lint-baseline.sh check

  build:
    name: image (${{ inputs.service }})
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 最终镜像层（alpine + apk）需要 arm64 模拟；Go 编译层用 BUILDPLATFORM 交叉编译，不吃模拟开销
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        if: inputs.push-image
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Login to GHCR
        if: inputs.push-image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 策略：sha-<7> 恒有（不可变、可追溯）；version 非空时（tag 触发）额外打 X.Y.Z
      # （同样按不可变对待——tag 不复用不移动，见 context/team/git-commit.md）；dev 为便利可变 tag
      - name: Compute image tags
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            for repo in "${REGISTRY}/${REGISTRY_NAMESPACE}/${{ inputs.service }}" "${GHCR_NAMESPACE}/${{ inputs.service }}"; do
              echo "${repo}:${SHA_TAG}"
              echo "${repo}:dev"
              if [[ -n "$VERSION" ]]; then echo "${repo}:${VERSION}"; fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push-image }}
          cache-from: type=gha,scope=svc-${{ inputs.service }}
          cache-to: type=gha,scope=svc-${{ inputs.service }},mode=max
          build-args: |
            SERVICE=${{ inputs.service }}
            VERSION=${{ inputs.version != '' && inputs.version || steps.meta.outputs.tag }}
            GOPROXY=https://proxy.golang.org,direct
          tags: ${{ steps.meta.outputs.tags }}

      # tag 发布阶段：Buildx 输出多架构 OCI index digest；分别解析 amd64/arm64，
      # 避免只记录 runner 默认平台，并为后续每个平台的 SBOM attestation 固定 child digest。
      - name: Generate SPDX SBOMs from immutable digest
        if: inputs.push-image && inputs.version != ''
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${GHCR_NAMESPACE}/${SERVICE}@${IMAGE_DIGEST}"
          OUT="sbom/${SERVICE}/${VERSION}"
          mkdir -p "$OUT"
          RAW_INDEX=$(docker buildx imagetools inspect "$IMAGE" --raw)
          AMD64_DIGEST=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"$RAW_INDEX")
          ARM64_DIGEST=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"$RAW_INDEX")
          for platform in linux/amd64 linux/arm64; do
            arch=${platform#linux/}
            SYFT_PLATFORM="$platform" ./scripts/generate-sbom.sh \
              "registry:${IMAGE}" "${OUT}/${SERVICE}-${arch}.spdx.json"
          done
          jq -n \
            --arg service "$SERVICE" \
            --arg version "$VERSION" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            '{service: $service, version: $version, image: $image, indexDigest: $digest, platformDigests: {"linux/amd64": $amd64, "linux/arm64": $arm64}}' \
            > "${OUT}/manifest.json"

      # 签名前的漏洞门禁。顺序是刻意的:扫描必须在 Cosign 签名**之前**——
      # 签名的语义是「我为这个制品背书」,先签后扫等于给未审查的东西背书,
      # 且高危镜像已经带着有效签名躺在仓库里,Kyverno verifyImages 也拦不住它。
      #
      # 扫的是 build 步骤输出的**不可变 digest**,不是 tag —— tag 可被覆盖,
      # 扫 tag 会出现「扫的是 A、签的是 B」的经典缺口。
      #
      # 阈值:CRITICAL 和 HIGH 阻断,且只算**有修复版本的**(ignore-unfixed)。
      # 把无修复的漏洞算进阻断集会让流水线长期红着,最后被人加 continue-on-error 绕过
      # —— 那比没有扫描更糟。无修复项仍会在 SARIF 里上报,只是不阻断。
      - name: Scan image for vulnerabilities (pre-signature gate)
        if: inputs.push-image && inputs.version != ''
        # ⚠️ 选版本要看它内部怎么引 setup-trivy，不能只看自己的 tag 在不在：
        #   @0.28.0  上游 tag 带 v 前缀，这个 ref 压根不存在 → Unable to resolve action
        #   @v0.28.0 自身存在，但内部引 setup-trivy@v0.2.1，该 tag 已被上游删除 → 同样解析失败
        #   @v0.36.0 内部对 setup-trivy 是 commit hash 固定，不受上游删 tag 影响 → 用这个
        # （现存 setup-trivy tag 只剩 v0.3.1/v0.3.0/v0.2.6，2026-08-29 实测）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_NAMESPACE }}/${{ inputs.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
        env:
          # Trivy 的漏洞库走 GHCR,命中 GitHub Actions 的匿名限流时会失败;
          # 用本 job 已有的 token 提高配额。
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy SARIF
        # 扫描失败时也要上报 —— 否则最需要看结果的那次反而拿不到报告。
        if: always() && inputs.push-image && inputs.version != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ inputs.service }}

      - name: Keyless sign index and attest platform SBOMs
        if: inputs.push-image && inputs.version != ''
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          # reusable workflow 的 Fulcio SAN 可能取 caller workflow_ref 或 job_workflow_ref；
          # 只放行本仓两份明确的发布 workflow 与裸 semver tag。
          CERT_IDENTITY_RE: ^https://github\.com/lens077/ecommerce/\.github/workflows/(backend|service-ci)\.yml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$
          CERT_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          COSIGN=$(./scripts/install-cosign.sh)
          OUT="sbom/${SERVICE}/${VERSION}"
          IMAGE=$(jq -er '.image' "${OUT}/manifest.json")
          "$COSIGN" sign --yes --bundle "${OUT}/signature.bundle.json" "$IMAGE"
          "$COSIGN" verify \
            --certificate-identity-regexp "$CERT_IDENTITY_RE" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            "$IMAGE" >/dev/null
          for arch in amd64 arm64; do
            child_digest=$(jq -er --arg platform "linux/${arch}" '.platformDigests[$platform]' "${OUT}/manifest.json")
            child_image="${GHCR_NAMESPACE}/${SERVICE}@${child_digest}"
            "$COSIGN" attest --yes \
              --predicate "${OUT}/${SERVICE}-${arch}.spdx.json" \
              --type spdxjson \
              --bundle "${OUT}/${SERVICE}-${arch}.attestation.bundle.json" \
              "$child_image"
            "$COSIGN" verify-attestation \
              --certificate-identity-regexp "$CERT_IDENTITY_RE" \
              --certificate-oidc-issuer "$CERT_ISSUER" \
              --type spdxjson \
              "$child_image" >/dev/null
          done

      # TCR 个人版对 Cosign/OCI referrers 没有官方兼容性承诺；先只用 user 服务探测，
      # 探测通过前不扩大到全服务，也不把 Kyverno verifyImages 指向 TCR。
      - name: Probe TCR Cosign compatibility
        if: inputs.push-image && inputs.version != '' && inputs.service == 'user'
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          CERT_IDENTITY_RE: ^https://github\.com/lens077/ecommerce/\.github/workflows/(backend|service-ci)\.yml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$
          CERT_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          COSIGN=$(./scripts/install-cosign.sh)
          OUT="sbom/${SERVICE}/${VERSION}"
          index_digest=$(jq -er '.indexDigest' "${OUT}/manifest.json")
          image="${REGISTRY}/${REGISTRY_NAMESPACE}/${SERVICE}@${index_digest}"
          "$COSIGN" sign --yes --bundle "${OUT}/tcr-signature.bundle.json" "$image"
          "$COSIGN" verify \
            --certificate-identity-regexp "$CERT_IDENTITY_RE" \
            --certificate-oidc-issuer "$CERT_ISSUER" \
            "$image" >/dev/null
          for arch in amd64 arm64; do
            child_digest=$(jq -er --arg platform "linux/${arch}" '.platformDigests[$platform]' "${OUT}/manifest.json")
            child_image="${REGISTRY}/${REGISTRY_NAMESPACE}/${SERVICE}@${child_digest}"
            "$COSIGN" attest --yes \
              --predicate "${OUT}/${SERVICE}-${arch}.spdx.json" \
              --type spdxjson \
              --bundle "${OUT}/tcr-${SERVICE}-${arch}.attestation.bundle.json" \
              "$child_image"
            "$COSIGN" verify-attestation \
              --certificate-identity-regexp "$CERT_IDENTITY_RE" \
              --certificate-oidc-issuer "$CERT_ISSUER" \
              --type spdxjson \
              "$child_image" >/dev/null
          done

      - name: Upload SPDX SBOM artifact
        if: inputs.push-image && inputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.service }}-${{ inputs.version }}
          path: sbom/${{ inputs.service }}/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 30
