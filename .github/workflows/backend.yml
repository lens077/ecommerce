# 后端 CI 入口：按 diff 路径算出受影响的服务，矩阵分发到 service-ci.yml 模板。
# 设计依据 DEVOPS.md 阶段 1：
#   - 流水线定义只有一份（service-ci.yml），服务名参数化
#   - 服务清单不在这里手抄，从 .service-matrix.yaml 查表（真相源）
#   - 单服务改动只触发该服务；共享代码（api/pkg/constants/go.mod）改动触发全量
#   - 构建完成后由唯一的 update-manifests job 一次性回写 helm/values.yaml
#     的镜像 tag（GitOps：ArgoCD 监听仓库自动同步），避免矩阵并发推 main 冲突
#
# 需要的 secrets：
#   TCR_USERNAME / TCR_PASSWORD  腾讯云容器镜像服务（ccr.ccs.tencentyun.com）
#   MANIFEST_PUSH_TOKEN          admin PAT——main 有分支保护（required check +
#                                code owner review），默认 GITHUB_TOKEN 推不动
name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/service-ci.yml"
      - ".service-matrix.yaml"
  workflow_dispatch:
    inputs:
      services:
        description: "逗号分隔的服务名（留空 = 全量）"
        required: false
        type: string

# 串行化同分支的运行：manifest 回写按提交顺序进行，避免旧 run 覆盖新 tag
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: detect changed services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          # 服务清单查表，不手抄（config 空壳等例外天然不在 matrix 里）
          ALL_SERVICES=$(yq -r '.services | keys | .[]' .service-matrix.yaml)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$DISPATCH_SERVICES" ]]; then
              SELECTED=$(tr ',' '\n' <<<"$DISPATCH_SERVICES" | sed 's/ //g' | grep -v '^$')
              # 手输的服务名必须在真相源里，防手滑
              while read -r svc; do
                grep -qx "$svc" <<<"$ALL_SERVICES" || { echo "未知服务: $svc（不在 .service-matrix.yaml）"; exit 1; }
              done <<<"$SELECTED"
            else
              SELECTED="$ALL_SERVICES"
            fi
          else
            # push 事件：diff 出改动文件。首推/强推时 before 是全零，退化为全量
            if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              CHANGED=""
              FULL_RUN=1
            else
              CHANGED=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
              FULL_RUN=0
            fi

            # 共享路径 → 全量（单 go.mod 单模块，共享代码影响所有服务）
            SHARED_PATTERN='^backend/(api|constants|pkg|third_party)/|^backend/go\.(mod|sum)$|^\.github/workflows/(backend|service-ci)\.yml$|^\.service-matrix\.yaml$'
            if [[ "$FULL_RUN" == 1 ]] || grep -qE "$SHARED_PATTERN" <<<"$CHANGED"; then
              SELECTED="$ALL_SERVICES"
            else
              SELECTED=$(while read -r svc; do
                grep -qE "^backend/services/${svc}/" <<<"$CHANGED" && echo "$svc" || true
              done <<<"$ALL_SERVICES")
            fi
          fi

          SERVICES_JSON=$(grep -v '^$' <<<"$SELECTED" | jq -R . | jq -cs .)
          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "受影响的服务: $SERVICES_JSON"

  ci:
    name: ci
    needs: detect
    if: needs.detect.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    uses: ./.github/workflows/service-ci.yml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  # GitOps 回写：umbrella chart 的 helm/values.yaml 是部署真相源
  # （helm/charts/ 是它的 subcharts 目录，顶层键覆盖各子 chart 的 image.tag），
  # ArgoCD ApplicationSet 监听本仓 main 的 helm/ 路径自动同步。
  # helm/** 不在本 workflow 的 paths 里，回写不会再触发自己。
  update-manifests:
    name: update helm manifests
    needs: [detect, ci]
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with push token
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.MANIFEST_PUSH_TOKEN }}

      - name: Bump image tags
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          for svc in $(jq -r '.[]' <<<"$SERVICES"); do
            yq -i ".${svc}.image.tag = \"${TAG}\"" helm/values.yaml
          done
          git diff --stat

      - name: Commit and push
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::7}"
          SVC_LIST=$(jq -r 'join(",")' <<<"$SERVICES")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet && { echo "无变化，跳过提交"; exit 0; }
          git commit -m "ci: 更新 ${SVC_LIST} 镜像 tag 至 ${TAG} [skip ci]"
          # 与后续 push 竞争时 rebase 重试；本文件只会追加改动，冲突概率极低
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "push 重试 3 次失败" && exit 1
