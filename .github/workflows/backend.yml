# 后端 CI 入口：按 diff 路径算出受影响的服务，矩阵分发到 service-ci.yml 模板。
# 设计依据 DEVOPS.md 阶段 1：
#   - 流水线定义只有一份（service-ci.yml），服务名参数化
#   - 服务清单不在这里手抄，从 .service-matrix.yaml 查表（真相源）
#   - 单服务改动只触发该服务；共享代码（api/pkg/constants/go.mod）改动触发全量
#   - 构建完成后由唯一的 update-manifests job 一次性回写镜像 tag —— **两份都写**：
#     helm/values.yaml 与 backend/services/<svc>/deploy/base/deployment.yaml（=pre；prod 在 overlays/prod 显式钉）
#     （2026-09-06 前只写 helm，而集群 apply 的是裸 manifest，发版 tag 从未到达集群），
#     避免矩阵并发推 main 冲突
#
# 需要的 secrets：
#   TCR_USERNAME / TCR_PASSWORD  腾讯云容器镜像服务（ccr.ccs.tencentyun.com）
#   MANIFEST_PUSH_TOKEN          admin PAT——main 有分支保护（required check +
#                                code owner review），默认 GITHUB_TOKEN 推不动
name: Backend CI

# 触发（2026-08-20 起）：仅发布 tag 触发（semver X.Y.Z，裸格式不带 v——旧 v1.3.x 系冻结不匹配）。
# push main 不再触发：发布节奏由打 tag 的人控制；文档/matrix 推送不再引发全量构建，
# CI 机器人回写也不再与本地历史抢跑。语义与打法见 context/team/git-commit.md「发布 tag 与 CI 触发」。
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      services:
        description: "逗号分隔的服务名（留空 = 全量）"
        required: false
        type: string

# 串行化同分支的运行：manifest 回写按提交顺序进行，避免旧 run 覆盖新 tag
concurrency:
  group: ecommerce-release
  cancel-in-progress: false

jobs:
  detect:
    name: detect changed services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Release regression checks
        run: |
          python3 scripts/test-promote-release.py
          python3 scripts/test-frontend-release.py

      - name: Detect
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DISPATCH_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          # 服务清单查表，不手抄（config 空壳等例外天然不在 matrix 里）
          ALL_SERVICES=$(yq -r '.services | keys | .[]' .service-matrix.yaml)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REF_TYPE" != tag ]] || { echo "Dispatch only on a branch; release tags use push events" >&2; exit 1; }
            if [[ -n "$DISPATCH_SERVICES" ]]; then
              SELECTED=$(tr ',' '\n' <<<"$DISPATCH_SERVICES" | sed 's/ //g' | grep -v '^$')
              # 手输的服务名必须在真相源里，防手滑
              while read -r svc; do
                grep -qx "$svc" <<<"$ALL_SERVICES" || { echo "未知服务: $svc（不在 .service-matrix.yaml）"; exit 1; }
              done <<<"$SELECTED"
            else
              SELECTED="$ALL_SERVICES"
            fi
          elif [[ "$CURRENT_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            # A release is a complete promotable set, including search even without a path diff.
            SELECTED="$ALL_SERVICES"
          else
            echo "Release tag must be canonical X.Y.Z" >&2
            exit 1

          fi

          SERVICES_JSON=$(grep -v '^$' <<<"$SELECTED" | jq -R . | jq -cs .)
          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "受影响的服务: $SERVICES_JSON"

  ci:
    name: ci
    needs: detect
    if: needs.detect.outputs.services != '[]'
    # 被调用的 workflow 只能收窄、不能放大调用方的令牌权限，
    # 所以推 GHCR 需要的 packages:write 必须在这里也给出
    permissions:
      contents: read
      packages: write
      # reusable workflow 只能收窄调用方权限，Cosign keyless 需要调用方显式授予 OIDC。
      id-token: write
      # 同理：service-ci.yml 的 Trivy SARIF 上传需要调用方先授予 security-events。
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    uses: ./.github/workflows/service-ci.yml
    with:
      service: ${{ matrix.service }}
      # tag 触发时镜像同时打上版本号（X.Y.Z + sha-<7> 双标）；手动 dispatch 只有 sha
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit

  # 两个前端随同一发布 tag 在 amd64/arm64 原生 runner 上构建（frontend-release.yml），
  # 只需要 TCR 凭据，显式传递而不 inherit——zizmor 的 secrets-inherit / excessive-permissions 两条都因此不触发。
  frontend:
    if: github.ref_type == 'tag'
    needs: detect
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}

  # 镜像 tag 回写：两份部署真相源（helm/values.yaml 顶层键的 image.tag，与
  # backend/services/<svc>/deploy/base/deployment.yaml 的 image:）必须同步写，
  # 写完先跑 scripts/verify-deploy-parity.sh 证明两边仍等价再提交。
  # 回写提交带 [skip ci]，本 workflow 只由 tag 触发，回写不会再触发自己。
  update-manifests:
    name: update deploy manifests (helm + raw)
    needs: [detect, ci, frontend]
    if: >-
      always() && needs.ci.result == 'success' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      needs.detect.outputs.services != '[]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with push token
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          token: ${{ secrets.MANIFEST_PUSH_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to TCR for release verification
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Bump image tags (helm + raw manifests)
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION" ]]; then
            python3 scripts/promote-release.py --environment pre --version "$VERSION"
            exit 0
          fi
          # Manual backend-only builds do not promote production.
          TAG="sha-${GITHUB_SHA::7}"
          for svc in $(jq -r '.[]' <<<"$SERVICES"); do
            yq -i ".${svc}.image.tag = \"${TAG}\"" helm/values.yaml
            repo="$(yq -r ".${svc}.image.repository" helm/values.yaml)"
            # 裸 manifest 用 sed 而不是 yq -i：yq 会重排注释与缩进，把一份手写文档变成机器输出
            sed -i -E "s#^( +image: )${repo}:.*\$#\1${repo}:${TAG}#" \
              "backend/services/${svc}/deploy/base/deployment.yaml"
            grep -q "image: ${repo}:${TAG}\$" "backend/services/${svc}/deploy/base/deployment.yaml" \
              || { echo "裸 manifest 回写失败：${svc}" >&2; exit 1; }
          done
          git diff --stat

      # 回写后两份必须仍然等价；不等价说明有人只改了一边，此时宁可不提交
      - name: Deploy parity after bump
        run: scripts/verify-deploy-parity.sh

      - name: Commit and push
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          TAG="${VERSION:-sha-${GITHUB_SHA::7}}"
          SVC_LIST=$(jq -r 'join(",")' <<<"$SERVICES")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$VERSION" ]]; then
            printf '\n- CI release `%s`: verified all backend and frontend linux/amd64 + linux/arm64 indexes; updated pre manifests only. Production promotion remains explicit.\n' "$VERSION" >> TODO.md
          fi
          git add helm/values.yaml backend/services/*/deploy/base/deployment.yaml \
            frontend/apps/consumer/deploy/pre/deployment.yaml \
            frontend/apps/consumer-next/deploy/base/consumer-next.yaml TODO.md
          git diff --cached --quiet && { echo "无变化，跳过提交"; exit 0; }
          git commit -m "ci: 更新 ${SVC_LIST} 镜像 tag 至 ${TAG} [skip ci]"
          # 与后续 push 竞争时 rebase 重试；本文件只会追加改动，冲突概率极低
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "push 重试 3 次失败" && exit 1
