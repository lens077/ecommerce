name: Backend gate

# 后端门禁 = GitLab backend-gate 搬进 GitHub Actions（2026-11-22 node5 runner 下线后接替）。
# 与 GitLab 版的差异：
# - 去掉 1Gi 构建试验的全部内存防护（GOFLAGS -p=1、GOMAXPROCS、GOGC、GOMEMLIMIT）——
#   GH 托管 runner 约 16GB；GOPROXY 也不再需要 goproxy.cn|direct 链（GH 直连 proxy.golang.org 可达），
#   模块哈希仍由 go.sum 校验；go test 保留 -parallel=1 与 GitLab 语义完全一致（首跑稳定优先）。
# - golangci-lint 仍走 scripts/ci-install-golangci-lint.sh（版本 + SHA-256 钉死），
#   GH 直连快，置 GITHUB_PROXIES="" 跳过第三方代理。
# - Go 缓存用 actions/setup-go 内置（按 backend/go.sum 键控），替代 GitLab cache: .cache/*。
# 触发路径与 GitLab rules 一致：structcheck 比对 helm values 与 .service-matrix.yaml，helm/ 也算后端输入。
on:
  push:
    branches:
      - main
    paths:
      - "backend/**/*"
      - "helm/**/*"
      - ".service-matrix.yaml"
      - ".github/workflows/backend-gate.yml"
      - ".lint-baseline/**"
      - "scripts/lint-baseline.sh"
      - "scripts/ci-install-golangci-lint.sh"
  pull_request:
    paths:
      - "backend/**/*"
      - "helm/**/*"
      - ".service-matrix.yaml"
      - ".github/workflows/backend-gate.yml"
      - ".lint-baseline/**"
      - "scripts/lint-baseline.sh"
      - "scripts/ci-install-golangci-lint.sh"
  workflow_dispatch: {}

# 所有 job 只读仓库（与 frontend-gate.yml / context-gate.yml 同一收窄口径）。
permissions:
  contents: read

concurrency:
  group: backend-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5（与 backend.yml 同一 pin）

      # 版本唯一真相源是 backend/go.mod 的 go/toolchain 指令，不硬编码。
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # 模块缓存与 go.sum 的一致性。2026-11-26 本地实测：缓存里 go-connect-kit v1.1.0 的
      # ziphash 被换成与 go.sum 不同的值，`go build ./...` 直接 SECURITY ERROR，报错只指向
      # 第一个 import 它的包，像代码问题。这一层在编译前指认根因（缓存不可信 vs 代码）。
      - name: Verify module cache
        run: go mod verify

      # go.mod/go.sum 与 import 的漂移。`-diff` 干净时静默退出 0，有差异时打印差异并非零退出；
      # 不带 -diff 的 tidy 会静默改文件，放进门禁等于让 CI 改写工作树。
      - name: go.mod/go.sum drift
        run: go mod tidy -diff

      # 格式不在 lint 棘轮的覆盖范围（它只有 go vet / revive / 前端），此前全靠编辑器保存时
      # gopls 格式化，headless 改动漏过去只剩评审一道。gofmt -l 递归整棵 backend，只列不改。
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 未格式化，本地 gofmt -w 后提交："
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests (-short)
        run: go test -short -count=1 -parallel=1 ./...

      - name: Install golangci-lint
        working-directory: .
        env:
          GITHUB_PROXIES: ""
        run: sh scripts/ci-install-golangci-lint.sh "$(go env GOPATH)/bin"

      # lint 棘轮：revive-exported / staticcheck / deadcode 都只拦新增，存量由 .lint-baseline/ 冻结。
      # 三个 Go 工具里的后两个版本钉在 backend/go.mod 的 tool 段（`go tool staticcheck|deadcode`），
      # 不再靠各机器装的是哪个版本；structcheck 会比对 helm values 顶层键与 .service-matrix.yaml。
      - name: lint baseline ratchet
        working-directory: .
        run: |
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          CHECKERS="revive-exported staticcheck deadcode" bash scripts/lint-baseline.sh check
