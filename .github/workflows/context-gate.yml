name: Context knowledge-base gate

# context/ 知识库结构门禁(参照 deepseek-harness 的 doc-sync 门禁族移植):
# 链接可达性 / INDEX 覆盖(孤儿) / frontmatter / experience 格式(基线棘轮)
# / evolution-log 四要素 / AGENTS.md 预算。
#
# 触发:每个 PR / 分支 push 全量跑,不做路径过滤(路径过滤本身也是一处会漂移的手抄清单),
# 外加发布 tag。**本仓是 public + 标准 runner,GitHub Actions 对其零计费**
# (2026-08-29 实测账单:8 月 ecommerce 用了 2625 分钟,grossAmount $15.75、
# discountAmount −$15.75、**netAmount $0.00**),所以这条门禁的运行成本是零。
#
# ⚠️ 不要因为「省额度」把它改回 tag 触发——2026-08-29 曾这么改过一次,
# 依据是「Actions 预算超支」,但实测证伪:Actions `enabled:true`、改动前 35 秒成功跑完、
# 账单净额为 0。改成 tag 触发的真实后果是:GitHub 分支保护把 `verify-context` 列为
# 必需检查,而它永远不再产生结果,PR 会永久卡在 `expected`。理由见 evolution-log 同日条目。
#
# 本 job 约 35 秒(脚本毫秒级,canary 元评测占大头);真正贵的是 backend.yml 的
# 多架构 buildx(单次 6m32s),那条保持 tag 触发。
on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  verify-context:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify context knowledge base structure
        shell: bash
        run: ./scripts/verify-context.sh

      # 门禁的元评测:注入九类已知坏样本,断言门禁还会红(防 commitlint/freeze 式恒绿失效)。
      # 每次 push 都跑 = 把「它红过吗」从一次性手工验证变成持续证明。约 1 分钟。
      - name: Canary the gate itself (must still turn red)
        shell: bash
        run: ./scripts/verify-context-canary.sh

  # 凭据门禁:gitleaks 扫全部历史。规则与 allowlist 在 .gitleaks.toml,与 pre-commit 同一份。
  # 触发事故 2026-09-02:public 仓库历史里 30 个提交带着 PG root 弱口令 / Casdoor client_secret /
  # 支付 RSA 私钥 / base64 的 Consul KV 快照,已用 filter-repo 重写并强推。这条 job 是
  # 「历史保持干净」的持续证明;pre-commit 拦本机,这里拦绕过钩子(SKIP_GITLEAKS / --no-verify)的提交。
  # 注意 fetch-depth: 0——浅克隆只能扫最新提交,等于没扫。
  #
  # ⚠️ 不要换回 gitleaks/gitleaks-action:首跑(run 33612585369)实测它在 push 事件上拼的是
  # `gitleaks detect --log-opts=-1`,只扫本次推送的提交(日志 `1 commits scanned`),fetch-depth: 0
  # 白拉;而且它自带 8.24.3。直接跑二进制,命令与 .gitlab-ci.yml 的 gitleaks job 逐字相同,
  # 两边才是同一道门。版本与 sha256 手动钉死,升级时两处一起改。
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan full history for credentials
        shell: bash
        run: |
          gitleaks version
          set +e
          out=$(gitleaks git . -c .gitleaks.toml --no-banner --redact=80 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # 断言真的扫了全历史:gitleaks 会打 `N commits scanned`,N 远大于 1 才算扫过历史
          # (仓库 2026-09-02 有 700+ 提交;浅克隆或增量模式下这里会是个位数)。
          n=$(printf '%s\n' "$out" | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' || true)
          [ "${n:-0}" -gt 100 ] || { echo "gitleaks 只扫了 ${n:-0} 个提交:历史没拉全或命令被改成了增量,门禁失效" >&2; exit 1; }
