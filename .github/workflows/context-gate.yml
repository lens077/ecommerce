name: Context knowledge-base gate

# context/ 知识库结构门禁(参照 deepseek-harness 的 doc-sync 门禁族移植):
# 链接可达性 / INDEX 覆盖(孤儿) / frontmatter / experience 格式(基线棘轮)
# / evolution-log 四要素 / AGENTS.md 预算。
#
# 触发(2026-08-29 起):**仅发布 tag**(裸 semver `X.Y.Z`,与 backend.yml 同一条纪律)。
# 原为「每个 PR / 分支 push 全量跑」,已停——GitHub Actions 预算超支后平台会直接
# 拒绝运行;把额度烧在每次 push 上,反而让真正需要证据的发版时刻跑不动。
#
# ⚠️ per-push 覆盖没有丢:`.gitlab-ci.yml` 的同名 context-gate job 仍挂在
# `$CI_COMMIT_BRANCH` 与 MR 上,而 origin 就是 GitLab(github 是第二远端),
# 日常 push 先到的是有门禁那一侧。本地 `scripts/verify-context.sh` 仍是提交前锚点。
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  verify-context:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify context knowledge base structure
        shell: bash
        run: ./scripts/verify-context.sh

      # 门禁的元评测:注入九类已知坏样本,断言门禁还会红(防 commitlint/freeze 式恒绿失效)。
      # 每次 push 都跑 = 把「它红过吗」从一次性手工验证变成持续证明。约 1 分钟。
      - name: Canary the gate itself (must still turn red)
        shell: bash
        run: ./scripts/verify-context-canary.sh
