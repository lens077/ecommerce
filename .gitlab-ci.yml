# GitLab CI —— origin(GitLab)侧的**门禁**,不做发布。
#
# 两个远端的职责切分(2026-09-02 定稿,理由见 context/team/git-commit.md「发布 tag 与 CI 触发」):
#   origin  GitLab  日常 push / MR 的去处 → 这里跑不需要凭据、不产制品的门禁
#   github  GitHub  发布 tag 只推它     → 多架构镜像 / Trivy / Cosign / SBOM 那整套在那边
# 发布链不搬到 GitLab:签名身份(Fulcio 证书里的 GitHub workflow ref)、SARIF 上报目的地、
# buildx 的 gha 缓存、零计费的 public runner 都绑在 GitHub 上,搬家换不到新能力。
# 反过来 GitHub 只由 tag 触发,MR/分支 push 在那边**没有任何代码门禁**——这正是本文件补的:
# 本地锚点(AGENTS.md「命令与验收锚点」)里的三条在每次 push 时跑一遍。
#
# 同一个发布 tag 只允许一边写镜像仓与回写清单,所以本文件对 tag **不建流水线**(见 workflow 段)。
#
# 2026-08-24:原本还有一个 freeze-check job(冻结验收集守卫),随整套 Frozen Nodes
# 机制一并删除——`.freeze/` 建起来之后从未放进过一组真实冻结集,`verify-freeze.sh`
# 恒返回 rc=0,是一道恒绿的假门禁。理由见 context/harness-framework/evolution-log.md。

# 流水线级规则(参照 deepseek-harness 的 .gitlab-ci.yml 顶层 workflow 段):
# 一处决定「什么事件建流水线」,job 只管「改了什么才跑」。
#   - MR 事件建;分支 push 若已有开着的 MR 则不重复建(否则同一提交跑两遍);
#   - 其余分支 push 建;
#   - tag 与其它来源(schedule/api/web)一律不建——发布走 github 远端。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - test

default:
  # 同一分支来了新 push 就取消还在跑的旧流水线:gitlab.com 的 compute minutes 是计量的
  # (不同于 GitHub public 仓的零计费),旧提交的结果没人看。
  interruptible: true

# context/ 知识库结构门禁,与 GitHub 的 context-gate.yml 等价(检查项见脚本头注释)。
# 不做路径过滤:与 GitHub 侧同一理由——路径清单本身是一处会漂移的手抄。全程约 1.5 分钟。
context-gate:
  stage: test
  image: alpine:3.20
  # busybox 的 grep/sed/awk 行为有差异,统一换 GNU 版,与本机/GitHub runner 对齐。
  before_script:
    - apk add --no-cache bash git grep sed gawk coreutils findutils
  script:
    - bash ./scripts/verify-context.sh
    # 门禁的元评测:注错断言门禁还会红,防恒绿失效(与 GitHub 侧同款)。
    - bash ./scripts/verify-context-canary.sh

# 凭据门禁:gitleaks 扫全部历史,与 GitHub context-gate.yml 的 gitleaks job 等价。
# 触发事故 2026-09-02(见 evolution-log):public 仓历史里有 PG root 弱口令等,已重写强推。
# GIT_DEPTH: 0 必须——GitLab 默认浅克隆(20),浅历史扫描等于没扫。
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks version
    # 与 GitHub context-gate.yml 的 gitleaks job 同一条命令 + 同一条「扫描数 > 100」断言:
    # 浅克隆或增量模式下 `N commits scanned` 会是个位数,那就是假门禁,直接红。
    - |
      set +e
      out=$(gitleaks git . -c .gitleaks.toml --no-banner --redact=80 2>&1); rc=$?
      set -e
      printf '%s\n' "$out"
      [ "$rc" -eq 0 ] || exit "$rc"
      n=$(printf '%s\n' "$out" | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' || true)
      [ "${n:-0}" -gt 100 ] || { echo "gitleaks 只扫了 ${n:-0} 个提交:历史没拉全或命令被改成了增量,门禁失效" >&2; exit 1; }

# 后端门禁 = 本地锚点 `go build && go vet && go test -short ./...` 原样搬进 CI。
# `./...` 已含 structcheck(矩阵↔目录↔网关↔helm 四处对齐),不必单列。
# 不跑 buf breaking:在 GitHub 发布链按 tag 区间比对。
# 跑 lint-baseline 的 revive-exported(导出符号必须有注释,规则集在 backend/.golangci-exported.yml,
# 711 条存量已冻结,只拦新增):GitHub 侧只由 tag 触发,每次 push 的这道门只能在这里守。
# go-vet 基线为空、等价于上面的 go vet,不重复跑。golangci-lint 用官方脚本装固定版本
# (与本地 brew 版一致,采集结果才可复现),二进制落在 GOPATH/bin。
backend-gate:
  stage: test
  image: golang:1.27
  variables:
    # 缓存落在项目目录内才能被 GitLab cache 抓到;默认 GOPATH 在容器里,每次都冷。
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    # 依赖 github.com/lens077/control-tower(public),走默认 GOPROXY 即可,无需私仓凭据。
    GOPROXY: https://proxy.golang.org,direct
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .cache/go-mod
      - .cache/go-build
  script:
    - cd backend
    - go build ./...
    - go vet ./...
    - go test -short -count=1 ./...
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - cd "$CI_PROJECT_DIR" && CHECKERS=revive-exported bash scripts/lint-baseline.sh check
  rules:
    # structcheck 会比对 helm values 顶层键与 .service-matrix.yaml,所以 helm/ 也算后端输入。
    - changes:
        - backend/**/*
        - helm/**/*
        - .service-matrix.yaml
        - .gitlab-ci.yml

# 前端门禁 = 本地锚点 `pnpm ready`(fmt + lint + test + build)原样搬进 CI。
# 这是全仓**唯一**跑 pnpm ready 的 CI:GitHub 侧 frontend.yml 只剩每周一次的线上登录冒烟。
frontend-gate:
  stage: test
  image: node:24
  variables:
    # pnpm 版本只认 frontend/package.json 的 packageManager 字段(单一真相源,
    # 参照 deepseek-harness 从 package.json 取版本的做法)。不用 corepack:Node 25 起不再内置,
    # 直接 npm 装指定版本对任何 Node 镜像都成立。
    PNPM_STORE: $CI_PROJECT_DIR/.cache/pnpm-store
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .cache/pnpm-store
  before_script:
    - cd frontend
    - PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
    - npm install -g "pnpm@${PNPM_VERSION}"
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  script:
    - pnpm ready
    # hygiene 棘轮:knip(未用依赖/导出/重复导出/catalog 条目)只拦新增,存量由
    # .lint-baseline/knip.txt 冻结;vp-lint 基线为空、pnpm ready 已跑过 lint,故这里只跑 knip。
    - cd "$CI_PROJECT_DIR" && CHECKERS=knip bash scripts/lint-baseline.sh check
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
