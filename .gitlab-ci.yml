# GitLab CI —— 冻结验收集守卫(Frozen Nodes)。
# 与 GitHub 的 .github/workflows/freeze-check.yml 等价:在每次 push 与 MR 上跑,
# 校验已冻结的验收测试没被偷偷改动(内容变 DRIFT / 删移 MISSING → 退出码 1 → 流水线红)。
# 正规更新验收集须走 freeze.sh 重新冻结 + GitLab 的 CODEOWNERS/审批(Premium)把关。

freeze-check:
  stage: test
  image: alpine:3.20
  # verify-freeze.sh 需要 bash(用了字符串切片)、git(取仓库根)、sha256sum(coreutils)。
  before_script:
    - apk add --no-cache bash git coreutils
  script:
    - bash ./scripts/verify-freeze.sh --all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
