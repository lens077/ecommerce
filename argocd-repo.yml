# Public GitLab repository declaration for ArgoCD.
# No credential is stored here: the repository is public. If it becomes
# private, create the repository Secret out of band and never commit a token.
apiVersion: v1
kind: Secret
metadata:
  name: repo-gitlab-ecommerce
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/managed-by: git
stringData:
  type: git
  name: gitlab-ecommerce
  project: ecommerce
  url: https://gitlab.com/sumery/ecommerce.git
