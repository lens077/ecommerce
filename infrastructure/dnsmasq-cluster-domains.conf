# /etc/dnsmasq.d/cluster-domains.conf
#
# 集群服务的具体记录。dnsmasq 的具体记录优先于 dev-domains.conf 里
# address=/dev.test/192.168.3.220 那条通配，因此这些域名不会被吸到宿主机。
#
# 2026-08-18 由 app.com 迁移而来；IP 取自新集群实况（kubectl get svc/gateway）。

# ── 共享网关（Cilium Gateway，HTTPRoute 全部挂在这里）────────────────
# ⚠️ 192.168.3.100 落在 LB 池 100-199 内，与路由器 DHCP 段重叠，
#    已实测被局域网其他设备抢占过。见 local-env.md 的处置建议。
address=/argocd.dev.test/192.168.3.100
address=/grafana.dev.test/192.168.3.100
address=/jaeger.dev.test/192.168.3.100
address=/jaeger-http.dev.test/192.168.3.100
address=/logs.dev.test/192.168.3.100
address=/metrics.dev.test/192.168.3.100
address=/search.dev.test/192.168.3.100
address=/minio-ui.dev.test/192.168.3.100
address=/s3.dev.test/192.168.3.100
address=/consul.dev.test/192.168.3.100

# ── 直连 LoadBalancer（不经网关）────────────────────────────────────
# Consul HTTP API：8500，供服务注册发现使用
address=/consul-api.dev.test/192.168.3.102
# Dragonfly：6379 纯 TCP，无 TLS，需 AUTH
address=/dragonfly.dev.test/192.168.3.101

# ── 节点 ────────────────────────────────────────────────────────────
address=/node1.dev.test/192.168.3.201
address=/node2.dev.test/192.168.3.202
