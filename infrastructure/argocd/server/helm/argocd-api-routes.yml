# ArgoCD CLI/API 入口：只走 80 明文（h2c / HTTP/1.1）。
# Web UI 走 443 HTTPS，由 gateway/http-route.yml（argocd.dev.test）+ Pangolin rid 60（argocd.apikv.com）承载。
#
# 为什么 API 不走 443：
#   本集群 cilium-config 的 enable-gateway-api-alpn=false，HTTPS 监听器不宣告 h2 ALPN，
#   原生 gRPC 拿不到 HTTP/2；gRPC-Web 经 Envoy 的 HTTP/1.1 转发后 ArgoCD 返回 404
#   （CLI 表现为 code = Unimplemented）。2026-09-23 集群内实测：只有「原生 gRPC → 80 h2c」成功。
#   Cilium Envoy 上游协议镜像下游协议，客户端以 h2c 连 80 时上游也是 h2c，
#   argocd-server（server.insecure=true）用 cmux 把 HTTP/2 分给 gRPC 监听器。
#
# 安全边界（用户已于 2026-09-24 明确接受明文风险）：
#   80 不加密，admin 密码与 session token 明文过链路。只允许 remote-dev / VPN 来源访问，
#   Pangolin 资源必须配访问规则拒绝其余来源。
#
# 若日后打开 enable-gateway-api-alpn 与 enable-gateway-api-app-protocol，
# 可退回「GRPCRoute + appProtocol h2c」的 443 标准形态，并删除本路由。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-api-http
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: git
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: http
  hostnames:
    # LAN 直连 Gateway 用 dev.test；remote-dev 经 Pangolin 时 Host 保持公网域名，同一条路由都能匹配。
    - argocd-api.dev.test
    - argocd-api.apikv.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
