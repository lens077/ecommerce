apiVersion: v1
kind: Namespace
metadata:
  name: ces-audit
  labels:
    app.kubernetes.io/name: ces-audit
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ces-audit
  namespace: ces-audit
  labels:
    app.kubernetes.io/name: ces-audit
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ces-audit
  labels:
    app.kubernetes.io/name: ces-audit
rules:
  - apiGroups: [cilium.io]
    resources: [ciliumendpoints]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumendpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ces-audit
  labels:
    app.kubernetes.io/name: ces-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ces-audit
subjects:
  - kind: ServiceAccount
    name: ces-audit
    namespace: ces-audit
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ces-audit
  namespace: ces-audit
  labels:
    app.kubernetes.io/name: ces-audit
spec:
  schedule: "*/2 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ces-audit
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ces-audit
        spec:
          serviceAccountName: ces-audit
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
              imagePullPolicy: IfNotPresent
              command: [python3, /opt/ces-audit/ces_audit.py]
              env:
                - name: CES_METRICS_URL
                  value: http://metrics.apikv.com/api/v1/import/prometheus
                - name: CLUSTER_NAME
                  value: ecommerce-dev
                - name: CES_AUDIT_SOURCE
                  value: cronjob
              resources:
                requests:
                  cpu: 10m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: script
                  mountPath: /opt/ces-audit
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: ces-audit-script
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
