# CEL (NamespacedImageValidatingPolicy) migration of legacy namespaced Policy/ecommerce-image-provenance.
# Keeps Audit + failurePolicy Ignore + same keyless identity (subjectRegExp/issuer/rekor).
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: ecommerce-image-provenance
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/managed-by: argocd
  annotations:
    policies.kyverno.io/title: ecommerce image provenance (audit)
    policies.kyverno.io/description: >-
      Audit that ccr.ccs.tencentyun.com/sumery/user images carry a Cosign keyless
      signature issued to this repository's release workflows.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ccr.ccs.tencentyun.com/sumery/user*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: true
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/lens077/ecommerce/\\.github/workflows/(backend|service-ci)\\.yml@refs/tags/[0-9]+\\.[0-9]+\\.[0-9]+$"
        ctlog:
          url: "https://rekor.sigstore.dev"
  evaluation:
    background:
      enabled: true
  variables:
    - name: allImages
      expression: >-
        images.?containers.orValue([]) + images.?initContainers.orValue([]) +
        images.?ephemeralContainers.orValue([])
  validations:
    - message: "Images must carry a trusted Cosign keyless signature"
      expression: >-
        variables.allImages.map(image,
          verifyImageSignatures(image, [attestors.github])).all(count, count > 0)
