# 定义 Argo CD 中 "ecommerce" 项目的安全边界和权限策略。
# 该项目将管理所有电商微服务应用（如 address、cart、order 等），
# 无论它们是直接通过 Application 资源创建，还是由 ApplicationSet
# 动态生成。本资源配置了允许的 Git 仓库、目标集群/命名空间以及
# 可创建的 Kubernetes 资源类型，确保只有在授权范围内的应用才能
# 被同步到集群。
apiVersion: argoproj.io/v1alpha1          # Argo CD AppProject 的 API 版本
kind: AppProject                          # 资源类型：项目
metadata:
  name: ecommerce                         # 项目名称，需与 Application 中 spec.project 匹配
  namespace: argocd                       # 必须部署在 argocd 命名空间
  # 可选：添加 labels/annotations 便于管理
  # labels:
  #   team: ecommerce
spec:
  
  # 1. 允许该项目使用的 Git 仓库源（支持通配符 *）
  #    可列出多个仓库，确保只从可信源拉取清单。
  
  sourceRepos:
    - 'https://github.com/lens077/ecommerce.git'  # 主源：CI(update-manifests) 回写镜像 tag 的仓库，与 argocd-app.yml 的 repoURL 一致
    - 'https://gitlab.com/sumery/ecommerce.git'   # HTTPS 方式（读写可通过 Personal Access Token）
    - 'git@gitlab.com:sumery/ecommerce.git'       # SSH 方式（需配置 SSH 私钥）
  # 如果希望允许任何仓库（极不推荐），可使用：
  # - '*'

  
  # 2. 允许部署的目标集群和命名空间
  #    每个 destination 指定一个集群和一个命名空间，可添加多条。
  
  destinations:
    - namespace: ecommerce                      # 允许部署到的命名空间
      server: https://kubernetes.default.svc    # 目标集群 API Server（此处为本地集群）
  # 如需允许其他命名空间（如 staging），可以添加：
  # - namespace: staging
  #   server: https://kubernetes.default.svc
  # 如需允许所有命名空间（不推荐），可使用 namespace: '*'

  
  # 3. 允许部署的集群作用域资源（Cluster-scoped resources）
  #    如 ClusterRole、PersistentVolume 等。若应用不需要，应缩紧。
  
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  
  # 4. 允许部署的命名空间作用域资源（Namespaced resources）
  #    如 Deployment、Service、ConfigMap 等。建议按需限制。
  
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  
  # 5. 可选：RBAC 角色定义（限制用户/组对该项目内资源的操作）
  #    此处未启用，可根据需要添加。
  
  # roles:
  # - name: admin
  #   description: 管理员权限
  #   policies:
  #   - p, proj:ecommerce:admin, applications, *, ecommerce/*, allow
  #   groups:
  #   - my-admin-group

  # 6. 同步窗口（限制自动同步的时间段）
  #
  # ⚠️ 这里【刻意不写死】开发窗口。内环开发（okteto up 会直接改集群里的 Deployment，
  #    与 selfHeal 冲突）用脚本按需开关，不进 Git：
  #
  #      scripts/argocd-devwindow.sh off      # 开发前：暂停自动同步
  #      scripts/argocd-devwindow.sh on       # 开发后：恢复
  #      scripts/argocd-devwindow.sh status   # 查当前状态
  #
  #    脚本往本字段追加一条「永远激活」的 deny 窗口
  #    （kind=deny / schedule='* * * * *' / duration=24h / applications=['*'] / manualSync=true），
  #    结束时只移除自己那条，不会动下面这类你手写的窗口。
  #    写进 Git 会让「临时暂停」变成永久状态——GitOps 静默失效是最难排查的一类故障。
  #    背景与完整工作流见 docs/OKTETO.md。
  #
  # 真正的长期窗口（如生产维护时段）才写在这里：
  # syncWindows:
  # - kind: allow
  #   schedule: '10 4 * * *'
  #   duration: 1h
  #   applications:
  #   - '*-prod'
  #   manualSync: true

  
  # 7. 项目描述（便于团队识别）
  description: "ecommerce 微服务项目"
