apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-outbox-relay
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-outbox-relay
    app.kubernetes.io/component: cdc-relay
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce-outbox-relay
        app.kubernetes.io/component: cdc-relay
        app.kubernetes.io/part-of: ecommerce
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
      serviceAccountName: ecommerce-outbox-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-relay
          image: ccr.ccs.tencentyun.com/sumery/outbox-relay:cdc-dev-035dfa48b0fb@sha256:6f78f8c346f85d34cb847d34716d83cf4458813ab550e8f6689e56151b5ccb56
          imagePullPolicy: IfNotPresent
          args:
            - -table=products.outbox
            - -stream=ECOMMERCE_EVENTS
            - -subjects=events.>
            - -replicas=1
            - -batch=100
            - -poll=1s
            # 持久 DLQ 落地前保留已发布行，避免 terminal event 的重放源被清理。
            - -retention=-1s
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-cdc-postgres
                  key: DB_URI
            - name: NATS_URL
              value: nats://nats.nats.svc:4222
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgresql/ca
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: ecommerce-cdc-postgres-ca
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-outbox-relay
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-outbox-relay
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # 集群内 CNPG。2026-08-24 PG 切到 node3 后这条已无对端（CNPG 已 hibernate），
    # 保留是为了回滚时不用再改策略。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgresql
      ports:
        - { protocol: TCP, port: 5432 }
    # node3 PostgreSQL，经 node1(node1) 的 Pangolin raw TCP 入口。
    #
    # ⚠️ 这条是 2026-08-24 补的，补之前 relay 一直 `connect: connection timed out`：
    # 十个业务服务改连 node3 后都正常，唯独 relay 起不来——因为**只有 relay /
    # search-indexer / seed 这几个 tool 带 NetworkPolicy**，而策略里只放行了
    # postgresql 命名空间。库搬到集群外时，egress 白名单必须跟着改，
    # 否则症状是超时而不是拒绝，很容易误判成隧道慢。
    - to:
        - ipBlock: { cidr: <node1-source-cidr> }
      ports:
        - { protocol: TCP, port: 30001 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
      ports:
        - { protocol: TCP, port: 4222 }
