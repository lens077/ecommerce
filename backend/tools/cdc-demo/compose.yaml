# CDC 链路本地演示环境：PostgreSQL 18 + NATS JetStream + Meilisearch v1.53。
# 版本与当前主库大版本对齐（PG 18 / Meili v1.53，见 context/team/local-env.md 与 docs/TESTING.md）。
# 就绪探测放在 run.sh 宿主侧（curl/pg_isready）——nats/meili 镜像内没有可靠的
# curl/wget，容器内 healthcheck 会永远不过（实测踩过，run.sh 曾卡死在 --wait）。
# 端口刻意避开常用位（15432/14222/17700）。
name: ecommerce-cdc-demo
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "14222:4222"
      - "18222:8222"

  meilisearch:
    image: getmeili/meilisearch:v1.53
    environment:
      MEILI_MASTER_KEY: cdc-demo-master-key   # 仅本地演示用的固定值，非真实凭据
      MEILI_ENV: development
    ports:
      - "17700:7700"
