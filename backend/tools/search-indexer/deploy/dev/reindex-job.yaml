apiVersion: batch/v1
kind: Job
metadata:
  name: ecommerce-search-reindex
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-search-reindex
    app.kubernetes.io/component: search-reindex
    app.kubernetes.io/part-of: ecommerce
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce-search-reindex
        app.kubernetes.io/component: search-reindex
        app.kubernetes.io/part-of: ecommerce
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tcr-pull-secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-reindex
          image: ccr.ccs.tencentyun.com/sumery/search-indexer:cdc-dev-bdbed8fee9c9@sha256:dc578f10a15f088dcfd6a5bb02b0bf63a302fed11a04ed49115e209137ece50a
          imagePullPolicy: IfNotPresent
          args:
            - -mode=reindex
            - -index=products
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-cdc-postgres
                  key: DB_URI
            - name: MEILI_HOST
              value: http://meilisearch.search.svc:7700
            - name: MEILI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-search-reindex
                  key: MEILI_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgresql/ca
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: ecommerce-cdc-postgres-ca
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-search-reindex
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-search-reindex
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgresql
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: search
      ports:
        - { protocol: TCP, port: 7700 }
