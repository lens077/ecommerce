apiVersion: batch/v1
kind: Job
metadata:
  name: ecommerce-search-reindex
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-search-reindex
    app.kubernetes.io/component: search-reindex
    app.kubernetes.io/part-of: ecommerce
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce-search-reindex
        app.kubernetes.io/component: search-reindex
        app.kubernetes.io/part-of: ecommerce
    spec:
      serviceAccountName: ecommerce-search-indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tcr-pull-secret
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-reindex
          image: ccr.ccs.tencentyun.com/sumery/search-indexer:cdc-dev-17fa65a38baa@sha256:b13858aafcc8a5146d3169882b55240ee2dd42a87281d4c6ad181100b392f646
          imagePullPolicy: IfNotPresent
          args:
            - -mode=reindex
            - -index=ecommerce_catalog_products
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-cdc-postgres
                  key: DB_URI
            # 同 deployment.yaml：ES 在集群外，经 node1 的 Pangolin 以 HTTPS 暴露。
            # 全量重建需要建索引与切 alias，因此用的是可写的 indexer key。
            - name: ELASTICSEARCH_URL
              value: https://node3-es.apikv.com
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-search-reindex
                  key: ELASTICSEARCH_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgresql/ca
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: ecommerce-cdc-postgres-ca
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-search-reindex
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-search-reindex
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgresql
      ports:
        - { protocol: TCP, port: 5432 }
    # 同 deployment.yaml：ES 在集群外（node1 的 Pangolin 入口），必须用 ipBlock。
    - to:
        - ipBlock:
            cidr: <node1-source-cidr>
      ports:
        - { protocol: TCP, port: 443 }
