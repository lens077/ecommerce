apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-search-indexer
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-search-indexer
    app.kubernetes.io/component: search-indexer
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-search-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce-search-indexer
        app.kubernetes.io/component: search-indexer
        app.kubernetes.io/part-of: ecommerce
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
      serviceAccountName: ecommerce-search-indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-indexer
          image: ccr.ccs.tencentyun.com/sumery/search-indexer:cdc-dev-17fa65a38baa@sha256:b13858aafcc8a5146d3169882b55240ee2dd42a87281d4c6ad181100b392f646
          imagePullPolicy: IfNotPresent
          args:
            - -mode=run
            - -stream=ECOMMERCE_EVENTS
            - -durable=search-indexer
            - -filter=events.product.>
            - -index=ecommerce_catalog_products
            - -max-deliver=5
            - -max-ack-pending=1
          env:
            - name: NATS_URL
              value: nats://nats.nats.svc:4222
            # Elasticsearch 在集群外的 node3，经 node1 的 Pangolin/Traefik 以 HTTPS
            # 暴露（与 node3-grafana 等同一机制）。仓库只写主机名，凭据走 Secret。
            - name: ELASTICSEARCH_URL
              value: https://node3-es.apikv.com
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-search-indexer
                  key: ELASTICSEARCH_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-search-indexer
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-search-indexer
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
      ports:
        - { protocol: TCP, port: 4222 }
    # Elasticsearch 不在集群内：node3 的 ES 经 node1 的 Pangolin（node1）
    # 以 HTTPS 暴露，因此这里必须是 ipBlock 而不是 namespaceSelector。
    # 少了这条，默认拒绝的 egress 会把 indexer 挡死，且表现为连接超时而非鉴权失败。
    - to:
        - ipBlock:
            cidr: <node1-source-cidr>
      ports:
        - { protocol: TCP, port: 443 }
