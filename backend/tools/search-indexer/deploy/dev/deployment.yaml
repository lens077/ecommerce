apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-search-indexer
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-search-indexer
    app.kubernetes.io/component: search-indexer
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-search-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecommerce-search-indexer
        app.kubernetes.io/component: search-indexer
        app.kubernetes.io/part-of: ecommerce
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-indexer
          image: ccr.ccs.tencentyun.com/sumery/search-indexer:cdc-dev-bdbed8fee9c9@sha256:dc578f10a15f088dcfd6a5bb02b0bf63a302fed11a04ed49115e209137ece50a
          imagePullPolicy: IfNotPresent
          args:
            - -mode=run
            - -stream=ECOMMERCE_EVENTS
            - -durable=search-indexer
            - -filter=events.product.>
            - -index=products
            - -max-deliver=5
            - -max-ack-pending=1
          env:
            - name: NATS_URL
              value: nats://nats.nats.svc:4222
            - name: MEILI_HOST
              value: http://meilisearch.search.svc:7700
            - name: MEILI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-search-indexer
                  key: MEILI_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-search-indexer
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ecommerce-search-indexer
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
      ports:
        - { protocol: TCP, port: 4222 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: search
      ports:
        - { protocol: TCP, port: 7700 }
