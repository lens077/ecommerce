syntax = "proto3";

package conf.v1;

import "third_party/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/lens077/ecommerce/backend/services/behavior/internal/conf/v1;confv1";

message Bootstrap {
  Server server = 1[
    (buf.validate.field).required = true
  ];
  Data data = 2[
    (buf.validate.field).required = true
  ];
  Auth auth = 3[
    (buf.validate.field).required = true
  ];
  Observability observability = 4[
    (buf.validate.field).required = false
  ];
  Discovery discovery = 5[
    (buf.validate.field).required = false
  ];
  Recommend recommend = 6[
    (buf.validate.field).required = true
  ];
  Log log = 7[
    (buf.validate.field).required = true
  ];
}

message Log {
  message Framework {
    string format = 1 [(buf.validate.field).string = {
      in: ["console", "json"]
    }];
    string log_level = 2 [(buf.validate.field).string = {
      in: ["debug", "info", "warn", "error", "dpanic", "panic", "fatal"]
    }];
    string error_level = 3 [(buf.validate.field).string = {
      in: ["debug", "info", "warn", "error", "dpanic", "panic", "fatal"]
    }];
  }

  message Application {
    string format = 1 [(buf.validate.field).string = {
      in: ["console", "json"]
    }];
    string level = 2 [(buf.validate.field).string = {
      in: ["debug", "info", "warn", "error", "dpanic", "panic", "fatal"]
    }];
  }

  Framework framework = 1;
  Application application = 2;
}

message Server {
  string addr = 1 [
    (buf.validate.field).string.host_and_port = true,
    (buf.validate.field).string.example = "0.0.0.0:30001",
    (buf.validate.field).string.example = "localhost:8000"
  ];
  HTTP http = 2;
  Cors cors = 3;
  message HTTP {
    google.protobuf.Duration read_timeout = 1 [
      (buf.validate.field).duration.gte = {seconds: 1},
      (buf.validate.field).duration.example = {seconds: 5}
    ];
    google.protobuf.Duration write_timeout = 2 [
      (buf.validate.field).duration.gte = {seconds: 1},
      (buf.validate.field).duration.example = {seconds: 5}
    ];
    google.protobuf.Duration idle_timeout = 3 [
      (buf.validate.field).duration.gte = {seconds: 1},
      (buf.validate.field).duration.example = {seconds: 5}
    ];
  }
  message Cors {
    repeated string allowed_origins = 1 [
      (buf.validate.field).repeated.items.string.uri = true,
      (buf.validate.field).repeated.items.string.example = "http://localhost:3000"
    ];
  }
}

message Data {
  message Database {
    Postgres postgres = 1;
    message Postgres {
      string host = 1 [
        (buf.validate.field).string.address = true,
        (buf.validate.field).string.example = "localhost"
      ];
      uint32 port = 2 [
        (buf.validate.field).uint32.example = 5432
      ];
      string user = 3 [
        (buf.validate.field).string.example = "postgres"
      ];
      string password = 4 [
        (buf.validate.field).string.example = "postgres"
      ];
      string db_name = 5 [
        (buf.validate.field).string.example = "postgres"
      ];
      string timezone = 7 [
        (buf.validate.field).string.example = "Asia/Shanghai",
        (buf.validate.field).string.example = "UTC"
      ];
      DatabasePool pool = 8;
      Tls tls = 9;

      message DatabasePool {
        uint32 max_conns = 1 [(buf.validate.field).uint32 = {
          gte: 1
        }];
        uint32 min_conns = 2 [(buf.validate.field).uint32 = {
          gte: 1
        }];
        google.protobuf.Duration max_conn_lifetime = 3 [(buf.validate.field).duration.gte = {seconds: 1}];
        google.protobuf.Duration max_conn_idle_time = 4 [(buf.validate.field).duration.gte = {seconds: 1}];
        google.protobuf.Duration ping_timeout = 5 [(buf.validate.field).duration.gte = {seconds: 1}];
      }
      message Tls {
        bool enable = 1;
        string ssl_mode = 6 [
          (buf.validate.field).string = {
            in: ["disable", "allow", "prefer", "require", "verify-ca", "verify-full"]
          },
          (buf.validate.field).string.example = "disable"
        ];
        string ca_pem = 3;
      }
    }
  }

  message Cache {
    Redis redis = 1;
    message Redis {
      string host = 1 [(buf.validate.field).string.address = true];
      uint32 port = 2 [
        (buf.validate.field).uint32.example = 5432
      ];
      string username = 3 [
        (buf.validate.field).string.example = "default"
      ];
      string password = 4 [
        (buf.validate.field).string.example = "password"
      ];
      uint32 db = 5;
      google.protobuf.Duration dial_timeout = 6 [(buf.validate.field).duration.gte = {seconds: 1}];
      google.protobuf.Duration read_timeout = 7 [(buf.validate.field).duration.gte = {seconds: 1}];
      google.protobuf.Duration write_timeout = 8 [(buf.validate.field).duration.gte = {seconds: 1}];
      uint32 pool_size = 9;
      uint32 min_idle_conns = 10 [(buf.validate.field).uint32 = {
        gte: 1
      }];
      Tls tls = 11;

      message Tls {
        bool enable = 1;
        string ca_pem = 2;
        bool insecure_skip_verify = 3;
      }
    }
  }

  Database database = 1;
  Cache cache = 2;
}

message Auth {
  Casdoor casdoor = 1;
  message Casdoor {
    string endpoint = 1 [(buf.validate.field).string.uri = true];
    string client_id = 2;
    string client_secret = 3;
    string organization_name = 4;
    string application_name = 5;
    string certificate = 6;
  }
}

message Observability {
  Trace trace = 1;
  Metric metric = 2;
  Logging log = 3;
  bool enable = 4;

  message Trace {
    string endpoint = 1 [
      (buf.validate.field).string.host_and_port = true,
      (buf.validate.field).string.example = "localhost:4318"
    ];
    Tls tls = 2;
    // 采样率 [0.0, 1.0]。1.0 = 全采,0.0 = 全不采。
    // 用 wrapper 而不是裸 double:proto3 裸 double 的零值就是 0.0,和「没配置」
    // 无法区分 —— 那样所有存量配置(都还没有这个字段)升级后会被解析成 0.0,
    // 等于一条 trace 都不采,而且不报任何错。wrapper 让「没配」是 null,
    // 由代码回落到 1.0,与升级前的 AlwaysSample 行为一致。
    google.protobuf.DoubleValue sample_ratio = 3;
  }
  message Metric {
    string endpoint = 1 [
      (buf.validate.field).string.host_and_port = true,
      (buf.validate.field).string.example = "localhost:4318"
    ];
    Tls tls = 2;
    // 指标导出间隔。不配置回落到 30s。
    // (OTel SDK 默认 60s;这里取 30s,原来硬编码的 3s 对 collector 压力过大)
    google.protobuf.Duration export_interval = 3;
  }
  message Logging {
    string endpoint = 1 [
      (buf.validate.field).string.host_and_port = true,
      (buf.validate.field).string.example = "localhost:4318"
    ];
    Tls tls = 2;
  }
  message Tls {
    bool enable = 1;
    string ca_pem = 2;
    bool insecure_skip_verify = 3;
  }
}

message Discovery {
  message Consul {
    string addr = 1 [
      (buf.validate.field).string.pattern = "^[A-Za-z0-9.-]+(:[0-9]{1,5})?$",
      (buf.validate.field).string.example = "consul.app.com",
      (buf.validate.field).string.example = "consul-expose-servers.consul.svc:8500"
    ];
    string scheme = 2;
    bool health_check = 3;
    Tls tls = 4;
    Check check = 5;

    message Tls {
      bool enable = 1;
      bool insecure_skip_verify = 2;
      string ca_pem = 3;
    }
    message Check {
      TTL ttl = 1;
      string deregister_critical_service_after = 2; // 配置在检查失败后自动注销的时间,单位秒
      message TTL {
        string duration = 1;
        google.protobuf.Duration ping_interval = 2 [
          (buf.validate.field).duration.gte = {seconds: 5}
        ];
      }
    }
  }
  Consul consul = 1;
}

// Recommend 推荐链路配置:上游是 gorse,上行是行为采集。
message Recommend {
  Gorse gorse = 1;
  Ingest ingest = 2;

  message Gorse {
    // gorse-in-one 的 RESTful 端口,形如 http://gorse:8088
    string endpoint = 1 [
      (buf.validate.field).string.uri = true,
      (buf.validate.field).string.example = "http://gorse:8088"
    ];
    // 对应 gorse config.toml 的 [server] api_key,空表示未开启鉴权
    string api_key = 2;
    google.protobuf.Duration timeout = 3 [(buf.validate.field).duration.gte = {seconds: 1}];
    // 关掉之后只落库不投喂,用于 gorse 挂了时保住主链路
    bool enable = 4;
  }

  // Ingest 控制"逛"产生的高频事件如何被削峰。
  message Ingest {
    // 内存队列容量。写满后新事件直接丢弃并计入 dropped,绝不阻塞 Track 请求。
    uint32 queue_size = 1 [(buf.validate.field).uint32.gte = 1];
    // 攒够多少条立即 flush
    uint32 batch_size = 2 [(buf.validate.field).uint32.gte = 1];
    // 没攒够也要 flush 的兜底间隔
    google.protobuf.Duration flush_interval = 3 [(buf.validate.field).duration.gte = {seconds: 1}];
    // 客户端时间戳与服务端时钟的最大允许偏移,超过则用服务端接收时间纠正。
    // 前端时钟不可信,不纠正会污染 gorse 的 positive_feedback_ttl 淘汰。
    google.protobuf.Duration max_clock_skew = 4 [(buf.validate.field).duration.gte = {seconds: 1}];
    // 同一会话内同一商品的曝光去重窗口。列表页滚动会反复触发曝光,不去重会把
    // read_feedback_types 刷爆。
    google.protobuf.Duration impression_dedup_ttl = 5 [(buf.validate.field).duration.gte = {seconds: 1}];
    // 补偿投递:重扫 synced_at IS NULL 的事件重新投喂 gorse 的间隔,0 表示关闭
    google.protobuf.Duration retry_interval = 6;
    // 单次补偿投递最多捞多少条
    uint32 retry_batch_size = 7;
  }
}
