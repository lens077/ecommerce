syntax = "proto3";

package conf.v1;

import "third_party/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/lens077/ecommerce/backend/services/user/internal/conf/v1;confv1";

message Bootstrap {
  Server server = 1[
    (buf.validate.field).required = true
  ];
  Data data = 2[
    (buf.validate.field).required = true
  ];
  Auth auth = 3[
    (buf.validate.field).required = true
  ];
  Observability observability = 4[
    (buf.validate.field).required = false
  ];
  Discovery discovery = 5[
    (buf.validate.field).required = false
  ];
  reserved 6;
  reserved "search";
  Log log = 7[
    (buf.validate.field).required = true
  ];
}

message Log {
  message Framework {
    string format = 1 [(buf.validate.field).string = {
      in: ["console", "json"]
    }];
    string log_level = 2 [(buf.validate.field).string = {
      in: ["debug", "info", "warn", "error", "dpanic", "panic", "fatal"]
    }];
    string error_level = 3 [(buf.validate.field).string = {
      in: ["debug", "info", "warn", "error", "dpanic", "panic", "fatal"]
    }];
  }

  message Application {
    string format = 1 [(buf.validate.field).string = {
      in: ["console", "json"]
    }];
    string level = 2 [(buf.validate.field).string = {
      in: ["debug", "info", "warn", "error", "dpanic", "panic", "fatal"]
    }];
  }

  message ElasticSearch {
    bool enable_request = 1;
    bool enable_response = 2;
  }

  Framework framework = 1;
  Application application = 2;
  ElasticSearch elasticsearch = 3;
}

message Server {
  string addr = 1 [
    (buf.validate.field).string.host_and_port = true,
    (buf.validate.field).string.example = "0.0.0.0:30001",
    (buf.validate.field).string.example = "localhost:8000"
  ];
  HTTP http = 2;
  Cors cors = 3;
  message HTTP {
    google.protobuf.Duration read_timeout = 1 [
      (buf.validate.field).duration.gte = {seconds: 1},
      (buf.validate.field).duration.example = {seconds: 5}
    ];
    google.protobuf.Duration write_timeout = 2 [
      (buf.validate.field).duration.gte = {seconds: 1},
      (buf.validate.field).duration.example = {seconds: 5}
    ];
    google.protobuf.Duration idle_timeout = 3 [
      (buf.validate.field).duration.gte = {seconds: 1},
      (buf.validate.field).duration.example = {seconds: 5}
    ];
  }
  message Cors {
    repeated string allowed_origins = 1 [
      (buf.validate.field).repeated.items.string.uri = true,
      (buf.validate.field).repeated.items.string.example = "http://localhost:3000"
    ];
  }
}

message Data {
  message Database {
    Postgres postgres = 1;
    message Postgres {
      string host = 1 [
        (buf.validate.field).string.address = true,
        (buf.validate.field).string.example = "localhost"
      ];
      uint32 port = 2 [
        (buf.validate.field).uint32.example = 5432
      ];
      string user = 3 [
        (buf.validate.field).string.example = "postgres"
      ];
      string password = 4 [
        (buf.validate.field).string.example = "postgres"
      ];
      string db_name = 5 [
        (buf.validate.field).string.example = "postgres"
      ];
      string timezone = 7 [
        (buf.validate.field).string.example = "Asia/Shanghai",
        (buf.validate.field).string.example = "UTC"
      ];
      DatabasePool pool = 8;
      Tls tls = 9;

      message DatabasePool {
        uint32 max_conns = 1 [(buf.validate.field).uint32 = {
          gte: 1
        }];
        uint32 min_conns = 2 [(buf.validate.field).uint32 = {
          gte: 1
        }];
        google.protobuf.Duration max_conn_lifetime = 3 [(buf.validate.field).duration.gte = {seconds: 1}];
        google.protobuf.Duration max_conn_idle_time = 4 [(buf.validate.field).duration.gte = {seconds: 1}];
        google.protobuf.Duration ping_timeout = 5 [(buf.validate.field).duration.gte = {seconds: 1}];
      }
      message Tls {
        bool enable = 1;
        string ssl_mode = 6 [
          (buf.validate.field).string = {
            in: ["disable", "allow", "prefer", "require", "verify-ca", "verify-full"]
          },
          (buf.validate.field).string.example = "disable"
        ];
        string ca_pem = 3;
      }
    }
  }

  message Cache {
    Redis redis = 1;
    message Redis {
      string host = 1 [(buf.validate.field).string.address = true];
      uint32 port = 2 [
        (buf.validate.field).uint32.example = 5432
      ];
      string username = 3 [
        (buf.validate.field).string.example = "default"
      ];
      string password = 4 [
        (buf.validate.field).string.example = "password"
      ];
      uint32 db = 5;
      google.protobuf.Duration dial_timeout = 6 [(buf.validate.field).duration.gte = {seconds: 1}];
      google.protobuf.Duration read_timeout = 7 [(buf.validate.field).duration.gte = {seconds: 1}];
      google.protobuf.Duration write_timeout = 8 [(buf.validate.field).duration.gte = {seconds: 1}];
      uint32 pool_size = 9;
      uint32 min_idle_conns = 10 [(buf.validate.field).uint32 = {
        gte: 1
      }];
      Tls tls = 11;

      message Tls {
        bool enable = 1;
        string ca_pem = 2;
        bool insecure_skip_verify = 3;
      }
    }
  }

  Database database = 1;
  Cache cache = 2;
}

message Auth {
  Casdoor casdoor = 1;
  message Casdoor {
    string endpoint = 1 [(buf.validate.field).string.uri = true];
    string client_id = 2;
    string client_secret = 3;
    string organization_name = 4;
    string application_name = 5;
    string certificate = 6;
  }
}

message Observability {
  Trace trace = 1;
  Metric metric = 2;
  Logging log = 3;
  bool enable = 4;

  message Trace {
    string endpoint = 1 [
      (buf.validate.field).string.host_and_port = true,
      (buf.validate.field).string.example = "localhost:4318"
    ];
    Tls tls = 2;
    // 采样率 [0.0, 1.0]。1.0 = 全采,0.0 = 全不采。
    // 用 wrapper 而不是裸 double:proto3 裸 double 的零值就是 0.0,和「没配置」
    // 无法区分 —— 那样所有存量配置(都还没有这个字段)升级后会被解析成 0.0,
    // 等于一条 trace 都不采,而且不报任何错。wrapper 让「没配」是 null,
    // 由代码回落到 1.0,与升级前的 AlwaysSample 行为一致。
    google.protobuf.DoubleValue sample_ratio = 3;
  }
  message Metric {
    string endpoint = 1 [
      (buf.validate.field).string.host_and_port = true,
      (buf.validate.field).string.example = "localhost:4318"
    ];
    Tls tls = 2;
    // 指标导出间隔。不配置回落到 30s。
    // (OTel SDK 默认 60s;这里取 30s,原来硬编码的 3s 对 collector 压力过大)
    google.protobuf.Duration export_interval = 3;

    // 指标导出保护:失败按指数退避、连续失败熔断,熔断与恢复各发一次 ntfy 告警,
    // 熔断期间不再向业务日志刷导出错误。不配置时由 go-connect-kit/otelguard 的
    // 默认值兜底(MaxFailures=8、InitialBackoff=2s、MaxBackoff=5m、
    // Multiplier=2.0、Jitter=0.3、ProbeInterval=5m)。
    // ntfy 的 topic 与 token 属于凭据类信息,只写在 Config Center,不落仓库。
    Guard guard = 4;

    message Guard {
      // 显式关闭保护:true 时导出失败恢复为每次采集都打一条错误日志(升级前的行为)。
      // 字段故意叫 disable 而不是 enable:kit 默认已开启保护,裸 bool 的零值恰好是
      // false,用 enable 会让「只写了 ntfy、没写 enable」的服务静默关掉保护。
      // 也不能用 google.protobuf.BoolValue:配置解码走 mapstructure 且没有 wrapper
      // 钩子,那样要求写成 enable: {value: true}(2026-10-07 实测解码报错)。
      bool disable = 1;
      // 连续失败多少次熔断。30s 采集周期下 8 次约 4 分钟;按需下调可更快止噪。
      int32 max_failures = 2 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
      // 首次失败后的退避窗口,之后按 multiplier 递增并封顶 max_backoff。
      // 不配置回落到 2s。
      google.protobuf.Duration initial_backoff = 3 [
        (buf.validate.field).duration.gte = {seconds: 1},
        (buf.validate.field).duration.example = {seconds: 2}
      ];
      // 退避窗口上限。不配置回落到 5m。
      google.protobuf.Duration max_backoff = 4 [
        (buf.validate.field).duration.gte = {seconds: 1},
        (buf.validate.field).duration.example = {seconds: 300}
      ];
      // 退避递增倍数。不配置回落到 2.0。
      double multiplier = 5 [(buf.validate.field).double = {gte: 1, lte: 10}];
      // 退避抖动比例 [0, 1)。裸 double 无法区分「没配置」与「配了 0」,因此 0(含
      // 不写)统一按未配置处理、回落到 kit 默认的 0.3;要更小的抖动就填大于 0 的数。
      // 不能用 google.protobuf.DoubleValue:配置解码走 mapstructure 且没有 wrapper
      // 钩子,那样要求写成 jitter: {value: 0.3},而 JSON Schema 又按裸数字放行——
      // 两个门禁不一致,只在本地有 dev.yml 时才会被解码测试抓到。
      double jitter = 6 [(buf.validate.field).double = {gte: 0, lt: 1}];
      // 熔断后每隔多久放行一次探测导出,探测成功即恢复。不配置回落到 5m。
      google.protobuf.Duration probe_interval = 7 [
        (buf.validate.field).duration.gte = {seconds: 1},
        (buf.validate.field).duration.example = {seconds: 300}
      ];
      // true:熔断即关闭底层导出器,不再探测。用于确定要下线的端点。
      bool hard_shutdown = 8;
      Ntfy ntfy = 9;
    }

    message Ntfy {
      // ntfy 服务地址,形如 https://ntfy.example.com,不带主题路径。
      string url = 1 [(buf.validate.field).string.uri = true];
      // 订阅主题。凭据类信息,不写进仓库与日志。
      string topic = 2 [(buf.validate.field).string.max_len = 128];
      // 可选 Bearer Token。凭据类信息,不写进仓库与日志。
      string token = 3 [(buf.validate.field).string.max_len = 512];
      // 熔断通知的 ntfy Priority 头,不配置用 urgent。
      string alert_priority = 4 [(buf.validate.field).string.max_len = 16];
      // 恢复通知的 ntfy Priority 头,不配置用 default。
      string recovery_priority = 5 [(buf.validate.field).string.max_len = 16];
    }
  }
  message Logging {
    string endpoint = 1 [
      (buf.validate.field).string.host_and_port = true,
      (buf.validate.field).string.example = "localhost:4318"
    ];
    Tls tls = 2;
  }
  message Tls {
    bool enable = 1;
    string ca_pem = 2;
    bool insecure_skip_verify = 3;
  }
}

message Discovery {
  message Consul {
    string addr = 1 [
      (buf.validate.field).string.pattern = "^[A-Za-z0-9.-]+(:[0-9]{1,5})?$",
      (buf.validate.field).string.example = "consul.dev.test",
      (buf.validate.field).string.example = "consul-expose-servers.consul.svc:8500"
    ];
    string scheme = 2;
    bool health_check = 3;
    Tls tls = 4;
    Check check = 5;

    message Tls {
      bool enable = 1;
      bool insecure_skip_verify = 2;
      string ca_pem = 3;
    }
    message Check {
      TTL ttl = 1;
      string deregister_critical_service_after = 2; // 配置在检查失败后自动注销的时间,单位秒
      message TTL {
        string duration = 1;
        google.protobuf.Duration ping_interval = 2 [
          (buf.validate.field).duration.gte = {seconds: 5}
        ];
      }
    }
  }
  Consul consul = 1;
}
