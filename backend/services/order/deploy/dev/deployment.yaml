apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-order-deploy
  labels:
    app: ecommerce-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-order
  template:
    metadata:
      name: ecommerce-order
      labels:
        app: ecommerce-order
    spec:
      containers:
        - name: ecommerce-order
          image: ccr.ccs.tencentyun.com/sumery/order:dev
          imagePullPolicy: Always
          env:
            # 关闭应用内的 Log 导出器，只保留 Trace 和 Metric。
            # 日志输出到 stdout，由部署在 k8s 的 Fluent Bit 统一采集
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # SERVICE_NAME 就是注册进 Consul 的服务名,必须与网关
            # gateway/configs/config.yaml 里的 discovery:///order-service 完全一致
            - name: SERVICE_NAME
              value: "order-service"
            - name: SERVICE_VERSION
              value: "v1"
            - name: DEPLOYMENT_MODE
              value: "dev"
            # CONSUL_* 同时供「读配置」与「服务注册发现」使用
            # 配置数据源:consul(默认) | configcenter。显式二选一,不做失败自动降级。
            - name: CONFIG_SOURCE
              value: "consul"
            # CONSUL_* 同时供「读配置」与「服务注册发现」使用
            - name: CONSUL_ENABLED
              value: "true"
            - name: CONSUL_ADDR
              value: "192.168.3.112:8500"
            - name: CONSUL_SCHEME
              value: "http"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "true"
            - name: CONSUL_PATH
              value: "ecommerce/order/dev.yml"
            # 仅 CONFIG_SOURCE=configcenter 时生效,切到配置中心时把上面改成 configcenter 并放开以下四项:
            # - name: CONFIG_CENTER_ADDR
            #   value: "http://ecommerce-config-service:30010"
            # - name: CONFIG_CENTER_NAMESPACE
            #   value: "order"
            # - name: CONFIG_CENTER_ENV
            #   value: "dev"
            # - name: CONFIG_CENTER_KEY
            #   value: "bootstrap.yaml"
          ports:
            - containerPort: 30004
              protocol: TCP
          # /healthz 在 DB/缓存不通时返回 503。就绪探针据此摘流量;
          # 存活探针只探端口 —— 用 /healthz 做存活会让一次数据库抖动把所有 Pod 连环重启。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 30004
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 30004
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      restartPolicy: Always
