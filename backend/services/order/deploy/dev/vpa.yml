# 该文件供单服务目录部署使用；完整 ecommerce VPA 集合见根目录 application-vpa.yml。
# 当前集群只安装 recommender，因此必须保持 Off，仅生成 requests 推荐值。
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ecommerce-order-vpa
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/component: capacity-recommendation
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-order-deploy
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: ecommerce-order
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
