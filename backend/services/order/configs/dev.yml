  metric:
    endpoint: otlp-http.sumery.com:443
    tls:
      enable: true
      insecure_skip_verify: true
      ca_pem: ""
  log:
    endpoint: otlp-http.sumery.com:443
    tls:
      enable: true
      insecure_skip_verify: true
      ca_pem: ""

discovery:
  consul:
    #addr: apikv.com:8500
    addr: consul.sumery.com:443
    health_check: true
    scheme: https
    check:
      # 服务进入异常状态后，多久将其彻底注销
      deregister_critical_service_after: "6s"
      ttl:
        # 心跳时间间隔, 每过这个设定的值才重新检查一次后端服务是否健康
        duration: "30s"
        # 心跳频率, 根据设置值去告诉Consul后端服务是健康状态
        ping_interval: "25s"
    tls:
      enable: true
      insecure_skip_verify: true
      ca_pem: |-
