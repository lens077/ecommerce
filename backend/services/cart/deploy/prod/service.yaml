apiVersion: v1
kind: Service
metadata:
  name: ecommerce-cart-service
  namespace: ecommerce
spec:
  selector:
    app: ecommerce-cart
  ports:
    # 端口必须命名:HTTPRoute 的 backendRefs 按名字回指,targetPort 也用名字
    # 而不是数字,改容器端口时只动 deployment.yaml 一处
    - name: http
      protocol: TCP
      port: 30006
      targetPort: http
  # 从 LoadBalancer 改成 ClusterIP:入口统一走 httproute.yaml 挂的共享
  # cilium-gateway(有 TLS 终止),不再为一个后端微服务单独占一个 LB IP。
  # 原来的 externalTrafficPolicy: Local 一并去掉 —— 该字段只对
  # LoadBalancer/NodePort 生效,ClusterIP 下留着是死字段。
  # 若要退回裸 LB 暴露,改回 LoadBalancer + externalTrafficPolicy 并删掉 httproute.yaml。
  type: ClusterIP
