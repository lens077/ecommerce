apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-cart-deploy
  labels:
    app: ecommerce-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-cart
  template:
    metadata:
      name: ecommerce-cart
      labels:
        app: ecommerce-cart
    spec:
      containers:
        - name: ecommerce-cart
          image: ccr.ccs.tencentyun.com/sumery/cart:dev
          imagePullPolicy: Always
          env:
            # 关闭应用内的 Log 导出器，只保留 Trace 和 Metric。
            # 日志输出到stdout，由部署在k8s的Fluent Bit 统一采集
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: SERVICE_NAME
              value: cart-service-v1
            # 配置数据源:consul(默认) | configcenter。二选一,不做自动降级。
            - name: CONFIG_SOURCE
              value: "consul"
            # CONSUL_ENABLED/ADDR/SCHEME 同时供服务注册发现使用,与 CONFIG_SOURCE 无关
            - name: CONSUL_ENABLED
              value: "true"
            - name: CONSUL_ADDR
              value: "192.168.3.109:8501"
            - name: CONSUL_SCHEME
              value: "https"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "true"
            # 仅 CONFIG_SOURCE=consul 时用于读配置
            - name: CONSUL_PATH
              value: "ecommerce/cart/pre.yml"
            # 仅 CONFIG_SOURCE=configcenter 时生效,改用配置中心时放开以下四项:
            # - name: CONFIG_CENTER_ADDR
            #   value: "http://config-service:30010"
            # - name: CONFIG_CENTER_NAMESPACE
            #   value: "cart"
            # - name: CONFIG_CENTER_ENV
            #   value: "pre"
            # - name: CONFIG_CENTER_KEY
            #   value: "bootstrap.yaml"
          ports:
            - containerPort: 30006
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
#          envFrom:
#            - configMapRef:
#                name: ecommerce-cart-config
#          livenessProbe:
#            httpGet:
#              path: /healthz
#              port: 30002
#            initialDelaySeconds: 20
#            periodSeconds: 10
#            failureThreshold: 3
#          readinessProbe:
#            httpGet:
#              path: /healthz
#              port: 30002

      restartPolicy: Always
      
