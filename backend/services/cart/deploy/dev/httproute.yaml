# 挂 default 里的共享 cilium-gateway 的 https listener(mode: Terminate,
# 证书是泛域名 global-default-tls,覆盖 *.dev.test),与 config-center /
# otel / grafana / loki / jaeger / vm 完全同一种接法。
#
# ⚠️ 安全前提:cart 自己没有任何鉴权拦截器 —— internal/server/middleware.go
# 只装了 logging 与 otelconnect,身份校验全靠网关的 Casbin。所以这条路由一旦
# apply,cart 的 Connect RPC 就是**匿名可调**的。它只在下面两种情况下成立:
#   1. dev 环境仅限内网,且 cart 已经被网关(discovery:///cart-service)接管,
#      这条 host 只作为绕过网关的调试入口;
#   2. 将来在这条路由上补 Gateway API 的鉴权(如 CiliumEnvoyConfig / ext_authz)。
# 如果要 cart 只走网关、彻底不对外,直接不 apply 这个文件 —— service.yaml
# 已经是 ClusterIP,删掉本文件就没有任何外部入口。
#
# 按 host 而不是按 PathPrefix 区分:Connect 的路径是
# /cart.v1.CartService/xxx,用路径前缀要写死 proto 包名,以后加 RPC 就得改路由。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecommerce-cart-route
  namespace: ecommerce
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "cart-api.dev.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ecommerce-cart-service
          port: 30006
