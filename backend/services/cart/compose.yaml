# 单个微服务的 compose,环境变量与 `make dev` 完全一致。
# 前置:docker network create ecommerce
#
# 注意:容器注册进 Consul 的是它在 ecommerce 网桥里的 IP(172.x),
# 所以调用方(网关)也必须接在同一个 ecommerce 网络里才解析得到;
# 宿主机侧仍可用下面 ports 映射出来的端口直连。
services:

  ecommerce-cart:
    image: ccr.ccs.tencentyun.com/sumery/cart:dev
    container_name: ecommerce-cart
    # 本地改代码后想直接起自己的构建:注释掉上面的 image,放开下面三行
    # build:
    #   context: ../..
    #   dockerfile: services/cart/Dockerfile
    #   args:
    #     SERVICE: cart
    pull_policy: always
    networks:
      - ecommerce
    ports:
      - "0.0.0.0:30006:30006"
    environment:
      # 与 `make dev` 逐项对齐 —— 改一边就要改另一边,否则「本地能跑、compose 跑不起来」
      - SERVICE_NAME=cart-service
      - SERVICE_VERSION=v1
      - DEPLOYMENT_MODE=dev
      # 配置数据源:consul(默认) | configcenter。显式二选一,不做失败自动降级。
      - CONFIG_SOURCE=consul
      # CONSUL_* 同时供「读配置」与「服务注册发现」使用
      - CONSUL_ENABLED=true
      - CONSUL_ADDR=192.168.3.112:8500
      - CONSUL_PATH=ecommerce/cart/dev.yml
      - CONSUL_SCHEME=http
      - CONSUL_INSECURE_SKIP_VERIFY=true
      # --- 切到配置中心时:把 CONFIG_SOURCE 改成 configcenter 并放开下面四行 ---
      # - CONFIG_CENTER_ADDR=http://ecommerce-config:30010
      # - CONFIG_CENTER_NAMESPACE=cart
      # - CONFIG_CENTER_ENV=dev
      # - CONFIG_CENTER_KEY=bootstrap.yaml
      # 日志只走 stdout,不从应用内导出
      - OTEL_LOGS_EXPORTER=none
    healthcheck:
      # /healthz 在 DB/缓存不通时返回 503;镜像是 alpine,用 busybox 自带的 wget
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:30006/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: on-failure:3

networks:
  ecommerce:
    external: true
