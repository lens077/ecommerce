apiVersion: v1
kind: Service
metadata:
  name: ecommerce-payment-service
  namespace: ecommerce
spec:
  selector:
    app: ecommerce-payment
  ports:
    # 端口必须命名:targetPort 用名字回指容器端口,改容器端口时只动 deployment.yaml 一处
    - name: http
      protocol: TCP
      port: 30008
      targetPort: http
  # 业务入口统一走共享 Gateway，不再占用 LB IP、L2 Lease 与 NodePort。
  type: ClusterIP
