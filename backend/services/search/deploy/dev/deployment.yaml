apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-search-deploy
  namespace: ecommerce
  labels:
    app: ecommerce-search
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-search
  template:
    metadata:
      name: ecommerce-search
      labels:
        app: ecommerce-search
        app.kubernetes.io/part-of: ecommerce
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
      serviceAccountName: ecommerce-search
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ecommerce-search
          image: ccr.ccs.tencentyun.com/sumery/search:meili-dev-3cf0771826fe
          imagePullPolicy: Always
          env:
            # 关闭应用内的 Log 导出器，只保留 Trace 和 Metric。
            # 日志输出到 stdout，由部署在 k8s 的 Fluent Bit 统一采集
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # OTLP 鉴权头(Vault → ExternalSecret otel-auth)。optional=true：
            # Secret 未就绪时退回匿名发送而不是 CrashLoop。
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
            # SERVICE_NAME 就是注册进 Consul 的服务名,必须与网关
            # gateway/configs/config.yaml 里的 discovery:///search-product 完全一致
            - name: SERVICE_NAME
              value: "search-product"
            - name: SERVICE_VERSION
              value: "v1"
            - name: DEPLOYMENT_MODE
              value: "dev"
            # Bootstrap 只从挂载的 Config Center selector 读取。
            - name: CONFIG_SOURCE_FILE
              value: "/etc/ecommerce/config-source/search.yaml"
            # Consul 只用于服务注册发现。
            - name: CONSUL_ENABLED
              value: "true"
            - name: CONSUL_ADDR
              value: "consul-server.consul.svc:8500"
            - name: CONSUL_SCHEME
              value: "http"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "false"
            - name: CONSUL_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consul-ecommerce-token
                  key: CONSUL_HTTP_TOKEN
          ports:
            - containerPort: 30002
              protocol: TCP
          # /healthz 深度验证 API key、索引和过滤设置；失败时由就绪探针摘流量。
          # 存活探针只探端口，避免 Meilisearch 短暂抖动触发 Pod 连环重启。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 30002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 30002
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config-source
              mountPath: /etc/ecommerce/config-source
              readOnly: true
      volumes:
        - name: config-source
          secret:
            secretName: ecommerce-config-source-dev
            defaultMode: 0400
            items:
              - key: search.yaml
                path: search.yaml
      restartPolicy: Always
