apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-address-deploy
  namespace: ecommerce
  labels:
    app: ecommerce-address
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-address
  template:
    metadata:
      name: ecommerce-address
      labels:
        app: ecommerce-address
        app.kubernetes.io/part-of: ecommerce
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: ecommerce
      serviceAccountName: ecommerce-address
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ecommerce-address
          image: ccr.ccs.tencentyun.com/sumery/address:sha-c364128@sha256:4c4db8b08408fbab564bbbb0cba2927bc04533b78d7a1b79f5e225403c867f37
          imagePullPolicy: Always
          env:
            # 关闭应用内的 Log 导出器，只保留 Trace 和 Metric。
            # 日志输出到 stdout，由部署在 k8s 的 Fluent Bit 统一采集
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # OTLP 鉴权头(Vault → ExternalSecret otel-auth)。optional=true：
            # Secret 未就绪时退回匿名发送而不是 CrashLoop。
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
            # SERVICE_NAME 就是注册进 Consul 的服务名,必须与网关
            # gateway/configs/config.yaml 里的 discovery:///address-service 完全一致
            - name: SERVICE_NAME
              value: "address-service"
            - name: SERVICE_VERSION
              value: "v1"
            - name: DEPLOYMENT_MODE
              value: "dev"
            # Bootstrap 只从挂载的 Config Center selector 读取。
            - name: CONFIG_SOURCE_FILE
              value: "/etc/ecommerce/config-source/address.yaml"
            # Consul 只用于服务注册发现。2026-09-03 起显式关闭:当前不需要服务发现,
            # 保留接线以备将来启用。注册守护循环(重试/重注册)已在 backend/pkg/registry
            # 修好并用 search 服务实测(重试 72 次后注册成功),开关翻回 "true" 即可生效——见
            # context/project/ecommerce/registry/experience/consul-register-once-then-give-up.md
            - name: CONSUL_ENABLED
              value: "false"
            - name: CONSUL_ADDR
              value: "consul-server.consul.svc:8500"
            - name: CONSUL_SCHEME
              value: "http"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "false"
            - name: CONSUL_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consul-ecommerce-token
                  key: CONSUL_HTTP_TOKEN
          ports:
            - containerPort: 30009
              protocol: TCP
          # /healthz 在 DB/缓存不通时返回 503。就绪探针据此摘流量;
          # 存活探针只探端口 —— 用 /healthz 做存活会让一次数据库抖动把所有 Pod 连环重启。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 30009
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 30009
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config-source
              mountPath: /etc/ecommerce/config-source
              readOnly: true
      volumes:
        - name: config-source
          secret:
            secretName: ecommerce-config-source-dev
            defaultMode: 0400
            items:
              - key: address.yaml
                path: address.yaml
      restartPolicy: Always
