apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-product-deploy
  namespace: ecommerce
  labels:
    app: ecommerce-product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-product
  template:
    metadata:
      name: ecommerce-product
      labels:
        app: ecommerce-product
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ecommerce-product
          image: ccr.ccs.tencentyun.com/sumery/product:dev
          imagePullPolicy: Always
          env:
            # 关闭应用内的 Log 导出器，只保留 Trace 和 Metric。
            # 日志输出到 stdout，由部署在 k8s 的 Fluent Bit 统一采集
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # SERVICE_NAME 就是注册进 Consul 的服务名,必须与网关
            # gateway/configs/config.yaml 里的 discovery:///product-service 完全一致
            - name: SERVICE_NAME
              value: "product-service"
            - name: SERVICE_VERSION
              value: "v1"
            - name: DEPLOYMENT_MODE
              value: "dev"
            # Bootstrap 只从挂载的 Config Center selector 读取。
            - name: CONFIG_SOURCE_FILE
              value: "/etc/ecommerce/config-source/product.yaml"
            # Consul 只用于服务注册发现。
            - name: CONSUL_ENABLED
              value: "true"
            - name: CONSUL_ADDR
              value: "192.168.3.112:8500"
            - name: CONSUL_SCHEME
              value: "http"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "true"
          ports:
            - containerPort: 30003
              protocol: TCP
          # /healthz 在 DB/缓存不通时返回 503。就绪探针据此摘流量;
          # 存活探针只探端口 —— 用 /healthz 做存活会让一次数据库抖动把所有 Pod 连环重启。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 30003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 30003
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config-source
              mountPath: /etc/ecommerce/config-source
              readOnly: true
      volumes:
        - name: config-source
          secret:
            secretName: ecommerce-config-source-dev
            defaultMode: 0400
      restartPolicy: Always
