syntax = "proto3"; // 指定使用 proto3 语法

package payment.v1; // 定义包名，用于命名空间隔离

import "third_party/validate/validate.proto";

// Go 语言生成代码的选项
option go_package = "github.com/lens077/ecommerce/backend/api/payment/v1;paymentv1";

// 定义支付服务接口
service PaymentService {
  // 创建支付订单
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse) {}

  // 查询支付状态
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (GetPaymentStatusResponse) {}

  // 处理支付回调通知
  //  rpc HandlePaymentNotify (HandlePaymentNotifyRequest) returns (HandlePaymentNotifyResponse) {
  rpc HandlePaymentNotify(UrlValues) returns (HandlePaymentNotifyResponse) {}

  // 支付成功后的回调处理
  rpc HandlePaymentCallback(HandlePaymentCallbackRequest) returns (HandlePaymentCallbackResponse) {}
}

// 创建支付订单请求
message CreatePaymentRequest {
  // 2026-08-29 术语统一：买家实体一律 Customer，consumer 让位给 Kafka/NATS 的消息消费者。
  // 走 proto-design.md「删除字段的正确写法」reserved 换号，而不是原地改名——
  // 原地改名会被 buf.yaml 的 FIELD_NO_DELETE_UNLESS_NAME_RESERVED 拦下（已实测 exit 100）。
  reserved 2, 9;
  reserved "consumer_id", "consumer_version";

  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
  string customer_id = 11 [(buf.validate.field).string.uuid = true];
  string amount = 3 [(buf.validate.field).string = {
    max_len: 13
    pattern: "^(?:0\\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,9}(?:\\.[0-9]{1,2})?)$"
  }];
  string currency = 4 [(buf.validate.field).string = {
    len: 3
    pattern: "^[A-Z]{3}$"
  }];
  string subject = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string return_url = 6 [(buf.validate.field).string = {
    max_len: 2048
    uri: true
  }];
  int64 freeze_id = 8 [(buf.validate.field).int64.gt = 0];
  int64 customer_version = 12 [(buf.validate.field).int64.gte = 0];
  repeated int64 merchant_versions = 10 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      int64: {gte: 0}
    }
  }];
}

// 创建支付订单响应
message CreatePaymentResponse {
  int64 payment_id = 1 [(buf.validate.field).int64.gt = 0];
  string pay_url = 2 [(buf.validate.field).string = {
    max_len: 2048
    uri: true
  }];
}

// 查询支付状态请求
message GetPaymentStatusRequest {
  int64 payment_id = 1 [(buf.validate.field).int64.gt = 0];
}

// 支付状态
enum PaymentStatus {
  PAYMENT_STATUS_UNKNOWN = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_SUCCESS = 3;
  PAYMENT_STATUS_FAILED = 4;
  PAYMENT_STATUS_CLOSED = 5;
}

// 查询支付状态响应
message GetPaymentStatusResponse {
  int64 payment_id = 1 [(buf.validate.field).int64.gt = 0];
  int64 order_id = 2 [(buf.validate.field).int64.gt = 0];
  PaymentStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string trade_no = 4 [(buf.validate.field).string.max_len = 255]; // 支付宝交易号
}

// 支付通知请求
//message HandlePaymentNotifyRequest {
//  string charset = 6; // 字符集
//  string app_id = 1;
//  string auth_app_id = 12; // 授权应用ID
//  string trade_no = 2;
//  string method = 7; // 支付方式
//  string sign = 8; // 签名
//  string sign_type = 9; // 签名类型 RSA2
//  string out_trade_no = 3;
//  string total_amount = 4;
//  string seller_id = 14; // 卖家ID
//  map<string, string> params = 11; // 存储所有回调参数
//}

message KeyValue {
  string key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  repeated string values = 2 [(buf.validate.field).repeated = {
    max_items: 10
    items: {
      string: {max_len: 4096}
    }
  }];
}
message UrlValues {
  repeated KeyValue pairs = 1 [(buf.validate.field).repeated.max_items = 64];
}

// 支付通知响应
message HandlePaymentNotifyResponse {
  bool success = 1;
  string message = 2 [(buf.validate.field).string.max_len = 512];
}

// 支付回调请求
message HandlePaymentCallbackRequest {
  string out_trade_no = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string trade_no = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string total_amount = 3 [(buf.validate.field).string = {
    max_len: 13
    pattern: "^(?:0\\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,9}(?:\\.[0-9]{1,2})?)$"
  }];
  string subject = 4 [(buf.validate.field).string.max_len = 255];
  string trade_status = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string charset = 6 [(buf.validate.field).string.max_len = 16]; // 字符集
  string method = 7 [(buf.validate.field).string.max_len = 64]; // 支付方式
  string sign = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }]; // 签名
  string sign_type = 9 [(buf.validate.field).string.max_len = 16]; // 签名类型 RSA2
  string app_id = 10 [(buf.validate.field).string.max_len = 32]; // 应用ID
  string auth_app_id = 12 [(buf.validate.field).string.max_len = 32]; // 授权应用ID
  string version = 13 [(buf.validate.field).string.max_len = 16]; // 版本号
  string seller_id = 14 [(buf.validate.field).string.max_len = 32]; // 卖家ID
  string timestamp = 16 [(buf.validate.field).string.max_len = 32]; // 时间戳
  map<string, string> params = 11 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
    values: {
      string: {max_len: 4096}
    }
  }]; // 存储所有回调参数
}

// 支付回调响应
message HandlePaymentCallbackResponse {
  bool success = 1;
  string message = 2 [(buf.validate.field).string.max_len = 512];
}
