syntax = "proto3";

// 独立搜索功能：按商品名检索商品。
//
// 读侧只查 Elasticsearch 的 ecommerce_catalog_products alias；写入侧由
// Debezium → Kafka → ES Sink 的 CDC 链维护，本服务不写索引
// （拓扑见 .service-matrix.yaml 的 elasticsearch 条目）。

package search.v1;

import "third_party/validate/validate.proto";

option go_package = "github.com/lens077/ecommerce/backend/api/search/v1;searchv1";

service SearchService {
  // Search 按商品名检索商品。
  //
  // 属 anonymous_paths：搜索对未登录访客开放，无需 JWT
  rpc Search(SearchRequest) returns (SearchResponse) {}
}

// 搜索请求
message SearchRequest {
  // 索引由服务端配置选择；保留字段号兼容旧客户端，但忽略传入值
  string index = 1 [
    deprecated = true,
    (buf.validate.field).string.max_len = 255
  ];
  // 搜索关键词（商品名），1–128 字符
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// 搜索响应
message SearchResponse {
  // 命中的商品列表，最多 100 条
  repeated Product products = 1 [(buf.validate.field).repeated.max_items = 100];
}

// 搜索结果里的商品（投影自 ES 文档，字段比 product.v1.ProductSku 少）
message Product {
  // 商品 ID
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  // SPU 编码，1–64 字符
  string spu_code = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // 售价（元，浮点）。展示用途，精确计算应走 product.v1 的 Money
  double price = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 99999999.99
    finite: true
  }];
  // 商品状态：draft / online / offline / deleted
  string status = 4 [(buf.validate.field).string = {
    in: [
      "draft",
      "online",
      "offline",
      "deleted"
    ]
  }];
  // 商品主图 URL，1–500 字符
  string main_media_url = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // 数量字段，无校验约束；语义由 ES 投影侧决定（库存或销量），
  // 消费方不要仅凭字段名推断
  uint32 quantity = 6;
  // 商品名称，1–255 字符
  string name = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}
