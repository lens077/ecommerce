syntax = "proto3";

package order.v1;

import "third_party/validate/validate.proto";

option go_package = "github.com/lens077/ecommerce/backend/api/order/v1;orderv1";

// 订单服务：从购物车勾选项生成订单，以及订单完成后的状态回收。
//
// 依赖现状（见 .service-matrix.yaml）：与 inventory / product / address 的服务间调用
// 还是 depends_on_planned，尚未接线；当前实现只落订单自身的状态。
service orderService {
  // CreateOrder 按用户勾选的购物车项生成订单。
  //
  // 属 guest_paths：访客也能下单，身份由网关注入的 x-md-global-user-id 决定
  // （访客则该头为匿名标识）。
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {}

  // CompleteOrder 标记订单完成，返回订单快照。
  //
  // 幂等：同一 orderNo 重复调用返回同一份订单，不会重复推进状态
  rpc CompleteOrder(CompleteOrderRequest) returns (CompleteOrderResponse) {}
}

// 下单请求
message CreateOrderRequest {
  // 用户在购物车中已选商品的唯一标识，订单服务只需知道用户勾选了哪些购物车项。
  // 1–100 项、项间不可重复
  repeated int64 CartItemIds = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      int64: {gt: 0}
    }
  }];
  // 收货地址 ID，下单时获取快照。
  // 用户可能在提交订单后修改收货地址，但历史订单必须保留当时的地址信息
  string addressId = 2 [(buf.validate.field).string.uuid = true];
  // 订单备注，买家填写，上限 2000 字符
  string remark = 3 [(buf.validate.field).string.max_len = 2000];
}

// 下单响应。订单号等信息由客户端通过后续查询获取
message CreateOrderResponse {}

// 完成订单请求
message CompleteOrderRequest {
  // 业务订单号（非自增 ID），1–64 字符
  string orderNo = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// 完成订单响应
message CompleteOrderResponse {
  // 完成时的订单快照
  Order order = 1 [(buf.validate.field).required = true];
}

// 订单。字段待随 order 域实现补齐，当前是空占位
message Order {}
