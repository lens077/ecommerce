syntax = "proto3";

package address.v1;

option go_package = "github.com/lens077/ecommerce/backend/api/address/v1;addressv1";

import "third_party/validate/validate.proto";

// 行政区划服务。
//
// 放在 address.v1 包里而不是单起一个微服务：Connect 路径天然是
// /address.v1.RegionService/xxx，正好命中网关已有的 /address* 路由，
// 不需要新的 Deployment、Consul 配置和服务发现条目。
//
// 数据是只读字典，未登录用户填地址表单时也要能拿到，
// 所以这些接口在网关的 jwt/rbac router_filter 里是放行的。
service RegionService {
  // 按上级列出行政区划。parent_id 传 0 返回省级列表。
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);
}

// 一个行政区划节点
message Region {
  // 节点ID，级联查询用这个而不是 code —— 港澳的区/堂区在国标里没有编号
  int32 id = 1;
  // 上级节点ID，0 表示省级
  int32 parent_id = 2;
  // 层级：1 省 / 2 市 / 3 区县
  int32 level = 3;
  // GB/T 2260 行政区划代码。港澳的下级及「海外」为空
  string code = 4;
  // 规范中文名，含后缀：北京市 / 朝阳区。落库存的就是这个
  string name = 5;
  // 英文名，仅用于英文界面展示，不参与落库
  string name_en = 6;
  // 拼音，留给后续的搜索/首字母定位
  string pinyin = 7;
}

// 列出行政区划请求
message ListRegionsRequest {
  // 上级节点ID。0 表示取省级列表
  int32 parent_id = 1 [(buf.validate.field).int32.gte = 0];
}

message ListRegionsResponse {
  // 下级列表，已按展示顺序排好。
  // 空列表是合法结果：省直辖县级行政区（海南琼海市、湖北仙桃市等）下面确实没有区县
  repeated Region regions = 1;
}
