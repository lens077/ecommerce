syntax = "proto3";

package address.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "third_party/validate/validate.proto";

option go_package = "github.com/lens077/ecommerce/backend/api/address/v1;addressv1";

// 地址服务
service AddressService {
  // 创建收货地址
  rpc CreateAddress(CreateAddressRequest) returns (CreateAddressResponse);

  // 更新收货地址
  rpc UpdateAddress(UpdateAddressRequest) returns (UpdateAddressResponse);

  // 删除收货地址（软删除）
  rpc DeleteAddress(DeleteAddressRequest) returns (DeleteAddressResponse);

  // 获取单个地址详情
  rpc GetAddress(GetAddressRequest) returns (GetAddressResponse);

  // 获取用户的所有地址列表
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);

  // 设置默认地址
  rpc SetDefaultAddress(SetDefaultAddressRequest) returns (SetDefaultAddressResponse);
}

// 地址详情（值对象，不可变）
message AddressDetail {
  // 省/直辖市/自治区
  string province = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // 城市
  string city = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // 区/县。允许为空：省直辖县级行政区（海南琼海市、湖北仙桃市、新疆石河子市等 49 个）
  // 本身就是市级末端，下面没有区县，硬要求非空等于让这些地方填不出地址。
  string district = 3 [(buf.validate.field).string.max_len = 64];
  // 详细地址（街道、门牌号等）
  string detail = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  // 邮政编码（可选）
  string postal_code = 5 [(buf.validate.field).string.max_len = 16];
  // 完整地址文本，方便前端展示
  string full_text = 6 [(buf.validate.field).string.max_len = 1024];
}

// 创建地址请求
message CreateAddressRequest {
  // 收件人姓名
  string recipient_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // 收件人电话
  string recipient_phone = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
  // 用户ID（从JWT中提取，此处仅作占位）
  string user_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // 地址详情
  AddressDetail detail = 4 [(buf.validate.field).required = true];
  // 是否设为默认地址
  bool is_default = 5;
}

message CreateAddressResponse {
  // 新创建的地址ID
  string address_id = 1 [(buf.validate.field).string.uuid = true];
}

// 更新地址请求
message UpdateAddressRequest {
  // 地址ID
  string address_id = 1 [(buf.validate.field).string.uuid = true];
  // 收件人姓名（可选，不更新则留空）
  google.protobuf.StringValue recipient_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // 收件人电话（可选）
  google.protobuf.StringValue recipient_phone = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
  // 地址详情（可选，不更新则留空）
  AddressDetail detail = 4;
}

message UpdateAddressResponse {}

// 删除地址请求（软删除）
message DeleteAddressRequest {
  // 地址ID
  string address_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteAddressResponse {}

// 获取地址请求
message GetAddressRequest {
  // 地址ID
  string address_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAddressResponse {
  // 地址ID
  string address_id = 1 [(buf.validate.field).string.uuid = true];
  // 收件人姓名
  string recipient_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // 收件人电话
  string recipient_phone = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
  // 用户ID
  string user_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // 地址详情
  AddressDetail detail = 5 [(buf.validate.field).required = true];
  // 是否为默认地址
  bool is_default = 6;
  // 创建时间
  google.protobuf.Timestamp created_at = 7 [(buf.validate.field).required = true];
  // 更新时间
  google.protobuf.Timestamp updated_at = 8 [(buf.validate.field).required = true];
}

// 获取用户所有地址请求
message ListAddressesRequest {}

message ListAddressesResponse {
  // 地址列表
  repeated GetAddressResponse addresses = 1 [(buf.validate.field).repeated.max_items = 100];
}

// 设置默认地址请求
message SetDefaultAddressRequest {
  // 地址ID
  string address_id = 1 [(buf.validate.field).string.uuid = true];
}

message SetDefaultAddressResponse {}
