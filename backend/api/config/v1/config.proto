syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "third_party/validate/validate.proto";

package config.v1;

option go_package = "github.com/lens077/ecommerce/backend/api/config/v1;configv1";

// ConfigService 配置中心服务(键值粒度)。
// 每个 key 独立存储/独立版本历史;value 携带 format 用于语法高亮与校验。
// 鉴权复用网关:网关验 Casdoor JWT 后注入 x-md-global-* 头部,本服务不重复验 JWT。
service ConfigService {
  // 列出某 namespace+environment 下(可按前缀过滤)的 key 元数据,不返回大 value。
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {}
  // 取单个 key 的当前值。
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse) {}
  // 创建或更新 key,产生一条新的版本记录;服务端按 format 校验语法。
  rpc PutKey(PutKeyRequest) returns (PutKeyResponse) {}
  // 删除 key(连同其历史)。
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {}
  // 列出某 key 的版本历史。
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse) {}
  // 取某个历史版本的值。
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {}
  // 回滚:用指定历史版本的值写为新版本。
  rpc Rollback(RollbackRequest) returns (RollbackResponse) {}
}

// 配置内容格式
enum ConfigFormat {
  CONFIG_FORMAT_UNSPECIFIED = 0;
  CONFIG_FORMAT_YAML = 1;
  CONFIG_FORMAT_TOML = 2;
  CONFIG_FORMAT_JSON = 3;
  CONFIG_FORMAT_PLAINTEXT = 4;
}

// 配置项(键 + 当前值 + 元数据)
message ConfigEntry {
  int64 id = 1;
  string namespace = 2;
  string environment = 3;
  string key = 4;
  ConfigFormat format = 5;
  string value = 6;         // ListKeys 中为空(仅元数据);is_secret 时脱敏
  int32 version = 7;
  bool is_secret = 8;
  string description = 9;
  string updated_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// 历史版本记录
message ConfigRevision {
  int64 id = 1;
  int64 entry_id = 2;
  int32 version = 3;
  ConfigFormat format = 4;
  string value = 5;
  string comment = 6;
  string author = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListKeysRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key_prefix = 3; // 可选:按 key 前缀过滤
}
message ListKeysResponse {
  repeated ConfigEntry entries = 1;
}

message GetKeyRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key = 3 [(buf.validate.field).required = true];
}
message GetKeyResponse {
  ConfigEntry entry = 1;
}

message PutKeyRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key = 3 [(buf.validate.field).required = true];
  ConfigFormat format = 4 [(buf.validate.field).enum.defined_only = true];
  string value = 5;
  string comment = 6;      // 变更备注
  bool is_secret = 7;
  string description = 8;
}
message PutKeyResponse {
  ConfigEntry entry = 1;   // 更新后的条目(含新版本号)
}

message DeleteKeyRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key = 3 [(buf.validate.field).required = true];
}
message DeleteKeyResponse {
  bool deleted = 1;
}

message ListRevisionsRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key = 3 [(buf.validate.field).required = true];
}
message ListRevisionsResponse {
  repeated ConfigRevision revisions = 1;
}

message GetRevisionRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key = 3 [(buf.validate.field).required = true];
  int32 version = 4 [(buf.validate.field).int32.gte = 1];
}
message GetRevisionResponse {
  ConfigRevision revision = 1;
}

message RollbackRequest {
  string namespace = 1 [(buf.validate.field).required = true];
  string environment = 2 [(buf.validate.field).required = true];
  string key = 3 [(buf.validate.field).required = true];
  int32 version = 4 [(buf.validate.field).int32.gte = 1]; // 目标回滚版本
  string comment = 5;
}
message RollbackResponse {
  ConfigEntry entry = 1;
}
