  string amazon = 76 [(buf.validate.field).string.max_len = 2048];
  string auth0 = 77 [(buf.validate.field).string.max_len = 2048];
  string battle_net = 78 [(buf.validate.field).string.max_len = 2048];
  string bitbucket = 79 [(buf.validate.field).string.max_len = 2048];
  string box = 80 [(buf.validate.field).string.max_len = 2048];
  string cloud_foundry = 81 [(buf.validate.field).string.max_len = 2048];
  string daily_motion = 82 [(buf.validate.field).string.max_len = 2048];
  string deezer = 83 [(buf.validate.field).string.max_len = 2048];
