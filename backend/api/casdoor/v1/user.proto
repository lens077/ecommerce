syntax = "proto3";

package casdoor.v1;

import "third_party/validate/validate.proto";

option go_package = "github.com/lens077/ecommerce/backend/api/casdoor/v1;casdoorv1";

// ManagedAccount 托管账户
// 用于 SSO 或凭证管理
message ManagedAccount {
  string application = 1 [(buf.validate.field).string.max_len = 128];
  string username = 2 [(buf.validate.field).string.max_len = 256];
  string password = 3 [(buf.validate.field).string.max_len = 4096]; // 敏感字段，通常不应该在 API 响应中出现
  string signin_url = 4 [(buf.validate.field).string.max_len = 2048];
}

// Role 角色
// Casdoor 的角色定义，包含了权限和用户组的嵌套引用
message Role {
  // 基础信息
  string owner = 1 [(buf.validate.field).string.max_len = 128];
  string name = 2 [(buf.validate.field).string.max_len = 128];
  string created_time = 3 [(buf.validate.field).string.max_len = 64];
  string display_name = 4 [(buf.validate.field).string.max_len = 256];
  string description = 5 [(buf.validate.field).string.max_len = 2048];

  // 关系 (使用 repeated string 来表示 Go 中的 []string)
  repeated string users = 6 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string groups = 7 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string roles = 8 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }]; // 角色的嵌套定义
  repeated string domains = 9 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];

  bool is_enabled = 10;
}

// Permission 权限
// Casdoor 的权限定义，详细描述了资源和操作
message Permission {
  // 基础信息
  string owner = 1 [(buf.validate.field).string.max_len = 128];
  string name = 2 [(buf.validate.field).string.max_len = 128];
  string created_time = 3 [(buf.validate.field).string.max_len = 64];
  string display_name = 4 [(buf.validate.field).string.max_len = 256];
  string description = 5 [(buf.validate.field).string.max_len = 2048];

  // 关系
  repeated string users = 6 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string groups = 7 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string roles = 8 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];
  repeated string domains = 9 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];

  // 权限模型 (RBAC)
  string model = 10 [(buf.validate.field).string.max_len = 128];
  string adapter = 11 [(buf.validate.field).string.max_len = 128];
  string resource_type = 12 [(buf.validate.field).string.max_len = 128];
  repeated string resources = 13 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 2048}
    }
  }];
  repeated string actions = 14 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {
      string: {max_len: 256}
    }
  }];
  string effect = 15 [(buf.validate.field).string.max_len = 64];
  bool is_enabled = 16;

  // 审批流程 (如果启用)
  string submitter = 17 [(buf.validate.field).string.max_len = 256];
  string approver = 18 [(buf.validate.field).string.max_len = 256];
  string approve_time = 19 [(buf.validate.field).string.max_len = 64];
  string state = 20 [(buf.validate.field).string.max_len = 64];
}

// 此结构体作为与 Casdoor SDK 交互的完整数据模型
message User {
  // 基础信息 (主键和时间戳)
  string owner = 1 [(buf.validate.field).string.max_len = 128];
  string name = 2 [(buf.validate.field).string.max_len = 128];
  string created_time = 3 [(buf.validate.field).string.max_len = 64]; // 推荐改为 google.protobuf.Timestamp
  string updated_time = 4 [(buf.validate.field).string.max_len = 64]; // 推荐改为 google.protobuf.Timestamp

  // 核心身份信息
  string id = 5 [(buf.validate.field).string.max_len = 128];
  string external_id = 6 [(buf.validate.field).string.max_len = 256];
  string type = 7 [(buf.validate.field).string.max_len = 64];
  string password = 8 [(buf.validate.field).string.max_len = 4096];
  string password_salt = 9 [(buf.validate.field).string.max_len = 1024];
  string password_type = 10 [(buf.validate.field).string.max_len = 64];

  // 个人资料
  string display_name = 11 [(buf.validate.field).string.max_len = 256];
  string first_name = 12 [(buf.validate.field).string.max_len = 128];
  string last_name = 13 [(buf.validate.field).string.max_len = 128];
  string avatar = 14 [(buf.validate.field).string.max_len = 8192];
  string avatar_type = 15 [(buf.validate.field).string.max_len = 64];
  string permanent_avatar = 16 [(buf.validate.field).string.max_len = 8192];
  string email = 17 [(buf.validate.field).string.max_len = 320];
  bool email_verified = 18;
  string phone = 19 [(buf.validate.field).string.max_len = 32];
  string country_code = 20 [(buf.validate.field).string.max_len = 8];
  string region = 21 [(buf.validate.field).string.max_len = 128];
  string location = 22 [(buf.validate.field).string.max_len = 256];
  // Go 结构体中是 []string，Proto 中是 repeated string
  repeated string address = 23 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {max_len: 512}
    }
  }];
  string affiliation = 24 [(buf.validate.field).string.max_len = 256];
  string title = 25 [(buf.validate.field).string.max_len = 256];
  string id_card_type = 26 [(buf.validate.field).string.max_len = 64];
  string id_card = 27 [(buf.validate.field).string.max_len = 128];
  string homepage = 28 [(buf.validate.field).string.max_len = 2048];
  string bio = 29 [(buf.validate.field).string.max_len = 4096];
  string tag = 30 [(buf.validate.field).string.max_len = 512];
  string language = 31 [(buf.validate.field).string.max_len = 32];
  string gender = 32 [(buf.validate.field).string.max_len = 32];
  string birthday = 33 [(buf.validate.field).string.max_len = 32];
  string education = 34 [(buf.validate.field).string.max_len = 256];
  int32 score = 35 [(buf.validate.field).int32.gte = 0];
  int32 karma = 36 [(buf.validate.field).int32.gte = 0];
  int32 ranking = 37 [(buf.validate.field).int32.gte = 0];

  // 状态和权限
  bool is_default_avatar = 38;
  bool is_online = 39;
  bool is_admin = 40;
  bool is_forbidden = 41;
  bool is_deleted = 42;
  string signup_application = 43 [(buf.validate.field).string.max_len = 128];
  string hash = 44 [(buf.validate.field).string.max_len = 1024];
  string pre_hash = 45 [(buf.validate.field).string.max_len = 1024];
  string access_key = 46 [(buf.validate.field).string.max_len = 1024];
  string access_secret = 47 [(buf.validate.field).string.max_len = 4096];

  // 登录记录
  string created_ip = 48 [(buf.validate.field).string.max_len = 45];
  string last_signin_time = 49 [(buf.validate.field).string.max_len = 64];
  string last_signin_ip = 50 [(buf.validate.field).string.max_len = 45];

  // OAuth/SSO 链接 (非常多的字段)
  string github = 51 [(buf.validate.field).string.max_len = 2048];
  string google = 52 [(buf.validate.field).string.max_len = 2048];
  string qq = 53 [(buf.validate.field).string.max_len = 2048];
  string we_chat = 54 [(buf.validate.field).string.max_len = 2048];
  string facebook = 55 [(buf.validate.field).string.max_len = 2048];
  string ding_talk = 56 [(buf.validate.field).string.max_len = 2048];
  string weibo = 57 [(buf.validate.field).string.max_len = 2048];
  string gitee = 58 [(buf.validate.field).string.max_len = 2048];
  string linked_in = 59 [(buf.validate.field).string.max_len = 2048];
  string wecom = 60 [(buf.validate.field).string.max_len = 2048];
  string lark = 61 [(buf.validate.field).string.max_len = 2048];
  string gitlab = 62 [(buf.validate.field).string.max_len = 2048];
  string adfs = 63 [(buf.validate.field).string.max_len = 2048];
  string baidu = 64 [(buf.validate.field).string.max_len = 2048];
  string alipay = 65 [(buf.validate.field).string.max_len = 2048];
  string casdoor = 66 [(buf.validate.field).string.max_len = 2048];
  string infoflow = 67 [(buf.validate.field).string.max_len = 2048];
  string apple = 68 [(buf.validate.field).string.max_len = 2048];
  string azure_ad = 69 [(buf.validate.field).string.max_len = 2048];
  string slack = 70 [(buf.validate.field).string.max_len = 2048];
