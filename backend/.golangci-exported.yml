# 导出符号注释门禁（revive `exported`），只由 scripts/lint-baseline.sh 的 revive-exported
# checker 使用：`golangci-lint run --config backend/.golangci-exported.yml`。
#
# 为什么单独一份配置而不是仓库级 .golangci.yml：本仓的静态检查走「基线棘轮」
# （存量冻结、只拦新增），每个 checker 的规则集要稳定可复现，不能被以后加进
# 仓库级配置的其他 linter 改变采集结果——采集结果一变，基线就整份失效。
# 规则只开 exported：导出的类型/函数/常量/变量必须有以自身名字开头的注释，
# 对应 deepseek-harness 的 verify-export-jsdoc（每个导出名都有文档）。
version: "2"
linters:
  default: none
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            # 生成代码、测试文件由下面的 exclusions 排除；stuttering（包名重复）
            # 单独是另一条规则的事，这里只管「有没有注释、注释是否以名字开头」。
            - checkPrivateReceivers
            - disableStutteringCheck
  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters: [revive]
      - path: (^|/)(api|third_party)/
        linters: [revive]
      - path: \.pb\.go$|\.connect\.go$|\.sqlc\.go$|(^|/)db/.*\.go$
        linters: [revive]
