# 一把拉起全部后端微服务,环境变量与各服务的 `make dev` 逐项一致。
#
# 前置:
#   docker network create ecommerce
#   docker login ccr.ccs.tencentyun.com
# 用法:
#   docker compose up -d              # 全部
#   docker compose up -d ecommerce-cart   # 只起一个
#
# 说明:
# 1. 容器注册进 Consul 的是它在 ecommerce 网桥里的 IP(172.x),网关必须接在同一个
#    网络里才路由得到;宿主机侧仍可用下面映射出来的 30001~30010 直连。
# 2. payment 的 repo 层目前是显式返回 Unimplemented(code 12)的桩,服务本身能起、
#    能注册、健康检查正常;网关 /payment* 打过来会拿到 12 而不是 503。

x-service-common: &service-common
  pull_policy: always
  networks:
    - ecommerce
  restart: on-failure:3

x-consul-env: &consul-env
  # Consul 只用于服务注册发现；Bootstrap 只从 Config Center 读取。
  CONSUL_ENABLED: "true"
  CONSUL_ADDR: "192.168.3.120:8500"
  CONSUL_SCHEME: "http"
  CONSUL_INSECURE_SKIP_VERIFY: "true"
  SERVICE_VERSION: "v1"
  DEPLOYMENT_MODE: "dev"
  CONFIG_SOURCE_FILE: "/etc/ecommerce/config-source.yaml"
  # 日志只走 stdout,不从应用内导出
  OTEL_LOGS_EXPORTER: "none"

services:

  ecommerce-user:
    <<: *service-common
    image: ccr.ccs.tencentyun.com/sumery/user:dev
    container_name: ecommerce-user
    ports:
      - "0.0.0.0:30001:30001"
    environment:
      <<: *consul-env
      # SERVICE_NAME 就是注册进 Consul 的服务名,必须与网关 discovery:///user-identity 一致
      SERVICE_NAME: "user-identity"
    volumes:
      - ./services/user/configs/source.dev.yaml:/etc/ecommerce/config-source.yaml:ro
    healthcheck:
      # /healthz 在 DB/缓存不通时返回 503;镜像是 alpine,用 busybox 自带的 wget
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:30001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  ecommerce-search:
    <<: *service-common
    image: ccr.ccs.tencentyun.com/sumery/search:dev
