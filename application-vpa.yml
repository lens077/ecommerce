# ecommerce 容量校准的 VPA 真相源。
#
# 当前集群只安装 recommender，没有 updater 或 admission-controller。本文件统一使用
# updateMode: Off，只收集推荐值，不修改、驱逐或重建 Pod。推荐值至少覆盖 7 天、一次
# k6 容量窗口和一次正常发布启动窗口后，才能用于调整 Deployment resources.requests。
#
# 不在这里写 minAllowed/maxAllowed：观测阶段必须同时看到 Target 与 Uncapped Target，
# 避免人为边界把拍脑袋值伪装成测量结果。未来即使启用其他 VPA 组件，也只允许控制
# requests；limits 仍由压测、OOM 证据和故障预算决定。

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ecommerce-address-vpa
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce
    app.kubernetes.io/component: capacity-recommendation
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-address-deploy
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: ecommerce-address
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
---
