# 适用对象：无状态微服务，适合通过 VPA 自动调整资源，避免浪费。
# 命名空间：ecommerce

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: address-vpa
  namespace: ecommerce
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: address           # 假设 Deployment 名称为 address
  updatePolicy:
    updateMode: "InPlace"   # 原地调整，无需重启 Pod
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: "50m"
          memory: "128Mi"
        maxAllowed:
          cpu: "200m"
          memory: "512Mi"
---
